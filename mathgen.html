<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모의고사 문제 도우미</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<!--
  모의고사 문제 도우미 (단일 HTML)
  - PDF 를 문항별 이미지로 자르기. "[11~12] 그림과 같이…" 같은 공통 자료는 해당 문항마다 위에 붙인다.
  - AI 로 2022 개정 교육과정 단원 분류, 문항 풀이(정답 교차 확인)
  - 문항 표: 정렬·필터·실제 정답 입력과 채점, 엑셀(.xlsx)/CSV 저장
  - 유사문제·변형문제·개념연계문제 생성 + 독립 풀이 검산
  - AI 제공자: Claude, OpenAI, Google Gemini, OpenAI 호환 서버 (설정 탭에서 API 키 입력)
  - 데이터는 이 브라우저(IndexedDB)에 저장, ZIP/폴더로 내보내기
-->
<style>
:root{
  --bg:#f5f5f1; --panel:#ffffff; --text:#1c1d1f; --muted:#5f636a; --line:#dcded9; --hover:#eeefea;
  --accent:#c8352b; --accent-ink:#ffffff; --accent-weak:#fbebe8; --accent-text:#a32a21;
  --ok:#17794a; --warn:#a45a06; --bad:#b4231a; --shared:#2f5d8a; --shared-weak:#e6eef6;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141516; --panel:#1d1e20; --text:#ebebe7; --muted:#a3a7ad; --line:#33353a; --hover:#26282b;
    --accent:#e2574b; --accent-ink:#1a0d0b; --accent-weak:#3a1d1a; --accent-text:#f2a198;
    --ok:#4cc38a; --warn:#e0a050; --bad:#f47a6f; --shared:#8fb8e3; --shared-weak:#1c2a3a; color-scheme:dark; }
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:6px;font-size:15px;cursor:pointer}
nav button.active{background:var(--accent-weak);color:var(--accent-text);font-weight:600}
#ai-pill{margin-left:auto;font-size:13px;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)} .dot.on{background:var(--ok)}
main{max-width:1280px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;min-width:0}
.muted{color:var(--muted);font-size:.9em}
.row{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
button,select,input,textarea{font:inherit;color:inherit}
button.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button.btn:hover:not(:disabled){background:var(--hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=password],input[type=number],textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
input[type=number]{width:60px}
textarea{width:100%}
label.field{display:grid;gap:4px;font-size:14px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:32px;text-align:center;cursor:pointer}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-weak)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}
.progress>div{height:100%;background:var(--accent);width:0;transition:width .2s}
.log{font-size:13px;color:var(--muted);max-height:130px;overflow:auto;white-space:pre-wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.thumb{background:#fff;border:1px solid var(--line);border-radius:6px;display:block;width:100%;max-height:220px;object-fit:contain;object-position:top}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;position:relative}
.pcard:hover{border-color:var(--accent)}
.pcard .x{position:absolute;top:4px;right:4px;border:1px solid var(--line);background:var(--panel);color:var(--bad);border-radius:4px;cursor:pointer;padding:0 6px}
.tag{display:inline-block;background:var(--accent-weak);color:var(--accent-text);border-radius:4px;padding:0 6px;margin:0 4px 2px 0;font-size:.85em}
.tag.shared{background:var(--shared-weak);color:var(--shared)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.lib{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
@media (max-width:760px){.lib{grid-template-columns:1fr}}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;align-self:start;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
aside .node{display:flex;justify-content:space-between;padding:2px 6px;border-radius:4px;cursor:pointer;font-size:14px}
aside .node:hover{background:var(--hover)}
aside .node.sel{background:var(--accent-weak);color:var(--accent-text)}
aside .l1{font-weight:600;margin-top:6px} aside .l2{padding-left:14px} aside .l3{padding-left:28px;color:var(--muted)}
aside .empty{opacity:.45}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;width:min(1100px,96vw);max-height:92vh;background:var(--panel);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dbody{padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.dbody{grid-template-columns:1fr}}
.dbody img.orig{width:100%;background:#fff;border:1px solid var(--line);border-radius:6px}
.problem{border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0}
.box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:12px}
details{margin-top:6px} summary{cursor:pointer;color:var(--muted)}
.checks{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.checks img{height:220px;border:1px solid var(--line);border-radius:4px;cursor:zoom-in;background:#fff}
.math{overflow-x:auto}
.hidden{display:none!important}
/* 문항 표 */
.tablewrap{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table.sheet{border-collapse:collapse;font-size:13px;min-width:100%}
table.sheet th,table.sheet td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top;white-space:nowrap}
table.sheet th{position:sticky;top:0;background:var(--hover);z-index:1;cursor:pointer;user-select:none;font-weight:600}
table.sheet th.nosort{cursor:default}
table.sheet td.wrap{white-space:normal;min-width:220px;max-width:360px}
table.sheet td.num{text-align:right;font-variant-numeric:tabular-nums}
table.sheet tr:hover td{background:var(--hover)}
table.sheet input[type=text]{width:70px;padding:2px 6px}
table.sheet .linkish{color:var(--accent-text);cursor:pointer;text-decoration:underline}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>모의고사 문제 도우미</h1>
  <nav>
    <button data-tab="ingest" class="active">① PDF 넣기</button>
    <button data-tab="library">② 문제 저장소</button>
    <button data-tab="table">③ 문항 표</button>
    <button data-tab="settings">설정</button>
  </nav>
  <span id="ai-pill" title="AI 설정 열기"><span class="dot" id="ai-dot"></span><span id="ai-label">AI 설정 필요</span></span>
</header>

<main>
<!-- ① PDF 넣기 -->
<section id="tab-ingest">
  <div class="card">
    <div id="drop" class="drop">
      <div style="font-size:17px;font-weight:600">모의고사 PDF를 여기에 끌어다 놓으세요</div>
      <div class="muted">또는 클릭해서 파일 선택 (여러 개 가능)</div>
      <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
    </div>
    <div class="row" style="margin-top:12px">
      <label>자르기 방식
        <select id="split-mode">
          <option value="auto">자동 (텍스트 PDF는 번호 분석, 스캔본은 AI)</option>
          <option value="text">텍스트 분석만 (AI 사용 안 함)</option>
          <option value="vision">AI 이미지 인식 (스캔본용)</option>
        </select>
      </label>
      <label><input id="auto-classify" type="checkbox" checked> 자른 뒤 바로 단원 분류·풀이</label>
      <label><input id="auto-solve" type="checkbox"> 한 번 더 따로 풀어 정답 교차 확인</label>
    </div>
  </div>
  <div id="jobs"></div>
</section>

<!-- ② 문제 저장소 -->
<section id="tab-library" class="hidden">
  <div class="card row">
    <input id="q" type="text" placeholder="검색 (시험명, 개념, 문제 텍스트)" style="flex:1;min-width:200px">
    <select id="f-exam"><option value="">모든 시험</option></select>
    <select id="f-diff"><option value="">모든 난이도</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
    <button class="btn" id="btn-classify-all">미분류 모두 분류</button>
    <button class="btn" id="btn-zip">ZIP으로 내보내기</button>
    <button class="btn" id="btn-folder">폴더에 단원별 저장</button>
    <button class="btn" id="btn-import">백업 불러오기</button>
    <input id="import-file" type="file" accept=".zip" hidden>
  </div>
  <div class="lib">
    <aside id="tree"></aside>
    <div style="min-width:0">
      <div id="lib-status" class="muted" style="margin-bottom:8px"></div>
      <div id="grid" class="grid"></div>
    </div>
  </div>
</section>

<!-- ③ 문항 표 -->
<section id="tab-table" class="hidden">
  <div class="card">
    <div class="row">
      <input id="t-q" type="text" placeholder="검색" style="flex:1;min-width:160px">
      <select id="t-exam"><option value="">모든 시험</option></select>
      <select id="t-subj"><option value="">모든 과목</option></select>
      <select id="t-state">
        <option value="">모든 상태</option>
        <option value="unclassified">미분류</option>
        <option value="unsolved">교차 풀이 안 함</option>
        <option value="mismatch">교차 확인 불일치</option>
        <option value="wrong">채점 오답</option>
      </select>
      <button class="btn" id="t-xlsx">엑셀(.xlsx) 저장</button>
      <button class="btn" id="t-csv">CSV 저장</button>
    </div>
    <div class="row" style="margin-top:10px">
      <span class="muted" id="t-sel">선택 0개</span>
      <button class="btn" id="t-classify">선택 문항 분류</button>
      <button class="btn" id="t-solve">선택 문항 AI 풀이</button>
      <span class="muted">|</span>
      <label>유사 <input type="number" id="t-sim" min="0" max="10" value="2"></label>
      <label>변형 <input type="number" id="t-var" min="0" max="10" value="1"></label>
      <label>개념연계 <input type="number" id="t-con" min="0" max="10" value="1"></label>
      <label><input type="checkbox" id="t-verify" checked> 검산</label>
      <button class="btn primary" id="t-gen">선택 문항 문제 만들기</button>
    </div>
    <div class="muted" id="t-status" style="margin-top:8px"></div>
  </div>
  <div class="tablewrap"><table class="sheet" id="sheet"></table></div>
</section>

<!-- 설정 -->
<section id="tab-settings" class="hidden">
  <div class="card">
    <h3 style="margin-top:0">AI 연결</h3>
    <p class="muted">단원 분류, 스캔본 자르기, 문항 풀이, 문제 생성에 쓰는 AI 입니다. 키는 이 컴퓨터의 브라우저에서 선택한 AI 회사로만 전송됩니다.</p>
    <div class="settings-grid">
      <label class="field">AI 제공자
        <select id="s-provider"></select>
      </label>
      <label class="field">API 키
        <input id="s-key" type="password" autocomplete="off">
      </label>
      <label class="field">모델
        <input id="s-model" type="text" list="s-models" placeholder="모델 이름">
        <datalist id="s-models"></datalist>
      </label>
      <label class="field" id="s-base-wrap">Base URL (OpenAI 호환)
        <input id="s-base" type="text" placeholder="https://openrouter.ai/api/v1">
      </label>
      <label class="field">동시 요청 수
        <input id="s-conc" type="number" min="1" max="8">
      </label>
    </div>
    <p class="muted" id="s-help" style="margin:8px 0 0"></p>
    <div class="row" style="margin-top:12px">
      <label><input id="s-remember" type="checkbox"> 이 브라우저에 키 기억</label>
      <span class="spacer"></span>
      <button class="btn" id="s-list">모델 목록 불러오기</button>
      <button class="btn" id="s-test">연결 테스트</button>
      <button class="btn primary" id="s-save">저장</button>
    </div>
    <div id="s-msg" class="muted" style="margin-top:8px"></div>
  </div>
  <div class="card">
    <h3 style="margin-top:0">데이터</h3>
    <p class="muted">문항과 생성 결과는 이 브라우저 안(IndexedDB)에 저장됩니다. 브라우저 데이터를 지우면 사라지므로 가끔 'ZIP으로 내보내기'로 백업하세요.</p>
    <div id="s-stats" class="muted"></div>
    <button class="btn danger" id="s-wipe" style="margin-top:8px">모든 데이터 삭제</button>
  </div>
</section>
</main>

<dialog id="detail"></dialog>
<dialog id="zoom" style="width:auto;max-width:96vw"><img id="zoom-img" style="max-height:88vh;max-width:94vw;display:block;background:#fff" alt=""></dialog>

<script>
"use strict";
/* =====================================================================
   2022 개정 교육과정 단원표 (mathgen/curriculum.py 와 동일)
   ===================================================================== */
const TREE = [["MS","중학교 수학",[["수와 연산",["소인수분해","정수와 유리수","유리수와 순환소수","제곱근과 실수"]],["변화와 관계",["문자의 사용과 식의 계산","일차방정식","좌표평면과 그래프","연립일차방정식","일차부등식","일차함수와 그래프","다항식의 곱셈과 인수분해","이차방정식","이차함수와 그래프"]],["도형과 측정",["기본 도형과 작도","평면도형과 입체도형","삼각형과 사각형의 성질","도형의 닮음","피타고라스 정리","삼각비","원의 성질"]],["자료와 가능성",["자료의 정리와 해석","경우의 수와 확률","대푯값과 산포도","상관관계"]]]],["CM1","공통수학1",[["다항식",["다항식의 연산","항등식과 나머지정리","인수분해"]],["방정식과 부등식",["복소수와 이차방정식","이차방정식과 이차함수","여러 가지 방정식과 부등식"]],["경우의 수",["합의 법칙과 곱의 법칙","순열과 조합"]],["행렬",["행렬과 그 연산"]]]],["CM2","공통수학2",[["도형의 방정식",["평면좌표","직선의 방정식","원의 방정식","도형의 이동"]],["집합과 명제",["집합","명제"]],["함수와 그래프",["함수","유리함수와 무리함수"]]]],["ALG","대수",[["지수함수와 로그함수",["지수와 로그","지수함수와 로그함수"]],["삼각함수",["삼각함수","사인법칙과 코사인법칙"]],["수열",["등차수열과 등비수열","수열의 합","수학적 귀납법"]]]],["CAL1","미적분I",[["함수의 극한과 연속",["함수의 극한","함수의 연속"]],["미분",["미분계수와 도함수","도함수의 활용"]],["적분",["부정적분과 정적분","정적분의 활용"]]]],["PS","확률과 통계",[["경우의 수",["순열과 조합","이항정리"]],["확률",["확률의 뜻과 활용","조건부확률"]],["통계",["확률분포","통계적 추정"]]]],["CAL2","미적분II",[["수열의 극한",["수열의 극한","급수"]],["미분법",["여러 가지 함수의 미분","여러 가지 미분법","도함수의 활용"]],["적분법",["여러 가지 적분법","정적분의 활용"]]]],["GEO","기하",[["이차곡선",["이차곡선","이차곡선과 직선"]],["공간도형과 공간좌표",["직선과 평면","정사영","공간좌표"]],["벡터",["벡터의 연산","벡터의 성분과 내적"]]]]];

const UNITS = {}, UNIT_IDS = [];
TREE.forEach(([code, subject, chapters], si) => chapters.forEach(([chapter, sections], ci) =>
  sections.forEach((section, ki) => {
    const id = `${code}-${ci + 1}-${ki + 1}`;
    UNITS[id] = {id, si, subject, ci: ci + 1, chapter, ki: ki + 1, section, label: `${subject} > ${chapter} > ${section}`};
    UNIT_IDS.push(id);
  })));
const pad2 = n => String(n).padStart(2, "0");
const unitPath = u => `${pad2(u.si)}_${u.subject}/${pad2(u.ci)}_${u.chapter}/${pad2(u.ki)}_${u.section}`;
const curriculumText = () => TREE.map(([code, subject, chapters]) => `[${subject}]\n` + chapters.map(([chapter, sections], ci) =>

const state = {exams: new Map(), problems: new Map(), filter: {unit: null}, sort: {key: "default", dir: 1}, selected: new Set()};
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("mathgen", 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("exams", {keyPath: "id"}); d.createObjectStore("problems", {keyPath: "id"}); };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  store(name, mode) { return this.db.transaction(name, mode).objectStore(name); },
  all(name) { return this.req(this.store(name, "readonly").getAll()); },
  put(name, obj) { return this.req(this.store(name, "readwrite").put(obj)); },
  del(name, id) { return this.req(this.store(name, "readwrite").delete(id)); },
  clear(name) { return this.req(this.store(name, "readwrite").clear()); },
};

/* =====================================================================
   AI 호출 (제공자별 어댑터 → JSON 객체)

class RetryableError extends Error {}
function errorMessageFrom(status, text) {
  let msg = text;
  try { const j = JSON.parse(text); msg = j.error?.message || j.error?.status || j.message || (typeof j.error === "string" ? j.error : text); } catch (e) { /* 원문 */ }
  if (status === 401 || status === 403) msg = `API 키가 올바르지 않거나 권한이 없습니다. 설정을 확인하세요. (${String(msg).slice(0, 160)})`;
  return `AI 오류 ${status}: ${String(msg).slice(0, 400)}`;
}
async function httpFetch(url, init) {
  let res;
  try { res = await fetch(url, init); } catch (e) { throw new RetryableError("네트워크 오류: " + e.message); }
  if (res.status === 429 || res.status >= 500) {
    const ra = Number(res.headers.get("retry-after")) || 0;
    const err = new RetryableError(errorMessageFrom(res.status, await res.text()));
    err.wait = ra * 1000; throw err;
  }
  if (!res.ok) { const err = new Error(errorMessageFrom(res.status, await res.text())); err.status = res.status; throw err; }
  return res;
}
async function withRetry(fn) {
  for (let attempt = 0; ; attempt++) {
    try { return await fn(); }
    catch (e) {
      if (e instanceof RetryableError && attempt < 4) { await sleep(Math.max(e.wait || 0, 2000 * 2 ** attempt)); continue; }
      throw e;
    }
  }
}
function parseLooseJSON(text) {
  const t = str(text).trim();
  try { return JSON.parse(t); } catch (e) { /* 아래에서 다시 */ }
  const fence = /```(?:json)?\s*([\s\S]*?)```/i.exec(t);
  if (fence) { try { return JSON.parse(fence[1]); } catch (e) { /* 계속 */ } }
  const i = t.search(/[\[{]/), j = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (i >= 0 && j > i) { try { return JSON.parse(t.slice(i, j + 1)); } catch (e) { /* 계속 */ } }
  throw new Error("AI 응답을 JSON 으로 읽지 못했습니다. 다시 시도하세요.");
}
const schemaInstruction = schema => `\n\n[출력 형식]\n다른 설명 없이 아래 JSON 스키마를 만족하는 JSON 객체 하나만 출력하라.\n${JSON.stringify(schema)}`;

// --- Claude (Anthropic Messages API, 스트리밍) ---
const CLAUDE_MODERN = /^claude-(opus|sonnet|fable|mythos)-(5|4-[6-9])|^claude-haiku-5/;
const CLAUDE_FALLBACK = /^claude-(opus-5-5|opus-5$|fable-5-[12]|sonnet-5-5|mythos-5-[12])/;
async function readSSE(res) {
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "", stopReason = null, stopDetails = null;
  for (;;) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true}).replace(/\r\n/g, "\n");
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
      for (const line of chunk.split("\n")) {
        if (!line.startsWith("data:")) continue;
        let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
        if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta") text += ev.delta.text;
        else if (ev.type === "message_delta") { stopReason = ev.delta?.stop_reason ?? stopReason; stopDetails = ev.delta?.stop_details ?? stopDetails; }
        else if (ev.type === "error") {
          const t = ev.error?.type || "", msg = `AI 오류(${t}): ${ev.error?.message || ""}`;
          throw (t === "overloaded_error" || t === "api_error") ? new RetryableError(msg) : new Error(msg);
        }
      }
    }
  }
  return {text, stopReason, stopDetails};
}
async function callClaude({key, model, system, content, schema, effort, maxTokens}) {
  const modern = CLAUDE_MODERN.test(model);
  const body = {model, max_tokens: modern ? maxTokens : Math.min(maxTokens, 16000), stream: true,
    system: [{type: "text", text: modern ? system : system + schemaInstruction(schema), cache_control: {type: "ephemeral"}}],
    messages: [{role: "user", content}]};
  if (modern) { body.thinking = {type: "adaptive"}; body.output_config = {effort, format: {type: "json_schema", schema}}; }
  const headers = {"content-type": "application/json", "x-api-key": key, "anthropic-version": "2026-10-21", "anthropic-dangerous-direct-browser-access": "true"};
  if (CLAUDE_FALLBACK.test(model)) { body.fallbacks = "default"; headers["anthropic-beta"] = "server-side-fallback-2026-07-01"; } // 안전 분류기 거절 시 권장 모델로 자동 재시도
  const res = await httpFetch("https://api.anthropic.com/v1/messages", {method: "POST", headers, body: JSON.stringify(body)});
  const {text, stopReason, stopDetails} = await readSSE(res);
  if (stopReason === "refusal") throw new Error(`AI 가 요청을 거절했습니다 (${stopDetails?.category || "사유 미상"})`);
  if (stopReason === "max_tokens") throw new Error("응답이 너무 길어 잘렸습니다. 한 번에 만드는 문제 수를 줄여 보세요.");
  return text;
}
// --- OpenAI 및 OpenAI 호환 (Chat Completions) ---
async function callOpenAI({base, key, model, system, content, schema, strict}) {
  const user = content.map(b => b.type === "image"
    ? {type: "image_url", image_url: {url: `data:${b.source.media_type};base64,${b.source.data}`}}
    : {type: "text", text: b.text});
  const body = {model, messages: [{role: "system", content: system + schemaInstruction(schema)}, {role: "user", content: user}]};
  body.response_format = strict ? {type: "json_schema", json_schema: {name: "result", strict: true, schema}} : {type: "json_object"};
  const headers = {"content-type": "application/json"};
  if (key) headers.authorization = `Bearer ${key}`;
  const url = base.replace(/\/+$/, "") + "/chat/completions";
  let res;
  try { res = await httpFetch(url, {method: "POST", headers, body: JSON.stringify(body)}); }
  catch (e) {
    if (!strict && e.status === 400) { // response_format 을 모르는 호환 서버
      delete body.response_format;
      res = await httpFetch(url, {method: "POST", headers, body: JSON.stringify(body)});
    } else throw e;
  }
  const data = await res.json();
  const choice = data.choices?.[0];
  if (choice?.message?.refusal) throw new Error("AI 가 요청을 거절했습니다: " + choice.message.refusal);
  if (choice?.finish_reason === "length") throw new Error("응답이 너무 길어 잘렸습니다. 한 번에 만드는 문제 수를 줄여 보세요.");
  const msg = choice?.message?.content;
  return Array.isArray(msg) ? msg.map(m => m.text || "").join("") : str(msg);
}
// --- Google Gemini (generateContent) ---
async function callGemini({key, model, system, content, schema}) {
  const parts = content.map(b => b.type === "image" ? {inlineData: {mimeType: b.source.media_type, data: b.source.data}} : {text: b.text});
  const body = {systemInstruction: {parts: [{text: system + schemaInstruction(schema)}]}, contents: [{role: "user", parts}],
    generationConfig: {responseMimeType: "application/json"}};
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
  const res = await httpFetch(url, {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body)});
  const data = await res.json();
  if (data.promptFeedback?.blockReason) throw new Error("AI 가 요청을 거절했습니다: " + data.promptFeedback.blockReason);
  const cand = data.candidates?.[0];
  if (cand?.finishReason === "MAX_TOKENS") throw new Error("응답이 너무 길어 잘렸습니다. 한 번에 만드는 문제 수를 줄여 보세요.");
  if (cand?.finishReason === "SAFETY") throw new Error("AI 가 안전 정책으로 응답을 막았습니다.");
  return (cand?.content?.parts || []).map(p => p.text || "").join("");
}

async function pageItems(page) {
  const vp = page.getViewport({scale: 1});
  const tc = await page.getTextContent();
  const items = [];
  for (const it of tc.items) {
    if (!it.str || !it.str.trim()) continue;
    const m = pdfjsLib.Util.transform(vp.transform, it.transform);
    const size = Math.hypot(it.transform[2], it.transform[3]) || it.height || 10;
    const x0 = m[4], base = m[5];
    items.push({str: it.str, x0, x1: x0 + (it.width || size * it.str.length * 0.5), y0: base - size * 0.88, y1: base + size * 0.22, base, size, font: it.fontName});
  }

function detectColumns(items, W, H) {
  const usable = items.filter(i => (i.x1 - i.x0) < 0.6 * W && i.y0 > 0.1 * H && i.y1 < 0.92 * H);
  if (!usable.length) return [{x0: 0, x1: W}];
  const left = Math.min(...usable.map(i => i.x0)), right = Math.max(...usable.map(i => i.x1));
  const cover = new Array(Math.ceil(W) + 2).fill(0);
  for (const i of usable) for (let x = Math.max(0, Math.floor(i.x0)); x <= Math.min(cover.length - 1, Math.floor(i.x1)); x++) cover[x]++;

  const findGap = tol => {
    let best = [0, 0], start = null;
    for (let x = lo; x <= hi + 1; x++) {
      if (x <= hi && cover[x] <= tol) { if (start === null) start = x; }
      else if (start !== null) { if (x - start > best[0]) best = [x - start, start]; start = null; }
    }
    return best;
  };
  let best = findGap(0);
  if (best[0] < 8) best = findGap(Math.floor(0.01 * usable.length));
  if (best[0] >= 8) {
    const mid = best[1] + best[0] / 2, m = Math.max(1, Math.min(3, best[0] / 2 - 1));
    return [{x0: Math.max(0, left - 4), x1: mid - m}, {x0: mid + m, x1: Math.min(W, right + 4)}];
  }
  return [{x0: Math.max(0, left - 4), x1: Math.min(W, right + 4)}];

const colOf = (x, cols) => cols.findIndex(c => c.x0 - 2 <= x && x <= c.x1 + 2);
function buildLines(items, cols) {
  const groups = new Map();
  for (const it of items) { const c = colOf((it.x0 + it.x1) / 2, cols); if (!groups.has(c)) groups.set(c, []); groups.get(c).push(it); }
  const lines = [];
  for (const [c, its] of groups) {
    its.sort((a, b) => a.base - b.base || a.x0 - b.x0);
    let cur = null;
    for (const it of its) {
      if (cur && Math.abs(it.base - cur.base) <= Math.max(2, 0.45 * Math.min(it.size, cur.size))) cur.items.push(it);
      else { cur = {col: c, base: it.base, size: it.size, items: [it]}; lines.push(cur); }
    }
  }
  for (const ln of lines) {
    ln.items.sort((a, b) => a.x0 - b.x0);
    let text = "";
    ln.items.forEach((it, k) => { if (k && it.x0 - ln.items[k - 1].x1 > 0.25 * it.size) text += " "; text += it.str; });
    ln.text = text;
    ln.x0 = Math.min(...ln.items.map(i => i.x0)); ln.x1 = Math.max(...ln.items.map(i => i.x1));
    ln.y0 = Math.min(...ln.items.map(i => i.y0)); ln.y1 = Math.max(...ln.items.map(i => i.y1));
    ln.first = ln.items[0];

  for (const ln of lines) {
    if (FOOTER_TEXT_RE.test(ln.text)) {
      const notice = ln.text.includes("확인") && ln.text.includes("사항");
      if (!(ln.y0 > 0.85 * H || notice)) continue;
    } else if (PAGE_NUM_RE.test(ln.text)) {
      if (ln.y0 <= 0.93 * H) continue; // 그래프 눈금 숫자와 구분
    } else continue;
    if (ln.col < 0 || (ln.x1 - ln.x0) > 0.6 * W) tops.forEach((t, i) => tops[i] = Math.min(t, ln.y0));
    else tops[ln.col] = Math.min(tops[ln.col], ln.y0);
  }
  return tops;
}
// 단의 왼쪽 끝: 같은 위치(±3pt)에서 시작하는 줄이 2개 이상인 가장 왼쪽 x
function columnLeft(cl, col) {
  const xs = cl.map(l => l.x0).filter(x => x >= col.x0 - 2).sort((a, b) => a - b);
  if (!xs.length) return Math.min(...cl.map(l => l.x0));
  for (const x of xs) if (xs.filter(y => Math.abs(y - x) <= 3).length >= 2) return x;
  return xs[0];
}
function textMarkers(pageNo, lines, cols) {
  const sizes = [], fontCount = {};
  for (const ln of lines) for (const it of ln.items) { sizes.push(it.size); fontCount[it.font] = (fontCount[it.font] || 0) + it.str.length; }
  const body = median(sizes);
  const bodyFont = Object.keys(fontCount).sort((a, b) => fontCount[b] - fontCount[a])[0];
  const markers = [], groups = [];
  cols.forEach((col, c) => {
    const cl = lines.filter(l => l.col === c);
    if (!cl.length) return;
    const left = columnLeft(cl, col);
    for (const ln of cl) {
      if (ln.x0 - left > 14) continue; // 문항 번호·공통 자료 머리는 단의 왼쪽 끝
      const g = GROUP_RE.exec(ln.text);
      if (g) {
        const a = +g[1], b = +g[2];
        if (a >= 1 && b > a && b - a <= 6) groups.push({from: a, to: b, page: pageNo, col: c, y: ln.y0});
        continue;
      }
      let m = MARKER_RE.exec(ln.text);
      if (!m) { const b = BARE_NUM_RE.exec(ln.first.str); if (b && (ln.first.size > body * 1.1 || ln.first.font !== bodyFont)) m = b; }
      if (!m) continue;
      const n = parseInt(m[1], 10);
      if (n >= 1 && n <= 50) markers.push({number: n, page: pageNo, col: c, y: ln.y0, style: `${ln.first.font}|${Math.round(ln.first.size * 10) / 10}`});
    }
  });
  return {markers, groups};
}
function selectSequence(markers) {
  let ms = [...markers].sort((a, b) => a.page - b.page || a.col - b.col || a.y - b.y);
  if (!ms.length) return [];
  const styles = new Map();
  for (const m of ms) if (m.style !== "vision") { if (!styles.has(m.style)) styles.set(m.style, new Set()); styles.get(m.style).add(m.number); }
  if (styles.size) {
    const dom = [...styles.keys()].sort((a, b) => styles.get(b).size - styles.get(a).size)[0];
    if (styles.get(dom).size >= 3) ms = ms.filter(m => m.style === dom || m.style === "vision");
  }
  const picked = []; let last = null, section = 0;
  ms.forEach((m, i) => {
    if (last === null || m.number === last + 1) { picked.push({...m, section}); last = m.number; }
    else if (m.number !== last) {
      const later = ms.slice(i + 1, i + 4).map(x => x.number);
      if (later.includes(m.number + 1) || (m.number < last && m.number === 1)) {
        if (m.number < last) section++;
        picked.push({...m, section}); last = m.number;
      }
    }
  });
  return picked;
}

const VISION_SYSTEM = `너는 한국 수학 시험지(모의고사) 페이지 이미지의 레이아웃을 읽는 도구다.
- columns: 본문 단(column)의 좌우 경계. 보통 2단이며, 1단이면 하나만.
- problems: 이 페이지에서 '시작하는' 각 문제의 인쇄된 번호(number), 몇 번째 단인지(column, 0부터), 문제 번호가 찍힌 줄의 윗변 y 좌표(y_top).
- groups: 여러 문제가 함께 쓰는 공통 자료(지문·그림)의 머리줄. "[11~12] 그림과 같이 …" 처럼 시작한다. from, to(문항 범위), column, y_top(머리줄 윗변). 없으면 빈 배열.
- column_bottoms: 각 단에서 문제 내용(그림, 선택지 포함)이 끝나는 y 좌표. 쪽 번호, 저작권 문구 같은 꼬리말은 제외.
좌표는 모두 페이지 왼쪽 위가 (0,0), 오른쪽 아래가 (1000,1000) 인 정규화 좌표 정수로 답한다.
문제 번호가 아닌 숫자(선택지 번호, 보기의 번호, 쪽 번호)는 넣지 마라.`;
const VISION_SCHEMA = {type: "object", additionalProperties: false, required: ["columns", "problems", "groups", "column_bottoms"], properties: {
  columns: {type: "array", items: {type: "object", additionalProperties: false, required: ["x0", "x1"], properties: {x0: {type: "integer"}, x1: {type: "integer"}}}},
  problems: {type: "array", items: {type: "object", additionalProperties: false, required: ["number", "column", "y_top"], properties: {number: {type: "integer"}, column: {type: "integer"}, y_top: {type: "integer"}}}},
  groups: {type: "array", items: {type: "object", additionalProperties: false, required: ["from", "to", "column", "y_top"], properties: {from: {type: "integer"}, to: {type: "integer"}, column: {type: "integer"}, y_top: {type: "integer"}}}},
  column_bottoms: {type: "array", items: {type: "integer"}},
}};

async function renderPage(page, scale) {
  const vp = page.getViewport({scale});
  const canvas = document.createElement("canvas");
  canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
  const ctx = canvas.getContext("2d", {willReadFrequently: true});
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({canvasContext: ctx, viewport: vp}).promise;
  return canvas;
}
async function visionLayout(page, pageNo) {
  const vp = page.getViewport({scale: 1});
  const canvas = await renderPage(page, 1500 / Math.max(vp.width, vp.height));
  const data = await askJSON({system: VISION_SYSTEM, schema: VISION_SCHEMA, effort: "medium", maxTokens: 16000,
    content: [imageBlock(canvas.toDataURL("image/jpeg", 0.85)), {type: "text", text: "이 페이지의 레이아웃을 JSON 으로 답하라."}]});
  const W = vp.width, H = vp.height;
  let cols = (Array.isArray(data?.columns) ? data.columns : []).map(c => ({x0: Number(c.x0) / 1000 * W, x1: Number(c.x1) / 1000 * W})).filter(c => c.x1 > c.x0).sort((a, b) => a.x0 - b.x0);
  if (!cols.length) cols = [{x0: 0, x1: W}];
  const colIdx = c => Math.min(Math.max(Number(c) || 0, 0), cols.length - 1);
  const bottoms = cols.map((_, i) => (Number(data?.column_bottoms?.[i]) || 950) / 1000 * H);
  const markers = (Array.isArray(data?.problems) ? data.problems : []).filter(p => Number.isFinite(Number(p.number)))
    .map(p => ({number: Number(p.number), page: pageNo, col: colIdx(p.column), y: Number(p.y_top) / 1000 * H, style: "vision"}));
  const groups = (Array.isArray(data?.groups) ? data.groups : []).filter(g => Number(g.to) > Number(g.from))
    .map(g => ({from: Number(g.from), to: Number(g.to), page: pageNo, col: colIdx(g.column), y: Number(g.y_top) / 1000 * H}));
  return {cols, footer: bottoms.map(b => Math.min(H, b + 0.02 * H)), markers, groups};
}

function trimCanvas(src, sx, sy, sw, sh, pad = 16, thr = 235) {
  sx = Math.max(0, Math.floor(sx)); sy = Math.max(0, Math.floor(sy));
  sw = Math.min(src.width - sx, Math.ceil(sw)); sh = Math.min(src.height - sy, Math.ceil(sh));
  const d = src.getContext("2d", {willReadFrequently: true}).getImageData(sx, sy, sw, sh).data;
  const dark = new Uint8Array(sw * sh), colDark = new Uint32Array(sw);
  for (let i = 0, k = 0; k < sw * sh; i += 4, k++) {
    if (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114 < thr) { dark[k] = 1; colDark[k % sw]++; }
  }
  // 가장자리 근처에서 위아래로 거의 끝까지 이어진 세로줄(단 구분선, 테두리)은 내용으로 치지 않는다
  const edge = Math.max(24, Math.floor(sw * 0.06)), skip = new Uint8Array(sw);
  for (let x = 0; x < sw; x++) if ((x < edge || x >= sw - edge) && colDark[x] > sh * 0.85) skip[x] = 1;
  let minX = sw, minY = sh, maxX = -1, maxY = -1;
  for (let y = 0, k = 0; y < sh; y++) for (let x = 0; x < sw; x++, k++) {
    if (dark[k] && !skip[x]) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  }
  if (maxX < 0) { minX = 0; minY = 0; maxX = sw - 1; maxY = sh - 1; }
  const x0 = Math.max(0, minX - pad), y0 = Math.max(0, minY - pad);
  const x1 = Math.min(sw, maxX + pad + 1), y1 = Math.min(sh, maxY + pad + 1);
  const out = document.createElement("canvas"); out.width = x1 - x0; out.height = y1 - y0;
  const o = out.getContext("2d"); o.fillStyle = "#fff"; o.fillRect(0, 0, out.width, out.height);
  o.drawImage(src, sx + x0, sy + y0, out.width, out.height, 0, 0, out.width, out.height);
  for (let x = x0; x < x1; x++) if (skip[x]) o.fillRect(x - x0, 0, 1, out.height);
  return out;
}

// 공통 자료 이미지를 문항 이미지 위에 붙인다
async function composeShared(groupBlob, problemBlob, label) {
  const [a, b] = await Promise.all([createImageBitmap(groupBlob), createImageBitmap(problemBlob)]);
  const band = 34, gap = 18, W = Math.max(a.width, b.width), H = band + a.height + gap + b.height;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#e6eef6"; g.fillRect(0, 0, W, band);
  g.fillStyle = "#2f5d8a"; g.font = "bold 18px sans-serif"; g.fillText(`공통 자료 [${label}]`, 12, 23);
  g.drawImage(a, 0, band);
  g.strokeStyle = "#9aa4ae"; g.setLineDash([8, 6]); g.lineWidth = 2;
  g.beginPath(); g.moveTo(0, band + a.height + gap / 2); g.lineTo(W, band + a.height + gap / 2); g.stroke();
  g.drawImage(b, 0, band + a.height + gap);
  return canvasToBlob(c);
}

async function splitPdf(buffer, mode, log) {
  const pdf = await pdfjsLib.getDocument({data: buffer, cMapUrl: PDFJS + "cmaps/", cMapPacked: true, standardFontDataUrl: PDFJS + "standard_fonts/"}).promise;
  const layouts = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const {items, W, H} = await pageItems(page);
    const textChars = items.reduce((s, i) => s + i.str.trim().length, 0);
    const useText = mode === "text" || (mode === "auto" && textChars >= 30);
    if (useText) {
      const cols = detectColumns(items, W, H), lines = buildLines(items, cols);
      const {markers, groups} = textMarkers(p - 1, lines, cols);
      layouts.push({cols, footer: footerTops(lines, cols, W, H), markers, groups});
      log(`${p}/${pdf.numPages}쪽 분석 (텍스트, ${cols.length}단${groups.length ? `, 공통 자료 ${groups.length}개` : ""})`);
    } else {
      if (!aiConfigured()) throw new Error(`${p}쪽에 글자 정보가 없는 스캔본입니다. 스캔본을 자르려면 설정 탭에서 AI 를 연결하세요.`);
      log(`${p}/${pdf.numPages}쪽 분석 중 (AI 이미지 인식)…`);
      layouts.push(await visionLayout(page, p - 1));
    }
  }
  const seq = selectSequence(layouts.flatMap(l => l.markers));
  const groups = layouts.flatMap(l => l.groups);
  const order = (a, b) => a.page - b.page || a.col - b.col || a.y - b.y;
  // 다음 문항 번호나 다음 공통 자료 머리 직전까지가 한 영역
  const stopAfter = (page, col, y) => {
    const ys = [...seq, ...groups].filter(x => x.page === page && x.col === col && x.y > y + 1).map(x => x.y);
    return ys.length ? Math.min(...ys) - 3 : layouts[page].footer[col] - 2;
  };
  const rectFor = o => { const col = layouts[o.page].cols[o.col], y0 = Math.max(0, o.y - 4); return [col.x0, y0, col.x1, Math.max(stopAfter(o.page, o.col, o.y), y0 + 20)]; };
  const crops = seq.map((m, i) => ({order: i + 1, number: m.number, section: m.section, page: m.page, at: m, rect: rectFor(m), group: null}));
  const gcrops = groups.map(g => ({...g, label: `${g.from}~${g.to}`, rect: rectFor(g)}));
  // 공통 자료 뒤에 이어 나오는 from~to 번 문항에 연결
  gcrops.forEach((g, gi) => {
    let expect = g.from;
    for (const c of crops) {
      if (order(c.at, g) < 0) continue;
      if (c.number === expect) { c.group = gi; expect++; if (expect > g.to) break; }
      else if (expect > g.from) break;
    }
  });
  const checks = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const canvas = await renderPage(await pdf.getPage(p), RENDER_SCALE);
    const cut = r => { const [x0, y0, x1, y1] = r.map(v => v * RENDER_SCALE); return canvasToBlob(trimCanvas(canvas, x0, y0, x1 - x0, y1 - y0)); };
    const mine = crops.filter(c => c.page === p - 1), mineG = gcrops.filter(g => g.page === p - 1);
    for (const c of mine) c.blob = await cut(c.rect);
    for (const g of mineG) g.blob = await cut(g.rect);
    const s = 0.35, chk = document.createElement("canvas");
    chk.width = Math.ceil(canvas.width * s); chk.height = Math.ceil(canvas.height * s);
    const g = chk.getContext("2d"); g.drawImage(canvas, 0, 0, chk.width, chk.height);
    g.lineWidth = 2; g.font = "bold 14px sans-serif";
    for (const gr of mineG) {
      const [x0, y0, x1, y1] = gr.rect.map(v => v * RENDER_SCALE * s);
      g.strokeStyle = g.fillStyle = "#2f5d8a"; g.setLineDash([6, 4]); g.strokeRect(x0, y0, x1 - x0, y1 - y0); g.setLineDash([]);
      g.fillText(`[${gr.label}]`, x0 + 3, y0 + 14);
    }
    g.strokeStyle = g.fillStyle = "#c8352b";
    for (const c of mine) {
      const [x0, y0, x1, y1] = c.rect.map(v => v * RENDER_SCALE * s);
      g.strokeRect(x0, y0, x1 - x0, y1 - y0); g.fillText(`#${c.order}`, x0 + 3, y0 + 14);
    }
    checks.push(chk.toDataURL("image/jpeg", 0.8));
    log(`${p}/${pdf.numPages}쪽 자르기 완료`);
  }
  for (const c of crops) {
    if (c.group !== null && gcrops[c.group].blob) { c.shared = gcrops[c.group].label; c.blob = await composeShared(gcrops[c.group].blob, c.blob, c.shared); }
    c.image = await blobToDataURL(c.blob);
  }
  return {crops, checks, pages: pdf.numPages, groups: gcrops.map(g => g.label)};
}

/* =====================================================================
   단원 분류 (문항 텍스트, 정답·풀이 포함)
   ===================================================================== */
const SHARED_NOTE = "이미지 맨 위에 '공통 자료 [a~b]' 띠가 있으면 그 아래 지문·그림은 a번~b번 문항이 함께 쓰는 자료다. 자료를 참고하되 아래쪽에 있는 이 문항이 묻는 것만 다뤄라.";
const CLASSIFY_SYSTEM = `너는 한국 고등학교 수학 교사이자 2022 개정 교육과정 전문가다.
모의고사 문항 이미지 한 장을 받으면 다음을 한다. ${SHARED_NOTE}

1. 문제를 그대로 옮겨 적는다(transcription). 수식은 LaTeX 로 $...$ 안에 쓰고, 5지선다면 선택지를 ①~⑤로 함께 적는다.
   공통 자료가 있으면 그 내용도 앞에 함께 옮긴다. 그림이 있으면 그림에 담긴 정보를 figure_description 에 자세히 적는다.
2. 아래 단원표에서 이 문항이 '주로' 다루는 중단원 하나(primary_unit_id)와, 풀이에 함께 쓰이는 다른 중단원들(secondary_unit_ids, 없으면 빈 배열)을 고른다.
   반드시 2022 개정 기준으로 판단한다. (예: 수열의 극한·급수는 미적분II, 지수·로그·삼각함수·수열은 대수, 다항함수의 미적분은 미적분I,
   경우의 수 기초는 공통수학1, 중복조합·이항정리는 확률과 통계, 행렬은 공통수학1)
3. 핵심 개념(key_concepts)과 핵심 접근법(solution_approach)을 쓴다. 접근법은 '어떤 관찰에서 어떤 도구로 넘어가는지'가 드러나게 2~4문장.
4. 직접 끝까지 풀어서 정답(answer)과 풀이(solution)를 쓴다. 5지선다면 정답 번호(1~5)만, 단답형이면 값만 쓴다.
   이미지가 잘려 있거나 정보가 부족해 풀 수 없으면 answer 를 빈 문자열로 둔다.
5. 난이도(difficulty)를 1(기본)~5(최고난도) 정수로 매긴다.

단원표 (코드: 과목 > 대단원 > 중단원)
${curriculumText()}
`;
const UNIT_ENUM = {type: "string", enum: UNIT_IDS};
const CLASSIFY_SCHEMA = {type: "object", additionalProperties: false,
  required: ["transcription", "figure_description", "question_type", "primary_unit_id", "secondary_unit_ids", "key_concepts", "solution_approach", "answer", "solution", "difficulty"],
  properties: {
    transcription: {type: "string"}, figure_description: {type: "string"},
    question_type: {type: "string", enum: ["5지선다", "단답형", "서술형"]},
    primary_unit_id: UNIT_ENUM, secondary_unit_ids: {type: "array", items: UNIT_ENUM},
    key_concepts: {type: "array", items: {type: "string"}}, solution_approach: {type: "string"},
    answer: {type: "string"}, solution: {type: "string"}, difficulty: {type: "integer"},
  }};
function cleanClassification(r) {
  const unit = str(r?.primary_unit_id).trim();
  if (!UNITS[unit]) throw new Error("AI 가 알 수 없는 단원 코드를 냈습니다: " + (unit || "(없음)"));
  return {
    transcription: str(r.transcription), figure_description: str(r.figure_description),
    question_type: ["5지선다", "단답형", "서술형"].includes(r.question_type) ? r.question_type : "단답형",
    primary_unit_id: unit, secondary_unit_ids: strArr(r.secondary_unit_ids).filter(u => UNITS[u] && u !== unit),
    key_concepts: strArr(r.key_concepts), solution_approach: str(r.solution_approach),
    answer: str(r.answer), solution: str(r.solution), difficulty: clampDiff(r.difficulty),
  };
}
async function classifyProblem(id) {
  const p = state.problems.get(id);
  const r = cleanClassification(await askJSON({system: CLASSIFY_SYSTEM, schema: CLASSIFY_SCHEMA, effort: "high",
    content: [imageBlock(p.image), {type: "text", text: `시험: ${p.examTitle}\n문제 번호: ${p.number}번${p.shared ? ` (공통 자료 [${p.shared}] 를 함께 쓰는 문항)` : ""}\n이 문항을 분석해 JSON 으로 답하라.`}]}));
  const cur = {...state.problems.get(id), classification: r, unitId: r.primary_unit_id, unitManual: false};
  await putProblem(cur);
  return cur;
}

/* =====================================================================
   문항 풀이 (분류와 별도로 한 번 더 풀어 정답 교차 확인)
   ===================================================================== */
const SOLVE_SYSTEM = `너는 한국 수능 수학 전문가다. 이미지의 문항을 처음부터 끝까지 정확히 풀어라. ${SHARED_NOTE}
- 계산 결과는 반드시 다시 대입하거나 다른 방법으로 검산한다.
- answer: 5지선다면 정답 번호(1~5)만, 단답형이면 값만. 이미지가 잘려 풀 수 없으면 빈 문자열.
- solution: 단계별 풀이. 수식은 LaTeX 로 $...$ 안에.
- confidence: 풀이에 대한 확신 "high", "medium", "low" 중 하나.`;
const SOLVE_SCHEMA = {type: "object", additionalProperties: false, required: ["answer", "solution", "confidence"],
  properties: {answer: {type: "string"}, solution: {type: "string"}, confidence: {type: "string", enum: ["high", "medium", "low"]}}};
async function solveProblem(id) {
  const p = state.problems.get(id);
  const r = await askJSON({system: SOLVE_SYSTEM, schema: SOLVE_SCHEMA, effort: "high",
    content: [imageBlock(p.image), {type: "text", text: `${p.examTitle} ${p.number}번 문항을 풀어 JSON 으로 답하라.`}]});
  const solve = {answer: str(r?.answer), solution: str(r?.solution), confidence: ["high", "medium", "low"].includes(r?.confidence) ? r.confidence : "medium",
    by: `${settings.provider}:${curModel()}`, at: new Date().toISOString()};
  const cur = {...state.problems.get(id), solve};
  await putProblem(cur);
  return cur;
}
const aiAnswer = p => str(p.solve?.answer || p.classification?.answer);
function crossCheck(p) {
  const a = p.classification?.answer, b = p.solve?.answer;
  if (!p.solve) return "";
  if (!a || !b) return "판단 불가";
  return normalizeAnswer(a) === normalizeAnswer(b) ? "일치" : "불일치";
}
function grade(p) {
  if (!str(p.officialAnswer).trim() || !aiAnswer(p)) return "";
  return normalizeAnswer(p.officialAnswer) === normalizeAnswer(aiAnswer(p)) ? "정답" : "오답";
}

/* =====================================================================
   유사·연계 문제 생성 + 검산
   ===================================================================== */
const KINDS = {
  "유사문제": "원본과 구조·풀이 흐름이 같고 수치·함수·조건만 바꾼 문제. 원본을 푼 학생이 같은 방법으로 풀 수 있어야 한다.",
  "변형문제": "원본과 같은 단원·같은 핵심 개념을 쓰지만 묻는 것이나 조건의 방향을 바꿔 한 단계 다른 사고가 필요한 문제 (예: 역으로 묻기, 조건 추가, 미지수 위치 바꾸기).",
  "개념연계문제": "원본의 핵심 개념이나 접근법(예: 대칭성 이용, 그래프 개형 추론, 경우 나누기, 치환)을 다른 상황이나 다른 단원에 적용하는 문제. 겉모습은 달라도 같은 아이디어로 풀린다.",
};
const GEN_SYSTEM = `너는 한국 수능·모의고사 출제 경험이 많은 수학 교사다. 2022 개정 교육과정 범위 안에서 문제를 만든다.

규칙
- 모든 문제는 교육과정 범위를 벗어나지 않아야 하고, 조건이 모자라거나 넘치지 않아 답이 하나로 정해져야 한다.
- 수식은 LaTeX 로 $...$ (줄 수식은 $$...$$) 안에 쓴다.
- 5지선다면 choices 에 선택지 5개를 넣고 answer 에는 정답 번호(1~5)만 쓴다.
  단답형이면 choices 는 빈 배열, answer 는 값만 쓴다(0 이상 999 이하의 정수 권장).
- 그림이 꼭 필요하면 figure_description 에 그릴 수 있을 만큼 자세히 설명하되, 본문만으로도 풀 수 있게 조건을 글로 적는다. 없으면 빈 문자열.
- 원본이 공통 자료를 쓰는 문항이면, 새 문제는 필요한 자료를 문제 본문 안에 직접 담아 혼자서도 풀리게 만든다.
- 다 만든 뒤 스스로 끝까지 풀어 정답과 풀이(solution)를 확인하고, 계산이 맞지 않으면 문제를 고친다.
- relation_to_original: 원본과 무엇이 같고 무엇이 다른지, 어떤 개념·접근법을 공유하는지.
- unit_id: 아래 단원표 코드 중 새 문제가 주로 다루는 중단원.

문제 유형
${Object.entries(KINDS).map(([k, v]) => `- ${k}: ${v}`).join("\n")}

단원표 (코드: 과목 > 대단원 > 중단원)
${curriculumText()}
`;
const GEN_SCHEMA = {type: "object", additionalProperties: false, required: ["problems"], properties: {problems: {type: "array", items: {
  type: "object", additionalProperties: false,
  required: ["kind", "title", "statement", "choices", "figure_description", "answer", "solution", "shared_concepts", "relation_to_original", "unit_id", "difficulty"],
  properties: {
    kind: {type: "string", enum: Object.keys(KINDS)}, title: {type: "string"}, statement: {type: "string"},
    choices: {type: "array", items: {type: "string"}}, figure_description: {type: "string"},
    answer: {type: "string"}, solution: {type: "string"}, shared_concepts: {type: "array", items: {type: "string"}},
    relation_to_original: {type: "string"}, unit_id: UNIT_ENUM, difficulty: {type: "integer"},
  }}}}};
const VERIFY_SYSTEM = `너는 꼼꼼한 수학 검토자다. 주어진 문제를 처음 보는 학생처럼 직접 풀어라.
- answer: 5지선다면 정답 번호(1~5)만, 단답형이면 값만.
- well_posed: 조건이 모순되지 않고 답이 하나로 정해지며 교육과정 범위 안이면 true.
- issues: 오류, 모호한 표현, 답이 여러 개이거나 없는 문제 등을 구체적으로. 없으면 빈 문자열.
- solution_brief: 핵심 풀이를 3~6줄로.`;
const VERIFY_SCHEMA = {type: "object", additionalProperties: false, required: ["answer", "well_posed", "issues", "solution_brief"],
  properties: {answer: {type: "string"}, well_posed: {type: "boolean"}, issues: {type: "string"}, solution_brief: {type: "string"}}};

const MARKS = "①②③④⑤";
function normalizeAnswer(a) {
  a = str(a).trim();
  [...MARKS].forEach((m, i) => { a = a.split(m).join(String(i + 1)); });
  a = a.replace(/\\text\{[^}]*\}/g, "").replace(/\\[,;!]/g, "").replace(/[\s$]/g, "").replace(/번$/, "");
  return a.replace(/\\dfrac|\\tfrac/g, "\\frac").replace(/\.$/, "");
}
function problemAsText(q) {
  let t = q.statement;
  if (q.figure_description) t += `\n\n[그림 설명] ${q.figure_description}`;
  if (q.choices?.length) t += "\n\n" + q.choices.map((c, i) => `${MARKS[i] || i + 1} ${c}`).join("  ");
  return t;
}
function originalText(p) {
  const c = p.classification || {};
  return [`[원본 문제] ${p.examTitle} ${p.number}번${p.shared ? ` (공통 자료 [${p.shared}] 사용)` : ""}`, `단원: ${UNITS[p.unitId]?.label || ""}`,
    `문제 텍스트:\n${c.transcription || ""}`, `그림 설명: ${c.figure_description || "없음"}`,
    `핵심 개념: ${(c.key_concepts || []).join(", ")}`, `핵심 접근법: ${c.solution_approach || ""}`,
    `정답: ${aiAnswer(p)}`, `풀이:\n${p.solve?.solution || c.solution || ""}`].join("\n");
}
function cleanGenerated(q) {
  const statement = str(q?.statement);
  if (!statement) return null;
  const choices = strArr(q.choices);
  return {
    kind: Object.keys(KINDS).includes(q.kind) ? q.kind : "유사문제", title: str(q.title) || str(q.kind) || "새 문제", statement,
    choices: choices.length === 5 ? choices : [], figure_description: str(q.figure_description), answer: str(q.answer), solution: str(q.solution),
    shared_concepts: strArr(q.shared_concepts), relation_to_original: str(q.relation_to_original),
    unit_id: UNITS[q.unit_id] ? q.unit_id : null, difficulty: clampDiff(q.difficulty),
    createdAt: new Date().toISOString(), by: `${settings.provider}:${curModel()}`,
  };
}
async function generateFor(id, counts, extra, verify, log) {
  let p = state.problems.get(id);
  const wanted = Object.entries(counts).filter(([, n]) => n > 0).map(([k, n]) => `${k} ${n}개`).join(", ");
  if (!wanted) throw new Error("만들 문제 개수를 1개 이상 입력하세요.");
  if (!p.classification) { log("먼저 단원을 분류하는 중…"); p = await classifyProblem(id); }
  let req = `${originalText(p)}\n\n위 원본 문제를 바탕으로 다음을 만들어라: ${wanted}. 각 문제의 kind 를 정확히 표시하라.`;
  if (extra) req += `\n추가 요청: ${extra}`;
  log("문제를 만드는 중… (1~3분 걸릴 수 있습니다)");
  const data = await askJSON({system: GEN_SYSTEM, schema: GEN_SCHEMA, effort: "high", content: [imageBlock(p.image), {type: "text", text: req}]});
  const made = (Array.isArray(data?.problems) ? data.problems : Array.isArray(data) ? data : []).map(cleanGenerated).filter(Boolean);
  if (!made.length) throw new Error("AI 가 문제를 돌려주지 않았습니다. 다시 시도하세요.");
  if (verify) {
    log(`검산 중… (${made.length}문제를 따로 다시 풉니다)`);
    await pool(made, Math.max(1, settings.concurrency | 0), async q => {
      try {
        const v = await askJSON({system: VERIFY_SYSTEM, schema: VERIFY_SCHEMA, effort: "high",
          content: [{type: "text", text: `(${q.choices.length ? "5지선다" : "단답형"})\n${problemAsText(q)}`}]});
        const ans = str(v?.answer), ok = normalizeAnswer(ans) === normalizeAnswer(q.answer), wp = v?.well_posed !== false;
        q.verification = {answer: ans, well_posed: wp, issues: str(v?.issues), solution_brief: str(v?.solution_brief), answer_match: ok, passed: ok && wp};
      } catch (e) { q.verification = {passed: false, error: e.message}; }
    });
  }
  const cur = state.problems.get(id);
  await putProblem({...cur, generated: [...(cur.generated || []), ...made]});
  return made;
}

async function handleFiles(files) {

function uniqueExamId(base) { let id = base, k = 2; while (state.exams.has(id)) id = `${base}_${k++}`; return id; }

async function ingestFile(file) {
  const stem = file.name.replace(/\.pdf$/i, "");
  const examId = uniqueExamId(safeName(stem));
  const job = document.createElement("div");
  job.className = "card";
  job.innerHTML = `
    <div class="row"><b>시험 이름</b><input type="text" class="title" style="flex:1;min-width:200px" value="${esc(stem)}">
      <span class="status muted">준비 중…</span></div>
    <div class="progress"><div></div></div>
    <div class="log"></div>
    <div class="review hidden">
      <div class="muted" style="margin:8px 0 4px">페이지별 자른 영역 (클릭하면 크게 보기). 빨간 상자가 문항, 파란 점선 상자가 여러 문항이 함께 쓰는 공통 자료입니다.</div>
      <div class="checks"></div>
      <div class="row" style="margin:12px 0 8px"><b>자른 문항</b><span class="muted">잘못 잘린 조각은 ✕ 로 지우세요.</span>
        <span class="spacer"></span>
        <button class="btn primary go">단원 분류·풀이 시작</button>
        <button class="btn lib">저장소에서 보기</button>
        <button class="btn danger del">이 시험 삭제</button></div>
      <div class="grid crops"></div>
    </div>`;
  $("#jobs").prepend(job);
  const q = s => job.querySelector(s);
  const log = msg => { q(".log").textContent += msg + "\n"; q(".log").scrollTop = 1e9; };
  const status = (msg, pct) => { q(".status").textContent = msg; if (pct != null) q(".progress>div").style.width = pct + "%"; };

  try {
    const mode = $("#split-mode").value;
    if (mode === "vision" && !aiConfigured()) throw new Error("AI 이미지 인식에는 AI 연결이 필요합니다. 설정 탭에서 입력하세요.");
    status("PDF 분석 중…", 5);
    const {crops, checks, pages, groups} = await splitPdf(await file.arrayBuffer(), mode, log);
    if (!crops.length) throw new Error("문항 번호를 찾지 못했습니다. 자르기 방식을 'AI 이미지 인식'으로 바꿔 다시 넣어 보세요.");
    const title = q(".title").value.trim() || stem;
    await putExam({id: examId, title, fileName: file.name, pages, checks, addedAt: new Date().toISOString()});
    for (const c of crops) {
      await putProblem({id: `${examId}_q${pad2(c.order)}`, examId, examTitle: title, order: c.order, number: c.number, section: c.section,
        page: c.page + 1, image: c.image, shared: c.shared || null, classification: null, unitId: null, solve: null, officialAnswer: "", generated: []});
    }
    const gaps = [];
    for (let i = 1; i < crops.length; i++) { const a = crops[i - 1], b = crops[i]; if (b.section === a.section && b.number !== a.number + 1) gaps.push(`${a.number}→${b.number}`); }
    log(`문항 ${crops.length}개: ${crops.map(c => c.number).join(", ")}`);
    if (groups.length) log(`공통 자료 ${groups.length}개: ${groups.map(g => `[${g}]`).join(", ")} → 해당 문항 이미지 위에 붙였습니다.`);
    if (gaps.length) log(`⚠ 번호가 건너뛴 곳: ${gaps.join(", ")}. 아래 페이지 이미지를 확인하세요.`);
    status(`자르기 완료: 문항 ${crops.length}개`, 30);
    showReview();
    if ($("#auto-classify").checked) {
      if (aiConfigured()) await runAI();
      else { log("AI 가 연결되지 않아 분류는 건너뜁니다. 설정 탭에서 연결한 뒤 '단원 분류·풀이 시작'을 누르세요."); status(`자르기 완료: 문항 ${crops.length}개 (미분류)`, 100); }
    } else status(`자르기 완료: 문항 ${crops.length}개`, 100);
  } catch (e) {
    console.error(e);
    status("오류", 100); q(".status").classList.add("bad"); log("오류: " + e.message);
  }

  function showReview() {
    const exam = state.exams.get(examId);
    q(".review").classList.remove("hidden");
    q(".checks").innerHTML = exam.checks.map((c, i) => `<img src="${c}" alt="${i + 1}쪽" title="${i + 1}쪽">`).join("");
    q(".checks").querySelectorAll("img").forEach(img => img.onclick = () => zoom(img.src));
    renderCrops();
  }
  function renderCrops() {
    const ps = [...state.problems.values()].filter(p => p.examId === examId).sort((a, b) => a.order - b.order);
    q(".crops").innerHTML = ps.map(p => `<div class="pcard" data-id="${esc(p.id)}"><button class="x" title="삭제">✕</button>
      <img class="thumb" src="${p.image}" alt=""><div><b>${p.number}번</b>${p.section ? ` <span class="muted">(구간 ${p.section + 1})</span>` : ""}
      ${p.shared ? `<span class="tag shared">공통 자료 ${esc(p.shared)}</span>` : ""}</div>
      <div class="muted">${p.unitId ? esc(UNITS[p.unitId].label) : "미분류"}${aiAnswer(p) ? ` · AI 정답 ${esc(aiAnswer(p))}` : ""}</div></div>`).join("");
    q(".crops").querySelectorAll(".pcard").forEach(card => {
      card.onclick = () => openDetail(card.dataset.id, renderCrops);
      card.querySelector(".x").onclick = async ev => { ev.stopPropagation(); await deleteProblem(card.dataset.id); renderCrops(); };
    });
  }
  async function runAI() {
    const mine = () => [...state.problems.values()].filter(p => p.examId === examId);
    const todo = mine().filter(p => !p.classification).map(p => p.id);
    const solveToo = $("#auto-solve").checked;
    const toSolve = solveToo ? mine().filter(p => !p.solve).map(p => p.id) : [];
    if (!todo.length && !toSolve.length) { status("모두 처리했습니다", 100); return; }
    q(".go").disabled = true;
    const total = todo.length + toSolve.length; let n = 0; const errors = [];
    status(`AI 처리 중… 0/${total}`, 30);
    await pool([...todo.map(id => ["c", id]), ...toSolve.map(id => ["s", id])], Math.max(1, settings.concurrency | 0), async ([kind, id]) => {
      const p0 = state.problems.get(id);
      try {
        const p = kind === "c" ? await classifyProblem(id) : await solveProblem(id);
        log(kind === "c" ? `${p.number}번 → ${UNITS[p.unitId].label} · 난이도 ${p.classification.difficulty} · AI 정답 ${p.classification.answer || "?"}`
          : `${p.number}번 풀이 → 정답 ${p.solve.answer || "?"} (${p.solve.confidence})`);
      } catch (e) { errors.push(`${p0.number}번: ${e.message}`); }

    status(errors.length ? `완료 (실패 ${errors.length}건, 다시 누르면 실패한 것만 재시도)` : "단원 분류·풀이 완료", 100);
    q(".go").disabled = false;
  }
  q(".title").onchange = async () => {
    const t = q(".title").value.trim(), exam = state.exams.get(examId); if (!t || !exam) return;
    await putExam({...exam, title: t});
    for (const p of [...state.problems.values()]) if (p.examId === examId) await putProblem({...p, examTitle: t});
  };
  q(".go").onclick = () => runAI().catch(e => log("오류: " + e.message));
  q(".lib").onclick = () => { showTab("library"); $("#f-exam").value = examId; renderGrid(); };
  q(".del").onclick = async () => { if (confirm("이 시험과 자른 문항을 모두 삭제할까요?")) { await deleteExam(examId); job.remove(); } };
}

function renderTree() {

    if (p.unitId) { const [code, ci] = p.unitId.split("-"); count[code] = (count[code] || 0) + 1; count[`${code}-${ci}`] = (count[`${code}-${ci}`] || 0) + 1; }

  let h = `<div class="node l1 ${state.filter.unit ? "" : "sel"}" data-k=""><span>전체</span><span>${ps.length}</span></div>`;
  for (const [code, subject, chapters] of TREE) {

    chapters.forEach(([chapter, sections], ci) => {

      sections.forEach((s, ki) => { h += node(`${code}-${ci + 1}-${ki + 1}`, s, "l3"); });

async function runBatch(ids, fn, label, onDone) {
  if (!ids.length) return alert("처리할 문항이 없습니다.");
  if (!aiConfigured()) { showTab("settings"); return; }
  const st = $("#t-status"); let n = 0; const errors = [];
  st.textContent = `${label} 0/${ids.length}`;
  await pool(ids, Math.max(1, settings.concurrency | 0), async id => {
    try { await fn(id); } catch (e) { errors.push(`${state.problems.get(id)?.number}번: ${e.message}`); }
    st.textContent = `${label} ${++n}/${ids.length}`; refreshViews();

function tableRows() {
  const text = $("#t-q").value.trim().toLowerCase(), exam = $("#t-exam").value, subj = $("#t-subj").value, st = $("#t-state").value;

    if (subj && UNITS[p.unitId]?.subject !== subj) return false;
    if (st === "unclassified" && p.classification) return false;
    if (st === "unsolved" && p.solve) return false;
    if (st === "mismatch" && crossCheck(p) !== "불일치") return false;
    if (st === "wrong" && grade(p) !== "오답") return false;
    return !text || searchHay(p).includes(text);
  });
  const {key, dir} = state.sort;
  const col = COLS.find(c => c.k === key);
  rows.sort((a, b) => {
    if (col) {
      const x = col.v(a), y = col.v(b);
      const r = col.num ? (Number(x) || 0) - (Number(y) || 0) : String(x).localeCompare(String(y), "ko");
      if (r) return r * dir;
    }

  const renderGens = () => {
    const gs = cur()?.generated || [];
    q(".gens").innerHTML = gs.length ? gs.map((g, i) => generatedHTML(g, i, true)).join("") : `<p class="muted">아직 만든 문제가 없습니다.</p>`;
    q(".gens").querySelectorAll(".gdel").forEach(b => b.onclick = async () => {
      const i = +b.closest(".problem").dataset.i, x = cur();
      await putProblem({...x, generated: x.generated.filter((_, k) => k !== i)}); renderGens(); changed();
    });
    q(".sheet").disabled = !gs.length;
    renderMath(q(".gens"));
  };
  renderGens(); renderMath(d);
  q(".close").onclick = () => d.close();
  q(".unit").onchange = async () => { await putProblem({...cur(), unitId: q(".unit").value || null, unitManual: true}); q(".msg").textContent = "단원을 바꿨습니다."; changed(); };
  q(".official").onchange = async () => { await putProblem({...cur(), officialAnswer: q(".official").value.trim()}); changed(); openDetail(id, onChange); };
  const aiButton = (sel, fn, busy) => q(sel).onclick = async () => {
    q(sel).disabled = true; q(".msg").textContent = busy;
    try { await fn(id); changed(); openDetail(id, onChange); }
    catch (e) { q(".msg").textContent = "오류: " + e.message; q(sel).disabled = false; }
  };
  aiButton(".reclass", classifyProblem, "분류 중…");
  aiButton(".resolve", solveProblem, "푸는 중…");
  q(".save-img").onclick = () => download(`${p.id}.png`, dataURLtoBlob(p.image));
  q(".delp").onclick = async () => { if (confirm("이 문항을 삭제할까요?")) { await deleteProblem(p.id); d.close(); changed(); } };
  q(".gen").onclick = async () => {
    const counts = {"유사문제": +q(".n-sim").value || 0, "변형문제": +q(".n-var").value || 0, "개념연계문제": +q(".n-con").value || 0};
    q(".gen").disabled = true;
    try {
      const made = await generateFor(id, counts, q(".extra").value.trim(), q(".verify").checked, m => q(".genmsg").textContent = m);
      const bad = made.filter(m => m.verification && !m.verification.passed).length;
      q(".genmsg").textContent = `${made.length}문제를 만들었습니다.` + (bad ? ` 검산 불일치 ${bad}건은 꼭 확인하세요.` : "");
      renderGens(); changed();
    } catch (e) { q(".genmsg").textContent = "오류: " + e.message; }
    q(".gen").disabled = false;
  };
  q(".sheet").onclick = () => download(`${p.id}_연계문제.html`, new Blob([worksheetHTML(cur())], {type: "text/html"}));
  if (!d.open) d.showModal();
}

/* =====================================================================
   내보내기 / 가져오기
   ===================================================================== */
function worksheetHTML(p) {
  const c = p.classification || {};
  return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(p.examTitle)} ${p.number}번 연계 문제</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"><\/script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})"><\/script>
<style>body{font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;max-width:860px;margin:0 auto;padding:16px;line-height:1.7;color:#1d1d1f;background:#fff}
.muted{color:#6b7280;font-size:.9em}img{max-width:min(100%,640px);border:1px solid #e5e7eb;border-radius:6px}
.problem{border:1px solid #e5e7eb;border-radius:8px;padding:16px;margin:16px 0;break-inside:avoid}
.tag{display:inline-block;background:#fbebe8;color:#a32a21;border-radius:4px;padding:0 6px;margin-right:4px;font-size:.85em}
.ok{color:#047857}.warn{color:#a45a06}summary{cursor:pointer;color:#374151}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.spacer{flex:1}
@media print{details{display:none}}</style></head><body>
<h1>${esc(p.examTitle)} ${p.number}번 — 유사·연계 문제</h1>
<img src="${p.image}" alt="원본 문제">
<p><span class="tag">${esc(UNITS[p.unitId]?.label || "미분류")}</span></p>
<p><b>핵심 개념</b> ${esc((c.key_concepts || []).join(", "))}<br><b>핵심 접근법</b> ${escBr(c.solution_approach || "")}</p>
${(p.generated || []).map((g, i) => generatedHTML(g, i, false)).join("\n")}
</body></html>`;
}
function backupObject() {
  return {format: "mathgen-backup", version: 2, exportedAt: new Date().toISOString(), exams: [...state.exams.values()], problems: [...state.problems.values()]};
}
function exportEntries() {
  const entries = [], index = [];
  for (const p of state.problems.values()) {
    const png = dataURLtoBlob(p.image);
    entries.push([`exams/${p.examId}/q${pad2(p.order)}.png`, png]);
    const u = UNITS[p.unitId];
    entries.push([`units/${u ? unitPath(u) : "99_미분류"}/${p.id}.png`, png]);
    if (p.generated?.length) entries.push([`generated/${p.id}.html`, worksheetHTML(p)]);
    const {image, ...meta} = p;
    index.push({...meta, unitLabel: u?.label || null});
  }
  entries.push(["index.json", JSON.stringify(index, null, 2)]);
  entries.push(["backup.json", JSON.stringify(backupObject())]);
  return entries;
}
$("#btn-zip").onclick = async () => {
  if (!state.problems.size) return alert("내보낼 문항이 없습니다.");
  const zip = new JSZip();
  for (const [path, data] of exportEntries()) zip.file(path, data);
  download(`문제저장소_${new Date().toISOString().slice(0, 10)}.zip`, await zip.generateAsync({type: "blob"}));
};
$("#btn-folder").onclick = async () => {
  if (!window.showDirectoryPicker) return alert("이 브라우저는 폴더 저장을 지원하지 않습니다. 크롬이나 엣지를 쓰거나 'ZIP으로 내보내기'를 이용하세요.");
  if (!state.problems.size) return alert("저장할 문항이 없습니다.");
  let root; try { root = await window.showDirectoryPicker({mode: "readwrite"}); } catch (e) { return; }
  const b = $("#btn-folder"); b.disabled = true;
  try {
    const entries = exportEntries();
    for (let i = 0; i < entries.length; i++) {
      const [path, data] = entries[i]; const parts = path.split("/"); let dir = root;
      for (const part of parts.slice(0, -1)) dir = await dir.getDirectoryHandle(part, {create: true});
      const w = await (await dir.getFileHandle(parts.at(-1), {create: true})).createWritable(); await w.write(data); await w.close();
      b.textContent = `저장 중 ${i + 1}/${entries.length}`;
    }
    alert("저장했습니다. units 폴더에 단원별로 정리되어 있습니다.");
  } catch (e) { alert("저장 실패: " + e.message); }
  b.disabled = false; b.textContent = "폴더에 단원별 저장";
};
$("#btn-import").onclick = () => $("#import-file").click();
$("#import-file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const zip = await JSZip.loadAsync(f);
    const entry = zip.file("backup.json");
    if (!entry) throw new Error("backup.json 이 없는 ZIP 입니다.");
    const data = JSON.parse(await entry.async("string"));
    if (data.format !== "mathgen-backup") throw new Error("이 프로그램의 백업 파일이 아닙니다.");
    for (const ex of data.exams) await putExam(ex);
    for (const p of data.problems) await putProblem(p);
    alert(`불러왔습니다: 시험 ${data.exams.length}개, 문항 ${data.problems.length}개`);
    renderLibrary();
  } catch (err) { alert("불러오기 실패: " + err.message); }
};

/* =====================================================================
   화면: 설정
   ===================================================================== */
$("#s-provider").innerHTML = Object.entries(PROVIDERS).map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join("");
function fillProviderFields() {
  const p = $("#s-provider").value, info = PROVIDERS[p];
  $("#s-key").value = settings.keys[p] || ""; $("#s-key").placeholder = info.keyHint;
  $("#s-model").value = settings.models[p] || info.defaultModel;
  $("#s-base-wrap").classList.toggle("hidden", p !== "compat");
  $("#s-help").textContent = info.help;
  $("#s-models").innerHTML = "";
}
function readProviderFields() {
  const p = $("#s-provider").value;
  settings.provider = p;
  settings.keys[p] = $("#s-key").value.trim();
  settings.models[p] = $("#s-model").value.trim();
  settings.baseUrl = $("#s-base").value.trim();
  settings.remember = $("#s-remember").checked;
  settings.concurrency = Math.min(8, Math.max(1, +$("#s-conc").value || 3));
}
function renderSettings() {
  $("#s-provider").value = settings.provider; fillProviderFields();
  $("#s-base").value = settings.baseUrl; $("#s-remember").checked = settings.remember; $("#s-conc").value = settings.concurrency;
  const gen = [...state.problems.values()].reduce((s, p) => s + (p.generated?.length || 0), 0);
  $("#s-stats").textContent = `시험 ${state.exams.size}개 · 문항 ${state.problems.size}개 · 만든 문제 ${gen}개`;
}
let shownProvider = null;
$("#s-provider").onfocus = () => { shownProvider = $("#s-provider").value; };
$("#s-provider").onchange = () => {
  // 바꾸기 전 제공자의 입력값을 보관한 뒤 새 제공자의 값을 보여 준다
  const next = $("#s-provider").value, prev = shownProvider || settings.provider;
  settings.keys[prev] = $("#s-key").value.trim(); settings.models[prev] = $("#s-model").value.trim();
  settings.provider = next; shownProvider = next; fillProviderFields(); updateAIStatus();
};
$("#s-save").onclick = () => { readProviderFields(); saveSettings(); $("#s-msg").textContent = "저장했습니다."; };
$("#s-list").onclick = async () => {
  readProviderFields(); $("#s-msg").textContent = "모델 목록을 불러오는 중…";
  try {
    const ids = await listModels();
    $("#s-models").innerHTML = ids.map(i => `<option value="${esc(i)}">`).join("");
    $("#s-msg").textContent = `모델 ${ids.length}개를 불러왔습니다. 모델 칸을 눌러 고르세요.`;
  } catch (e) { $("#s-msg").textContent = "불러오지 못했습니다: " + e.message; }
};
$("#s-test").onclick = async () => {
  readProviderFields(); saveSettings(); $("#s-msg").textContent = "연결 확인 중…";
  try {
    const r = await askJSON({system: "너는 연결 확인용 응답기다.", effort: "low", maxTokens: 4000,
      content: [{type: "text", text: '{"ok": true} 를 JSON 으로 답하라.'}],
      schema: {type: "object", additionalProperties: false, required: ["ok"], properties: {ok: {type: "boolean"}}}});
    $("#s-msg").innerHTML = r && r.ok === true ? `<span class="ok">연결되었습니다 (${esc(PROVIDERS[settings.provider].label)} · ${esc(curModel())}).</span>` : "응답은 왔지만 형식이 예상과 다릅니다.";
  } catch (e) { $("#s-msg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
};
$("#s-wipe").onclick = async () => {
  if (!confirm("저장된 모든 시험·문항·생성 결과를 삭제할까요? 되돌릴 수 없습니다.")) return;
  if (DB.db) { await DB.clear("exams"); await DB.clear("problems"); }
  state.exams.clear(); state.problems.clear(); state.selected.clear();
  $("#jobs").innerHTML = ""; renderSettings();
};

/* =====================================================================
   시작
   ===================================================================== */
(async function init() {
  loadSettings(); updateAIStatus();
  if (!window.pdfjsLib || !window.JSZip) {
    $("#jobs").innerHTML = `<div class="card bad">필요한 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.</div>`;
  }
  try {
    await DB.open();
    for (const e of await DB.all("exams")) state.exams.set(e.id, e);
    for (const p of await DB.all("problems")) state.problems.set(p.id, p);
  } catch (e) {
    $("#jobs").innerHTML = `<div class="card bad">브라우저 저장소(IndexedDB)를 열 수 없습니다: ${esc(e.message)}. 시크릿 창이 아닌 일반 창에서 여세요.</div>`;
  }
})();
</script>
