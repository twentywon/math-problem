<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모의고사 문제 도우미</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<!--
  모의고사 문제 도우미 (단일 HTML)
  - PDF 를 문제별 이미지로 자르기 (텍스트 PDF: 문제 번호 위치 분석 / 스캔본: Claude 이미지 인식)
  - 2022 개정 교육과정 단원 분류 (Claude API)
  - 유사문제·변형문제·개념연계문제 생성 + 독립 풀이 검산
  - 모든 데이터는 이 브라우저(IndexedDB)에 저장, ZIP/폴더로 내보내기
  인터넷 연결(라이브러리 CDN, Claude API)이 필요합니다.
-->
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1d1d1f; --muted:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --accent-weak:#eef2ff; --accent-text:#3730a3; --ok:#047857; --warn:#b91c1c; --hover:#f3f4f6;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121214; --panel:#1c1c1f; --text:#ececf1; --muted:#9ca3af; --line:#2e2e33;
    --accent:#60a5fa; --accent-weak:#1e2a4a; --accent-text:#c7d2fe; --ok:#34d399; --warn:#f87171; --hover:#26262b; }
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
nav{display:flex;gap:4px}
nav button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:6px;font-size:15px;cursor:pointer}
nav button.active{background:var(--accent-weak);color:var(--accent-text);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.muted{color:var(--muted);font-size:.9em}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:inherit}
button.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button.btn:hover{background:var(--hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.08);background:var(--accent)}
button.danger{color:var(--warn)}
button:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=password],input[type=number],textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
input[type=number]{width:64px}
textarea{width:100%}
.drop{border:2px dashed var(--line);border-radius:10px;padding:32px;text-align:center;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-weak)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}
.progress>div{height:100%;background:var(--accent);width:0;transition:width .2s}
.log{font-size:13px;color:var(--muted);max-height:120px;overflow:auto;white-space:pre-wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.thumb{background:#fff;border:1px solid var(--line);border-radius:6px;display:block;width:100%;max-height:220px;object-fit:contain;object-position:top}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;position:relative}
.pcard:hover{border-color:var(--accent)}
.pcard .x{position:absolute;top:4px;right:4px;border:0;background:var(--panel);color:var(--warn);border-radius:4px;cursor:pointer;padding:0 6px}
.tag{display:inline-block;background:var(--accent-weak);color:var(--accent-text);border-radius:4px;padding:0 6px;margin:0 4px 2px 0;font-size:.85em}
.ok{color:var(--ok)} .warn{color:var(--warn)}
.lib{display:grid;grid-template-columns:260px 1fr;gap:16px}
@media (max-width:760px){.lib{grid-template-columns:1fr}}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;align-self:start;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
aside .node{display:flex;justify-content:space-between;padding:2px 6px;border-radius:4px;cursor:pointer;font-size:14px}
aside .node:hover{background:var(--hover)}
aside .node.sel{background:var(--accent-weak);color:var(--accent-text)}
aside .l1{font-weight:600;margin-top:6px} aside .l2{padding-left:14px} aside .l3{padding-left:28px;color:var(--muted)}
aside .empty{opacity:.45}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;width:min(1100px,96vw);max-height:92vh;background:var(--panel);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dbody{padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.dbody{grid-template-columns:1fr}}
.dbody img.orig{width:100%;background:#fff;border:1px solid var(--line);border-radius:6px}
.problem{border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0}
details{margin-top:6px} summary{cursor:pointer;color:var(--muted)}
.checks{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.checks img{height:220px;border:1px solid var(--line);border-radius:4px;cursor:zoom-in;background:#fff}
.math{overflow-x:auto}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1>모의고사 문제 도우미</h1>
  <nav>
    <button data-tab="ingest" class="active">① PDF 넣기</button>
    <button data-tab="library">② 문제 저장소</button>
    <button data-tab="settings">설정</button>
  </nav>
  <span id="keywarn" class="warn muted hidden">API 키가 없습니다 → 설정</span>
</header>

<main>
<!-- ① PDF 넣기 -->
<section id="tab-ingest">
  <div class="card">
    <div id="drop" class="drop">
      <div style="font-size:17px;font-weight:600">모의고사 PDF를 여기에 끌어다 놓으세요</div>
      <div class="muted">또는 클릭해서 파일 선택 (여러 개 가능)</div>
      <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
    </div>
    <div class="row" style="margin-top:12px">
      <label>자르기 방식
        <select id="split-mode">
          <option value="auto">자동 (텍스트 PDF는 번호 분석, 스캔본은 AI)</option>
          <option value="text">텍스트 분석만 (API 사용 안 함)</option>
          <option value="vision">AI 이미지 인식 (스캔본용)</option>
        </select>
      </label>
      <label><input id="auto-classify" type="checkbox" checked> 자른 뒤 바로 단원 분류</label>
    </div>
  </div>
  <div id="jobs"></div>
</section>

<!-- ② 문제 저장소 -->
<section id="tab-library" class="hidden">
  <div class="card row">
    <input id="q" type="text" placeholder="검색 (시험명, 개념, 문제 텍스트)" style="flex:1;min-width:200px">
    <select id="f-exam"><option value="">모든 시험</option></select>
    <select id="f-diff"><option value="">모든 난이도</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
    <button class="btn" id="btn-classify-all">미분류 모두 분류</button>
    <button class="btn" id="btn-zip">ZIP으로 내보내기</button>
    <button class="btn" id="btn-folder">폴더에 단원별 저장</button>
    <button class="btn" id="btn-import">백업 불러오기</button>
    <input id="import-file" type="file" accept=".zip" hidden>
  </div>
  <div class="lib">
    <aside id="tree"></aside>
    <div>
      <div id="lib-status" class="muted" style="margin-bottom:8px"></div>
      <div id="grid" class="grid"></div>
    </div>
  </div>
</section>

<!-- 설정 -->
<section id="tab-settings" class="hidden">
  <div class="card">
    <h3 style="margin-top:0">Claude API</h3>
    <p class="muted">단원 분류, 스캔본 자르기, 문제 생성에 Claude API 키가 필요합니다. 키는 이 컴퓨터의 브라우저에서 Anthropic API로만 전송됩니다.</p>
    <div class="row"><label>API 키 <input id="s-key" type="password" placeholder="sk-ant-..." style="width:340px"></label>
      <label><input id="s-remember" type="checkbox"> 이 브라우저에 기억</label></div>
    <div class="row" style="margin-top:8px">
      <label>모델 <input id="s-model" type="text" style="width:200px"></label>
      <label>동시 요청 수 <input id="s-conc" type="number" min="1" max="8"></label>
      <button class="btn primary" id="s-save">저장</button><span id="s-msg" class="muted"></span>
    </div>
  </div>
  <div class="card">
    <h3 style="margin-top:0">데이터</h3>
    <p class="muted">문제와 생성 결과는 이 브라우저 안(IndexedDB)에 저장됩니다. 브라우저 데이터를 지우면 사라지므로 가끔 'ZIP으로 내보내기'로 백업하세요.</p>
    <div id="s-stats" class="muted"></div>
    <button class="btn danger" id="s-wipe" style="margin-top:8px">모든 데이터 삭제</button>
  </div>
</section>
</main>

<dialog id="detail"></dialog>
<dialog id="zoom" style="width:auto;max-width:96vw"><img id="zoom-img" style="max-height:88vh;max-width:94vw;display:block;background:#fff" alt=""></dialog>

<script>
"use strict";
/* =====================================================================
   2022 개정 교육과정 단원표 (mathgen/curriculum.py 와 동일)
   ===================================================================== */
const TREE = [["MS","중학교 수학",[["수와 연산",["소인수분해","정수와 유리수","유리수와 순환소수","제곱근과 실수"]],["변화와 관계",["문자의 사용과 식의 계산","일차방정식","좌표평면과 그래프","연립일차방정식","일차부등식","일차함수와 그래프","다항식의 곱셈과 인수분해","이차방정식","이차함수와 그래프"]],["도형과 측정",["기본 도형과 작도","평면도형과 입체도형","삼각형과 사각형의 성질","도형의 닮음","피타고라스 정리","삼각비","원의 성질"]],["자료와 가능성",["자료의 정리와 해석","경우의 수와 확률","대푯값과 산포도","상관관계"]]]],["CM1","공통수학1",[["다항식",["다항식의 연산","항등식과 나머지정리","인수분해"]],["방정식과 부등식",["복소수와 이차방정식","이차방정식과 이차함수","여러 가지 방정식과 부등식"]],["경우의 수",["합의 법칙과 곱의 법칙","순열과 조합"]],["행렬",["행렬과 그 연산"]]]],["CM2","공통수학2",[["도형의 방정식",["평면좌표","직선의 방정식","원의 방정식","도형의 이동"]],["집합과 명제",["집합","명제"]],["함수와 그래프",["함수","유리함수와 무리함수"]]]],["ALG","대수",[["지수함수와 로그함수",["지수와 로그","지수함수와 로그함수"]],["삼각함수",["삼각함수","사인법칙과 코사인법칙"]],["수열",["등차수열과 등비수열","수열의 합","수학적 귀납법"]]]],["CAL1","미적분I",[["함수의 극한과 연속",["함수의 극한","함수의 연속"]],["미분",["미분계수와 도함수","도함수의 활용"]],["적분",["부정적분과 정적분","정적분의 활용"]]]],["PS","확률과 통계",[["경우의 수",["순열과 조합","이항정리"]],["확률",["확률의 뜻과 활용","조건부확률"]],["통계",["확률분포","통계적 추정"]]]],["CAL2","미적분II",[["수열의 극한",["수열의 극한","급수"]],["미분법",["여러 가지 함수의 미분","여러 가지 미분법","도함수의 활용"]],["적분법",["여러 가지 적분법","정적분의 활용"]]]],["GEO","기하",[["이차곡선",["이차곡선","이차곡선과 직선"]],["공간도형과 공간좌표",["직선과 평면","정사영","공간좌표"]],["벡터",["벡터의 연산","벡터의 성분과 내적"]]]]];

const UNITS = {}, UNIT_IDS = [];
TREE.forEach(([code, subject, chapters], si) => chapters.forEach(([chapter, sections], ci) =>
  sections.forEach((section, ki) => {
    const id = `${code}-${ci + 1}-${ki + 1}`;
    UNITS[id] = {id, si, subject, ci: ci + 1, chapter, ki: ki + 1, section, label: `${subject} > ${chapter} > ${section}`};
    UNIT_IDS.push(id);
  })));
const pad2 = n => String(n).padStart(2, "0");
const unitPath = u => `${pad2(u.si)}_${u.subject}/${pad2(u.ci)}_${u.chapter}/${pad2(u.ki)}_${u.section}`;
const curriculumText = () => TREE.map(([code, subject, chapters]) => `[${subject}]\n` + chapters.map(([chapter, sections], ci) =>
  sections.map((s, ki) => `  ${code}-${ci + 1}-${ki + 1}: ${subject} > ${chapter} > ${s}`).join("\n")).join("\n")).join("\n");

/* =====================================================================
   공통 유틸
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const escBr = s => esc(s).replace(/\n/g, "<br>");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const safeName = s => (String(s).replace(/[^\w가-힣.\-]+/g, "_").replace(/^_+|_+$/g, "") || "exam");
const median = a => { if (!a.length) return 0; const b = [...a].sort((x, y) => x - y); return b[Math.floor(b.length / 2)]; };
function renderMath(el) {
  if (window.renderMathInElement) {
    renderMathInElement(el, {delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}], throwOnError: false});
  } else { setTimeout(() => renderMath(el), 300); }
}
async function pool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({length: Math.min(n, items.length)}, async () => {
    while (i < items.length) { const k = i++; await fn(items[k], k); }
  }));
}
function download(name, blob) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const dataURLtoBase64 = d => d.slice(d.indexOf(",") + 1);
const dataURLtoBlob = d => { const b = atob(dataURLtoBase64(d)); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Blob([u], {type: d.slice(5, d.indexOf(";"))}); };

/* =====================================================================
   설정 (localStorage 는 사용 가능할 때만)
   ===================================================================== */
const settings = {apiKey: "", remember: false, model: "claude-opus-5-5", concurrency: 3};
function loadSettings() {
  try { Object.assign(settings, JSON.parse(localStorage.getItem("mathgen.settings") || "{}")); } catch (e) { /* 저장소 사용 불가 */ }
}
function saveSettings() {
  try {
    const keep = {...settings}; if (!settings.remember) keep.apiKey = "";
    localStorage.setItem("mathgen.settings", JSON.stringify(keep));
  } catch (e) { /* 무시 */ }
  $("#keywarn").classList.toggle("hidden", !!settings.apiKey);
}

/* =====================================================================
   저장소 (IndexedDB) + 메모리 캐시
   ===================================================================== */
const state = {exams: new Map(), problems: new Map(), filter: {unit: null}};
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("mathgen", 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("exams", {keyPath: "id"}); d.createObjectStore("problems", {keyPath: "id"}); };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  store(name, mode) { return this.db.transaction(name, mode).objectStore(name); },
  all(name) { return this.req(this.store(name, "readonly").getAll()); },
  put(name, obj) { return this.req(this.store(name, "readwrite").put(obj)); },
  del(name, id) { return this.req(this.store(name, "readwrite").delete(id)); },
  clear(name) { return this.req(this.store(name, "readwrite").clear()); },
};
async function putExam(e) { state.exams.set(e.id, e); await DB.put("exams", e); }
async function putProblem(p) { state.problems.set(p.id, p); await DB.put("problems", p); }
async function deleteProblem(id) { state.problems.delete(id); await DB.del("problems", id); }
async function deleteExam(id) {
  for (const p of [...state.problems.values()]) if (p.examId === id) await deleteProblem(p.id);
  state.exams.delete(id); await DB.del("exams", id);
}

/* =====================================================================
   Claude API (브라우저에서 직접 호출, 스트리밍 + JSON 스키마 출력)
   ===================================================================== */
class RetryableError extends Error {}
async function readSSE(res) {
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "", stopReason = null, stopDetails = null;
  for (;;) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true}).replace(/\r\n/g, "\n");
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
      for (const line of chunk.split("\n")) {
        if (!line.startsWith("data:")) continue;
        let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
        // 서버측 fallback 이 일어나도 이미 받은 text 는 유효하고 이어서 계속된다
        if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta") text += ev.delta.text;
        else if (ev.type === "message_delta") { stopReason = ev.delta?.stop_reason ?? stopReason; stopDetails = ev.delta?.stop_details ?? stopDetails; }
        else if (ev.type === "error") {
          const t = ev.error?.type || "";
          const msg = `API 오류(${t}): ${ev.error?.message || ""}`;
          throw (t === "overloaded_error" || t === "api_error") ? new RetryableError(msg) : new Error(msg);
        }
      }
    }
  }
  return {text, stopReason, stopDetails};
}

async function askJSON({system, content, schema, effort = "high", maxTokens = 64000}) {
  if (!settings.apiKey) throw new Error("설정 탭에서 Claude API 키를 먼저 입력하세요.");
  const body = {
    model: settings.model || "claude-opus-5-5",
    max_tokens: maxTokens,
    stream: true,
    fallbacks: "default", // 안전 분류기 거절 시 서버가 권장 모델로 다시 실행
    thinking: {type: "adaptive"},
    output_config: {effort, format: {type: "json_schema", schema}},
    system: [{type: "text", text: system, cache_control: {type: "ephemeral"}}],
    messages: [{role: "user", content}],
  };
  for (let attempt = 0; ; attempt++) {
    try {
      let res;
      try {
        res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "content-type": "application/json",
            "x-api-key": settings.apiKey,
            "anthropic-version": "2026-10-21",
            "anthropic-beta": "server-side-fallback-2026-07-01",
            "anthropic-dangerous-direct-browser-access": "true",
          },
          body: JSON.stringify(body),
        });
      } catch (e) { throw new RetryableError("네트워크 오류: " + e.message); }
      if (res.status === 429 || res.status >= 500) {
        const ra = Number(res.headers.get("retry-after")) || 0;
        if (attempt < 4) { await sleep(Math.max(ra * 1000, 2000 * 2 ** attempt)); continue; }
      }
      if (!res.ok) {
        const t = await res.text(); let msg = t;
        try { msg = JSON.parse(t).error.message; } catch (e) { /* 원문 사용 */ }
        if (res.status === 401) msg = "API 키가 올바르지 않습니다. 설정을 확인하세요.";
        throw new Error(`API 오류 ${res.status}: ${msg}`);
      }
      const {text, stopReason, stopDetails} = await readSSE(res);
      if (stopReason === "refusal") throw new Error(`모델이 요청을 거절했습니다 (${stopDetails?.category || "사유 미상"})`);
      if (stopReason === "max_tokens") throw new Error("응답이 너무 길어 잘렸습니다");
      try { return JSON.parse(text); } catch (e) { throw new Error("응답 JSON 파싱 실패"); }
    } catch (e) {
      if (e instanceof RetryableError && attempt < 4) { await sleep(2000 * 2 ** attempt); continue; }
      throw e;
    }
  }
}
const imageBlock = dataURL => ({type: "image", source: {type: "base64", media_type: dataURL.slice(5, dataURL.indexOf(";")), data: dataURLtoBase64(dataURL)}});

/* =====================================================================
   PDF 자르기
   ===================================================================== */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
const RENDER_SCALE = 200 / 72; // 문제 이미지 200dpi

const MARKER_RE = /^\s*(\d{1,2})\s*[.．](?!\d)/;
const BARE_NUM_RE = /^\s*(\d{1,2})\s*$/;
const FOOTER_TEXT_RE = /(저작권|평가원|교육청|교육과정|이 문제지|확인\s*사항)/;
const PAGE_NUM_RE = /^\s*(?:[-–]?\s*\d{1,2}\s*[-–]?|\d{1,2}\s*\/\s*\d{1,2}|\d{1,2}\s*\(\s*\d{1,2}\s*\))\s*$/;

async function pageItems(page) {
  const vp = page.getViewport({scale: 1});
  const tc = await page.getTextContent();
  const items = [];
  for (const it of tc.items) {
    if (!it.str || !it.str.trim()) continue;
    const m = pdfjsLib.Util.transform(vp.transform, it.transform);
    const size = Math.hypot(it.transform[2], it.transform[3]) || it.height || 10;
    const x0 = m[4], base = m[5];
    items.push({str: it.str, x0, x1: x0 + (it.width || size * it.str.length * 0.5), y0: base - size * 0.88, y1: base + size * 0.22, base, size, font: it.fontName});
  }
  return {items, W: vp.width, H: vp.height};
}

function detectColumns(items, W, H) {
  const usable = items.filter(i => (i.x1 - i.x0) < 0.6 * W && i.y0 > 0.1 * H && i.y1 < 0.92 * H);
  if (!usable.length) return [{x0: 0, x1: W}];
  const left = Math.min(...usable.map(i => i.x0)), right = Math.max(...usable.map(i => i.x1));
  const cover = new Array(Math.ceil(W) + 2).fill(0);
  for (const i of usable) for (let x = Math.max(0, Math.floor(i.x0)); x <= Math.min(cover.length - 1, Math.floor(i.x1)); x++) cover[x]++;
  const lo = Math.floor(W * 0.3), hi = Math.floor(W * 0.7);
  const findGap = tol => {
    let best = [0, 0], start = null;
    for (let x = lo; x <= hi + 1; x++) {
      if (x <= hi && cover[x] <= tol) { if (start === null) start = x; }
      else if (start !== null) { if (x - start > best[0]) best = [x - start, start]; start = null; }
    }
    return best;
  };
  // 완전히 빈 띠를 먼저 찾고, 없으면 가운데를 가로지르는 줄이 몇 개 있어도 허용
  let best = findGap(0);
  if (best[0] < 8) best = findGap(Math.floor(0.01 * usable.length));
  if (best[0] >= 8) {
    // 단 경계는 빈 띠의 가운데(구분선 자리)에서 3pt 떨어진 곳: 글자 폭 오차로 끝 글자가 잘리지 않게
    const mid = best[1] + best[0] / 2, m = Math.max(1, Math.min(3, best[0] / 2 - 1));
    return [{x0: Math.max(0, left - 4), x1: mid - m}, {x0: mid + m, x1: Math.min(W, right + 4)}];
  }
  return [{x0: Math.max(0, left - 4), x1: Math.min(W, right + 4)}];
}
const colOf = (x, cols) => cols.findIndex(c => c.x0 - 2 <= x && x <= c.x1 + 2);

function buildLines(items, cols) {
  const groups = new Map(); // 단 번호(-1: 어느 단에도 속하지 않음) → 항목
  for (const it of items) {
    const c = colOf((it.x0 + it.x1) / 2, cols);
    if (!groups.has(c)) groups.set(c, []);
    groups.get(c).push(it);
  }
  const lines = [];
  for (const [c, its] of groups) {
    its.sort((a, b) => a.base - b.base || a.x0 - b.x0);
    let cur = null;
    for (const it of its) {
      if (cur && Math.abs(it.base - cur.base) <= Math.max(2, 0.45 * Math.min(it.size, cur.size))) cur.items.push(it);
      else { cur = {col: c, base: it.base, size: it.size, items: [it]}; lines.push(cur); }
    }
  }
  for (const ln of lines) {
    ln.items.sort((a, b) => a.x0 - b.x0);
    let text = "";
    ln.items.forEach((it, k) => { if (k && it.x0 - ln.items[k - 1].x1 > 0.25 * it.size) text += " "; text += it.str; });
    ln.text = text;
    ln.x0 = Math.min(...ln.items.map(i => i.x0)); ln.x1 = Math.max(...ln.items.map(i => i.x1));
    ln.y0 = Math.min(...ln.items.map(i => i.y0)); ln.y1 = Math.max(...ln.items.map(i => i.y1));
    ln.first = ln.items[0];
  }
  return lines;
}

function footerTops(lines, cols, W, H) {
  const tops = cols.map(() => H);
  for (const ln of lines) {
    if (FOOTER_TEXT_RE.test(ln.text)) {
      const notice = ln.text.includes("확인") && ln.text.includes("사항");
      if (!(ln.y0 > 0.85 * H || notice)) continue;
    } else if (PAGE_NUM_RE.test(ln.text)) {
      if (ln.y0 <= 0.93 * H) continue; // 그래프 눈금 숫자와 구분
    } else continue;
    if (ln.col < 0 || (ln.x1 - ln.x0) > 0.6 * W) tops.forEach((t, i) => tops[i] = Math.min(t, ln.y0));
    else tops[ln.col] = Math.min(tops[ln.col], ln.y0);
  }
  return tops;
}

// 단의 왼쪽 끝: 단 안에서 시작하고, 같은 위치(±3pt)에서 시작하는 줄이 2개 이상인 가장 왼쪽 x.
// 가운데 제목처럼 단 경계에 걸친 조각 하나 때문에 기준이 틀어지지 않게 한다.
function columnLeft(cl, col) {
  const xs = cl.map(l => l.x0).filter(x => x >= col.x0 - 2).sort((a, b) => a - b);
  if (!xs.length) return Math.min(...cl.map(l => l.x0));
  for (const x of xs) if (xs.filter(y => Math.abs(y - x) <= 3).length >= 2) return x;
  return xs[0];
}

function textMarkers(pageNo, lines, cols) {
  const sizes = [], fontCount = {};
  for (const ln of lines) for (const it of ln.items) { sizes.push(it.size); fontCount[it.font] = (fontCount[it.font] || 0) + it.str.length; }
  const body = median(sizes);
  const bodyFont = Object.keys(fontCount).sort((a, b) => fontCount[b] - fontCount[a])[0];
  const markers = [];
  cols.forEach((col, c) => {
    const cl = lines.filter(l => l.col === c);
    if (!cl.length) return;
    const left = columnLeft(cl, col);
    for (const ln of cl) {
      if (ln.x0 - left > 14) continue; // 문제 번호는 단의 왼쪽 끝
      let m = MARKER_RE.exec(ln.text);
      if (!m) {
        const b = BARE_NUM_RE.exec(ln.first.str);
        if (b && (ln.first.size > body * 1.1 || ln.first.font !== bodyFont)) m = b;
      }
      if (!m) continue;
      const n = parseInt(m[1], 10);
      if (n >= 1 && n <= 50) markers.push({number: n, page: pageNo, col: c, y: ln.y0, style: `${ln.first.font}|${Math.round(ln.first.size * 10) / 10}`});
    }
  });
  return markers;
}

function selectSequence(markers) {
  let ms = [...markers].sort((a, b) => a.page - b.page || a.col - b.col || a.y - b.y);
  if (!ms.length) return [];
  const styles = new Map();
  for (const m of ms) if (m.style !== "vision") { if (!styles.has(m.style)) styles.set(m.style, new Set()); styles.get(m.style).add(m.number); }
  if (styles.size) {
    const dom = [...styles.keys()].sort((a, b) => styles.get(b).size - styles.get(a).size)[0];
    if (styles.get(dom).size >= 3) ms = ms.filter(m => m.style === dom || m.style === "vision");
  }
  const picked = []; let last = null, section = 0;
  ms.forEach((m, i) => {
    if (last === null || m.number === last + 1) { picked.push({...m, section}); last = m.number; }
    else if (m.number !== last) {
      const later = ms.slice(i + 1, i + 4).map(x => x.number);
      if (later.includes(m.number + 1) || (m.number < last && m.number === 1)) {
        if (m.number < last) section++;
        picked.push({...m, section}); last = m.number;
      }
    }
  });
  return picked;
}

const VISION_SYSTEM = `너는 한국 수학 시험지(모의고사) 페이지 이미지의 레이아웃을 읽는 도구다.
페이지에서 다음을 찾아라.
- columns: 본문 단(column)의 좌우 경계. 보통 2단이며, 1단이면 하나만.
- problems: 이 페이지에서 '시작하는' 각 문제의 인쇄된 번호(number), 몇 번째 단인지(column, 0부터),
  문제 번호가 찍힌 줄의 윗변 y 좌표(y_top).
- column_bottoms: 각 단에서 문제 내용(그림, 선택지 포함)이 끝나는 y 좌표. 쪽 번호, 저작권 문구 같은 꼬리말은 제외.
좌표는 모두 페이지 왼쪽 위가 (0,0), 오른쪽 아래가 (1000,1000) 인 정규화 좌표 정수로 답한다.
문제 번호가 아닌 숫자(선택지 번호, 보기의 번호, 쪽 번호)는 넣지 마라.`;
const VISION_SCHEMA = {type: "object", additionalProperties: false, required: ["columns", "problems", "column_bottoms"], properties: {
  columns: {type: "array", items: {type: "object", additionalProperties: false, required: ["x0", "x1"], properties: {x0: {type: "integer"}, x1: {type: "integer"}}}},
  problems: {type: "array", items: {type: "object", additionalProperties: false, required: ["number", "column", "y_top"], properties: {number: {type: "integer"}, column: {type: "integer"}, y_top: {type: "integer"}}}},
  column_bottoms: {type: "array", items: {type: "integer"}},
}};

async function renderPage(page, scale) {
  const vp = page.getViewport({scale});
  const canvas = document.createElement("canvas");
  canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
  const ctx = canvas.getContext("2d", {willReadFrequently: true});
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({canvasContext: ctx, viewport: vp}).promise;
  return canvas;
}

async function visionLayout(page, pageNo) {
  const vp = page.getViewport({scale: 1});
  const scale = 1500 / Math.max(vp.width, vp.height);
  const canvas = await renderPage(page, scale);
  const data = await askJSON({system: VISION_SYSTEM, schema: VISION_SCHEMA, effort: "medium", maxTokens: 16000,
    content: [imageBlock(canvas.toDataURL("image/jpeg", 0.85)), {type: "text", text: "이 페이지의 레이아웃을 JSON 으로 답하라."}]});
  const W = vp.width, H = vp.height;
  let cols = data.columns.map(c => ({x0: c.x0 / 1000 * W, x1: c.x1 / 1000 * W})).sort((a, b) => a.x0 - b.x0);
  if (!cols.length) cols = [{x0: 0, x1: W}];
  const bottoms = cols.map((_, i) => (data.column_bottoms[i] ?? 950) / 1000 * H);
  const markers = data.problems.map(p => {
    const c = Math.min(Math.max(p.column, 0), cols.length - 1);
    return {number: p.number, page: pageNo, col: c, y: p.y_top / 1000 * H, style: "vision"};
  });
  return {cols, footer: bottoms.map(b => Math.min(H, b + 0.02 * H)), markers, W, H};
}

function trimCanvas(src, sx, sy, sw, sh, pad = 16, thr = 235) {
  sx = Math.max(0, Math.floor(sx)); sy = Math.max(0, Math.floor(sy));
  sw = Math.min(src.width - sx, Math.ceil(sw)); sh = Math.min(src.height - sy, Math.ceil(sh));
  const d = src.getContext("2d", {willReadFrequently: true}).getImageData(sx, sy, sw, sh).data;
  const dark = new Uint8Array(sw * sh), colDark = new Uint32Array(sw);
  for (let i = 0, k = 0; k < sw * sh; i += 4, k++) {
    if (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114 < thr) { dark[k] = 1; colDark[k % sw]++; }
  }
  // 가장자리 근처에서 위아래로 거의 끝까지 이어진 세로줄(단 구분선, 테두리)은 내용으로 치지 않는다
  const edge = Math.max(24, Math.floor(sw * 0.06)), skip = new Uint8Array(sw);
  for (let x = 0; x < sw; x++) if ((x < edge || x >= sw - edge) && colDark[x] > sh * 0.85) skip[x] = 1;
  let minX = sw, minY = sh, maxX = -1, maxY = -1;
  for (let y = 0, k = 0; y < sh; y++) {
    for (let x = 0; x < sw; x++, k++) {
      if (dark[k] && !skip[x]) {
        if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) { minX = 0; minY = 0; maxX = sw - 1; maxY = sh - 1; }
  const x0 = Math.max(0, minX - pad), y0 = Math.max(0, minY - pad);
  const x1 = Math.min(sw, maxX + pad + 1), y1 = Math.min(sh, maxY + pad + 1);
  const out = document.createElement("canvas"); out.width = x1 - x0; out.height = y1 - y0;
  const o = out.getContext("2d"); o.fillStyle = "#fff"; o.fillRect(0, 0, out.width, out.height);
  o.drawImage(src, sx + x0, sy + y0, out.width, out.height, 0, 0, out.width, out.height);
  for (let x = x0; x < x1; x++) if (skip[x]) o.fillRect(x - x0, 0, 1, out.height);
  return out.toDataURL("image/png");
}

async function splitPdf(buffer, mode, log) {
  const pdf = await pdfjsLib.getDocument({data: buffer, cMapUrl: PDFJS + "cmaps/", cMapPacked: true, standardFontDataUrl: PDFJS + "standard_fonts/"}).promise;
  const layouts = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const {items, W, H} = await pageItems(page);
    const textChars = items.reduce((s, i) => s + i.str.trim().length, 0);
    const useText = mode === "text" || (mode === "auto" && textChars >= 30);
    if (useText) {
      const cols = detectColumns(items, W, H);
      const lines = buildLines(items, cols);
      layouts.push({cols, footer: footerTops(lines, cols, W, H), markers: textMarkers(p - 1, lines, cols), W, H});
      log(`${p}/${pdf.numPages}쪽 분석 (텍스트, ${cols.length}단)`);
    } else {
      log(`${p}/${pdf.numPages}쪽 분석 중 (AI 이미지 인식)…`);
      layouts.push(await visionLayout(page, p - 1));
    }
  }
  const seq = selectSequence(layouts.flatMap(l => l.markers));
  const crops = seq.map((m, i) => {
    const lay = layouts[m.page], col = lay.cols[m.col];
    const next = seq.filter(x => x.page === m.page && x.col === m.col && x.y > m.y);
    const y1 = next.length ? Math.min(...next.map(x => x.y)) - 3 : lay.footer[m.col] - 2;
    const y0 = Math.max(0, m.y - 4);
    return {order: i + 1, number: m.number, section: m.section, page: m.page, rect: [col.x0, y0, col.x1, Math.max(y1, y0 + 20)]};
  });
  // 렌더링: 페이지마다 한 번 그려서 자르고, 검수용 축소 이미지에 상자를 그린다
  const checks = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const canvas = await renderPage(page, RENDER_SCALE);
    const mine = crops.filter(c => c.page === p - 1);
    for (const c of mine) {
      const [x0, y0, x1, y1] = c.rect.map(v => v * RENDER_SCALE);
      c.image = trimCanvas(canvas, x0, y0, x1 - x0, y1 - y0);
    }
    const s = 0.35, chk = document.createElement("canvas");
    chk.width = Math.ceil(canvas.width * s); chk.height = Math.ceil(canvas.height * s);
    const g = chk.getContext("2d"); g.drawImage(canvas, 0, 0, chk.width, chk.height);
    g.strokeStyle = "#dc2626"; g.lineWidth = 2; g.fillStyle = "#dc2626"; g.font = "bold 14px sans-serif";
    for (const c of mine) {
      const [x0, y0, x1, y1] = c.rect.map(v => v * RENDER_SCALE * s);
      g.strokeRect(x0, y0, x1 - x0, y1 - y0); g.fillText(`#${c.order}`, x0 + 3, y0 + 14);
    }
    checks.push(chk.toDataURL("image/jpeg", 0.8));
    log(`${p}/${pdf.numPages}쪽 자르기 완료`);
  }
  return {crops, checks, pages: pdf.numPages};
}

const CLASSIFY_SYSTEM = `너는 한국 고등학교 수학 교사이자 2022 개정 교육과정 전문가다.
모의고사 문제 이미지 한 장을 받으면 다음을 한다.

1. 문제를 그대로 옮겨 적는다(transcription). 수식은 LaTeX 로 $...$ 안에 쓰고, 5지선다면
   선택지를 ① ~ ⑤ 로 함께 적는다. 그림이 있으면 그림에 담긴 정보를 figure_description 에 자세히 적는다.
2. 아래 단원표에서 이 문제가 '주로' 다루는 중단원 하나(primary_unit_id)와, 풀이에 함께 쓰이는
   다른 중단원들(secondary_unit_ids, 없으면 빈 배열)을 고른다. 반드시 2022 개정 기준으로 판단한다.
   (예: 수열의 극한·급수는 미적분II, 지수·로그·삼각함수·수열은 대수, 다항함수의 미적분은 미적분I,
   경우의 수 기초는 공통수학1, 중복조합·이항정리는 확률과 통계, 행렬은 공통수학1)
3. 핵심 개념(key_concepts)과 이 문제를 푸는 핵심 접근법(solution_approach)을 쓴다.
   접근법은 '어떤 관찰에서 어떤 도구로 넘어가는지'가 드러나게 2~4문장으로 쓴다.
4. 직접 풀어서 정답(answer)과 풀이(solution)를 쓴다. 5지선다면 정답 번호(1~5)만, 단답형이면 값만 쓴다.
   이미지가 잘려 있거나 정보가 부족해 풀 수 없으면 answer 를 빈 문자열로 둔다.
5. 난이도(difficulty)를 1(기본)~5(최고난도, 킬러) 정수로 매긴다.

단원표 (코드: 과목 > 대단원 > 중단원)
${curriculumText()}
`;
const UNIT_ENUM = {type: "string", enum: UNIT_IDS};
const CLASSIFY_SCHEMA = {type: "object", additionalProperties: false,
  required: ["transcription", "figure_description", "question_type", "primary_unit_id", "secondary_unit_ids", "key_concepts", "solution_approach", "answer", "solution", "difficulty"],
  properties: {
    transcription: {type: "string"}, figure_description: {type: "string"},
    question_type: {type: "string", enum: ["5지선다", "단답형", "서술형"]},
    primary_unit_id: UNIT_ENUM, secondary_unit_ids: {type: "array", items: UNIT_ENUM},
    key_concepts: {type: "array", items: {type: "string"}}, solution_approach: {type: "string"},
    answer: {type: "string"}, solution: {type: "string"}, difficulty: {type: "integer"},
  }};

async function classifyProblem(p) {
  const r = await askJSON({system: CLASSIFY_SYSTEM, schema: CLASSIFY_SCHEMA, effort: "high",
    content: [imageBlock(p.image), {type: "text", text: `시험: ${p.examTitle}\n문제 번호: ${p.number}번\n이 문제를 분석해 JSON 으로 답하라.`}]});
  if (!UNITS[r.primary_unit_id]) throw new Error("알 수 없는 단원 코드: " + r.primary_unit_id);
  r.secondary_unit_ids = r.secondary_unit_ids.filter(u => UNITS[u] && u !== r.primary_unit_id);
  r.difficulty = Math.min(5, Math.max(1, Math.round(r.difficulty)));
  p.classification = r; p.unitId = r.primary_unit_id; p.unitManual = false;
  await putProblem(p);
  return p;
}

async function classifyMany(ids, onProgress) {
  let done = 0; const errors = [];
  await pool(ids, Math.max(1, settings.concurrency | 0), async id => {
    const p = state.problems.get(id);
    try { await classifyProblem(p); } catch (e) { errors.push(`${p.examTitle} ${p.number}번: ${e.message}`); }
    onProgress?.(++done, ids.length, p);
  });
  return errors;
}

/* =====================================================================
   유사·연계 문제 생성 + 검산
   ===================================================================== */
const KINDS = {
  "유사문제": "원본과 구조·풀이 흐름이 같고 수치·함수·조건만 바꾼 문제. 원본을 푼 학생이 같은 방법으로 풀 수 있어야 한다.",
  "변형문제": "원본과 같은 단원·같은 핵심 개념을 쓰지만 묻는 것이나 조건의 방향을 바꿔 한 단계 다른 사고가 필요한 문제 (예: 역으로 묻기, 조건 추가, 미지수 위치 바꾸기).",
  "개념연계문제": "원본의 핵심 개념이나 접근법(예: 대칭성 이용, 그래프 개형 추론, 경우 나누기, 치환)을 다른 상황이나 다른 단원에 적용하는 문제. 겉모습은 달라도 같은 아이디어로 풀린다.",
};
const GEN_SYSTEM = `너는 한국 수능·모의고사 출제 경험이 많은 수학 교사다. 2022 개정 교육과정 범위 안에서 문제를 만든다.

규칙
- 모든 문제는 교육과정 범위를 벗어나지 않아야 하고, 조건이 모자라거나 넘치지 않아 답이 하나로 정해져야 한다.
- 수식은 LaTeX 로 $...$ (줄 수식은 $$...$$) 안에 쓴다.
- 5지선다면 choices 에 선택지 5개를 수식 포함 문자열로 넣고 answer 에는 정답 번호(1~5)만 쓴다.
  단답형이면 choices 는 빈 배열, answer 는 값만 쓴다(수능 단답형처럼 0 이상 999 이하의 정수가 되도록 하는 것을 권장).
- 그림이 꼭 필요하면 figure_description 에 그림을 그릴 수 있을 만큼 자세히 설명하되, 문제 본문만으로도 풀 수 있게 조건을 글로 적는다.
  그림이 없으면 빈 문자열.
- 문제를 다 만든 뒤 스스로 끝까지 풀어서 정답과 풀이(solution)를 확인한다. 계산이 맞지 않으면 문제를 고친다.
- relation_to_original 에는 원본과 무엇이 같고 무엇이 다른지, 어떤 개념·접근법을 공유하는지 쓴다.
- unit_id 는 아래 단원표의 코드 중 새 문제가 주로 다루는 중단원.

문제 유형
${Object.entries(KINDS).map(([k, v]) => `- ${k}: ${v}`).join("\n")}

단원표 (코드: 과목 > 대단원 > 중단원)
${curriculumText()}
`;
const GEN_SCHEMA = {type: "object", additionalProperties: false, required: ["problems"], properties: {problems: {type: "array", items: {
  type: "object", additionalProperties: false,
  required: ["kind", "title", "statement", "choices", "figure_description", "answer", "solution", "shared_concepts", "relation_to_original", "unit_id", "difficulty"],
  properties: {
    kind: {type: "string", enum: Object.keys(KINDS)}, title: {type: "string"}, statement: {type: "string"},
    choices: {type: "array", items: {type: "string"}}, figure_description: {type: "string"},
    answer: {type: "string"}, solution: {type: "string"}, shared_concepts: {type: "array", items: {type: "string"}},
    relation_to_original: {type: "string"}, unit_id: UNIT_ENUM, difficulty: {type: "integer"},
  }}}}};
const VERIFY_SYSTEM = `너는 꼼꼼한 수학 검토자다. 주어진 문제를 처음 보는 학생처럼 직접 풀어라.
- answer: 5지선다면 정답 번호(1~5)만, 단답형이면 값만.
- well_posed: 조건이 모순되지 않고 답이 하나로 정해지며 교육과정 범위 안이면 true.
- issues: 오류, 모호한 표현, 답이 여러 개이거나 없는 문제 등을 구체적으로. 없으면 빈 문자열.
- solution_brief: 핵심 풀이를 3~6줄로.`;
const VERIFY_SCHEMA = {type: "object", additionalProperties: false, required: ["answer", "well_posed", "issues", "solution_brief"],
  properties: {answer: {type: "string"}, well_posed: {type: "boolean"}, issues: {type: "string"}, solution_brief: {type: "string"}}};

const MARKS = "①②③④⑤";
function normalizeAnswer(a) {
  a = String(a).trim();
  [...MARKS].forEach((m, i) => { a = a.split(m).join(String(i + 1)); });
  a = a.replace(/\\text\{[^}]*\}/g, "").replace(/\\[,;!]/g, "").replace(/[\s$]/g, "").replace(/번$/, "");
  return a.replace(/\\dfrac|\\tfrac/g, "\\frac").replace(/\.$/, "");
}
function problemAsText(q) {
  let t = q.statement;
  if (q.figure_description) t += `\n\n[그림 설명] ${q.figure_description}`;
  if (q.choices?.length) t += "\n\n" + q.choices.map((c, i) => `${MARKS[i] || i + 1} ${c}`).join("  ");
  return t;
}
function originalText(p) {
  const c = p.classification || {};
  return [`[원본 문제] ${p.examTitle} ${p.number}번`, `단원: ${UNITS[p.unitId]?.label || ""}`,
    `문제 텍스트:\n${c.transcription || ""}`, `그림 설명: ${c.figure_description || "없음"}`,
    `핵심 개념: ${(c.key_concepts || []).join(", ")}`, `핵심 접근법: ${c.solution_approach || ""}`,
    `정답: ${c.answer || ""}`, `풀이:\n${c.solution || ""}`].join("\n");
}
async function generateFor(p, counts, extra, verify, log) {
  const wanted = Object.entries(counts).filter(([, n]) => n > 0).map(([k, n]) => `${k} ${n}개`).join(", ");
  if (!wanted) throw new Error("만들 문제 개수를 1개 이상 입력하세요.");
  let req = `${originalText(p)}\n\n위 원본 문제를 바탕으로 다음을 만들어라: ${wanted}. 각 문제의 kind 를 정확히 표시하라.`;
  if (extra) req += `\n추가 요청: ${extra}`;
  log("문제를 만드는 중… (1~3분 걸릴 수 있습니다)");
  const data = await askJSON({system: GEN_SYSTEM, schema: GEN_SCHEMA, effort: "high", content: [imageBlock(p.image), {type: "text", text: req}]});
  const made = data.problems.map(q => ({...q, difficulty: Math.min(5, Math.max(1, Math.round(q.difficulty))), createdAt: new Date().toISOString()}));
  if (verify) {
    log(`검산 중… (${made.length}문제를 따로 다시 풉니다)`);
    await pool(made, Math.max(1, settings.concurrency | 0), async q => {
      try {
        const v = await askJSON({system: VERIFY_SYSTEM, schema: VERIFY_SCHEMA, effort: "high",
          content: [{type: "text", text: `(${q.choices?.length ? "5지선다" : "단답형"})\n${problemAsText(q)}`}]});
        v.answer_match = normalizeAnswer(v.answer) === normalizeAnswer(q.answer);
        v.passed = v.answer_match && v.well_posed;
        q.verification = v;
      } catch (e) { q.verification = {passed: false, error: e.message}; }
    });
  }
  p.generated = [...(p.generated || []), ...made];
  await putProblem(p);
  return made;
}

const drop = $("#drop");

async function handleFiles(files) {
  for (const f of files.filter(f => /\.pdf$/i.test(f.name) || f.type === "application/pdf")) await ingestFile(f);
}

function uniqueExamId(base) {
  let id = base, k = 2;
  while (state.exams.has(id)) id = `${base}_${k++}`;
  return id;
}

async function ingestFile(file) {
  const stem = file.name.replace(/\.pdf$/i, "");
  const examId = uniqueExamId(safeName(stem));
  const job = document.createElement("div");
  job.className = "card";
  job.innerHTML = `
    <div class="row"><b>시험 이름</b><input type="text" class="title" style="flex:1;min-width:200px" value="${esc(stem)}">
      <span class="status muted">준비 중…</span></div>
    <div class="progress"><div></div></div>
    <div class="log"></div>
    <div class="review hidden">
      <div class="muted" style="margin:8px 0 4px">페이지별 자른 영역 (클릭하면 크게 보기) — 빨간 상자가 문제 하나입니다.</div>
      <div class="checks"></div>
      <div class="row" style="margin:12px 0 8px"><b>자른 문제</b><span class="muted">잘못 잘린 조각은 ✕ 로 지우세요.</span>
        <span style="flex:1"></span>
        <button class="btn primary go">단원 분류 시작</button>
        <button class="btn lib">저장소에서 보기</button>
        <button class="btn danger del">이 시험 삭제</button></div>
      <div class="grid crops"></div>
    </div>`;
  $("#jobs").prepend(job);
  const q = s => job.querySelector(s);
  const log = msg => { q(".log").textContent += msg + "\n"; q(".log").scrollTop = 1e9; };
  const status = (msg, pct) => { q(".status").textContent = msg; if (pct != null) q(".progress>div").style.width = pct + "%"; };

  try {
    const mode = $("#split-mode").value;
    if (mode === "vision" && !settings.apiKey) throw new Error("AI 이미지 인식에는 API 키가 필요합니다. 설정 탭에서 입력하세요.");
    status("PDF 분석 중…", 5);
    const {crops, checks, pages} = await splitPdf(await file.arrayBuffer(), mode, log);
    if (!crops.length) throw new Error("문제 번호를 찾지 못했습니다. 자르기 방식을 'AI 이미지 인식'으로 바꿔 다시 넣어 보세요.");
    const title = q(".title").value.trim() || stem;
    await putExam({id: examId, title, fileName: file.name, pages, checks, addedAt: new Date().toISOString()});
    for (const c of crops) {
      await putProblem({id: `${examId}_q${pad2(c.order)}`, examId, examTitle: title, order: c.order, number: c.number, section: c.section,
        page: c.page + 1, image: c.image, classification: null, unitId: null, generated: []});
    }
    const gaps = [];
    for (let i = 1; i < crops.length; i++) {
      const a = crops[i - 1], b = crops[i];
      if (b.section === a.section && b.number !== a.number + 1) gaps.push(`${a.number}→${b.number}`);
    }
    log(`문제 ${crops.length}개: ${crops.map(c => c.number).join(", ")}`);
    if (gaps.length) log(`⚠ 번호가 건너뛴 곳: ${gaps.join(", ")} — 아래 페이지 이미지를 확인하세요.`);
    status(`자르기 완료: 문제 ${crops.length}개`, 30);
    showReview();
    if ($("#auto-classify").checked) {
      if (settings.apiKey) await runClassify();
      else { log("API 키가 없어 분류는 건너뜁니다. 설정에서 키를 넣고 '단원 분류 시작'을 누르세요."); status(`자르기 완료: 문제 ${crops.length}개 (미분류)`, 100); }
    }
  } catch (e) {
    console.error(e);
    status("오류", 100); q(".status").classList.add("warn"); log("오류: " + e.message);
  }

  function showReview() {
    const exam = state.exams.get(examId);
    q(".review").classList.remove("hidden");
    q(".checks").innerHTML = exam.checks.map((c, i) => `<img src="${c}" alt="${i + 1}쪽" title="${i + 1}쪽">`).join("");
    q(".checks").querySelectorAll("img").forEach(img => img.onclick = () => zoom(img.src));
    renderCrops();
  }
  function renderCrops() {
    const ps = [...state.problems.values()].filter(p => p.examId === examId).sort((a, b) => a.order - b.order);
    q(".crops").innerHTML = ps.map(p => `<div class="pcard" data-id="${esc(p.id)}"><button class="x" title="삭제">✕</button>
      <img class="thumb" src="${p.image}" alt=""><div><b>${p.number}번</b>${p.section ? ` <span class="muted">(구간 ${p.section + 1})</span>` : ""}
      ${p.unitId ? `<div class="muted">${esc(UNITS[p.unitId].label)}</div>` : `<div class="muted">미분류</div>`}</div></div>`).join("");
    q(".crops").querySelectorAll(".pcard").forEach(card => {
      card.onclick = () => openDetail(card.dataset.id, renderCrops);
      card.querySelector(".x").onclick = async ev => { ev.stopPropagation(); await deleteProblem(card.dataset.id); renderCrops(); };
    });
  }
  async function runClassify() {
    const ids = [...state.problems.values()].filter(p => p.examId === examId && !p.classification).map(p => p.id);
    if (!ids.length) { status("분류할 문제가 없습니다", 100); return; }
    q(".go").disabled = true;
    status(`단원 분류 중… 0/${ids.length}`, 30);
    const errors = await classifyMany(ids, (n, total, p) => {
      status(`단원 분류 중… ${n}/${total}`, 30 + 70 * n / total);
      if (p.unitId) log(`${p.number}번 → ${UNITS[p.unitId].label} (난이도 ${p.classification.difficulty})`);
      renderCrops();
    });
    errors.forEach(e => log("분류 실패: " + e));
    status(errors.length ? `분류 완료 (실패 ${errors.length}건 — 다시 누르면 실패한 것만 재시도)` : "분류 완료", 100);
    q(".go").disabled = false;
  }
  q(".title").onchange = async () => {
    const t = q(".title").value.trim(); const exam = state.exams.get(examId); if (!t || !exam) return;
    exam.title = t; await putExam(exam);
    for (const p of state.problems.values()) if (p.examId === examId) { p.examTitle = t; await putProblem(p); }
  };
  q(".go").onclick = () => runClassify().catch(e => log("오류: " + e.message));
  q(".lib").onclick = () => { showTab("library"); $("#f-exam").value = examId; renderLibrary(); };
  q(".del").onclick = async () => { if (confirm("이 시험과 자른 문제를 모두 삭제할까요?")) { await deleteExam(examId); job.remove(); } };
}

["#q", "#f-exam", "#f-diff"].forEach(s => $(s).oninput = () => renderGrid());

function filteredProblems(ignoreUnit = false) {
  const text = $("#q").value.trim().toLowerCase(), exam = $("#f-exam").value, diff = $("#f-diff").value;
  return [...state.problems.values()].filter(p => {
    if (exam && p.examId !== exam) return false;
    if (diff && String(p.classification?.difficulty) !== diff) return false;
    if (!ignoreUnit && state.filter.unit) {
      const f = state.filter.unit;
      if (f === "_none") { if (p.unitId) return false; }
      else if (!p.unitId || !(p.unitId === f || p.unitId.startsWith(f + "-"))) return false;
    }
    if (text) {
      const c = p.classification || {};
      const hay = [p.examTitle, c.transcription, (c.key_concepts || []).join(" "), c.solution_approach, UNITS[p.unitId]?.label].join(" ").toLowerCase();
      if (!hay.includes(text)) return false;
    }
    return true;
  }).sort((a, b) => (a.unitId ? UNIT_IDS.indexOf(a.unitId) : 1e9) - (b.unitId ? UNIT_IDS.indexOf(b.unitId) : 1e9) || a.examId.localeCompare(b.examId) || a.order - b.order);
}

function renderLibrary() {
  const sel = $("#f-exam"), cur = sel.value;
  sel.innerHTML = `<option value="">모든 시험</option>` + [...state.exams.values()].sort((a, b) => b.addedAt.localeCompare(a.addedAt))
    .map(e => `<option value="${esc(e.id)}">${esc(e.title)}</option>`).join("");
  sel.value = state.exams.has(cur) ? cur : "";
  renderGrid();
}

function renderTree() {
  const ps = filteredProblems(true), count = {};
  for (const p of ps) {
    const key = p.unitId || "_none"; count[key] = (count[key] || 0) + 1;
    if (p.unitId) { const [code, ci] = p.unitId.split("-"); count[code] = (count[code] || 0) + 1; count[`${code}-${ci}`] = (count[`${code}-${ci}`] || 0) + 1; }
  }
  const node = (key, label, cls) => `<div class="node ${cls} ${state.filter.unit === key ? "sel" : ""} ${count[key] ? "" : "empty"}" data-k="${key}"><span>${esc(label)}</span><span>${count[key] || ""}</span></div>`;
  let h = `<div class="node l1 ${state.filter.unit ? "" : "sel"}" data-k=""><span>전체</span><span>${ps.length}</span></div>`;
  for (const [code, subject, chapters] of TREE) {
    h += node(code, subject, "l1");
    if (!count[code] && state.filter.unit?.split("-")[0] !== code) continue; // 문제가 없는 과목은 접는다
    chapters.forEach(([chapter, sections], ci) => {
      h += node(`${code}-${ci + 1}`, chapter, "l2");
      sections.forEach((s, ki) => { h += node(`${code}-${ci + 1}-${ki + 1}`, s, "l3"); });
    });
  }
  h += node("_none", "미분류", "l1");
  $("#tree").innerHTML = h;
  $("#tree").querySelectorAll(".node").forEach(n => n.onclick = () => { state.filter.unit = n.dataset.k || null; renderGrid(); });
}

function renderGrid() {
  renderTree();
  const ps = filteredProblems();
  const f = state.filter.unit;
  const where = !f ? "전체" : f === "_none" ? "미분류" : (UNITS[f]?.label || (() => {
    const [code, ci] = f.split("-"); const t = TREE.find(x => x[0] === code);
    return ci ? `${t[1]} > ${t[2][ci - 1][0]}` : t[1];
  })());
  $("#lib-status").textContent = `${where} · ${ps.length}문제`;
  $("#grid").innerHTML = ps.length ? ps.map(p => {
    const c = p.classification;
    return `<div class="pcard" data-id="${esc(p.id)}"><img class="thumb" src="${p.image}" loading="lazy" alt="">
      <div><b>${esc(p.examTitle)} ${p.number}번</b>${c ? ` <span class="muted">· 난이도 ${c.difficulty}</span>` : ""}</div>
      <div class="muted">${p.unitId ? esc(UNITS[p.unitId].section) : "미분류"}${p.generated?.length ? ` · <span class="tag">생성 ${p.generated.length}</span>` : ""}</div>
      ${c ? `<div class="muted" style="font-size:12px">${esc((c.key_concepts || []).slice(0, 3).join(", "))}</div>` : ""}</div>`;
  }).join("") : `<div class="muted">문제가 없습니다. ① PDF 넣기에서 모의고사를 추가하세요.</div>`;
  $("#grid").querySelectorAll(".pcard").forEach(card => card.onclick = () => openDetail(card.dataset.id, renderGrid));
}

$("#btn-classify-all").onclick = async () => {
  const ids = [...state.problems.values()].filter(p => !p.classification).map(p => p.id);
  if (!ids.length) return alert("미분류 문제가 없습니다.");
  if (!settings.apiKey) return showTab("settings");
  const b = $("#btn-classify-all"); b.disabled = true;
  const errors = await classifyMany(ids, (n, t) => { b.textContent = `분류 중 ${n}/${t}`; renderGrid(); });
  b.disabled = false; b.textContent = "미분류 모두 분류";
  if (errors.length) alert("분류 실패:\n" + errors.join("\n"));
};

/* =====================================================================
   화면: 문제 상세 (분류 수정 · 유사문제 생성)
   ===================================================================== */
function unitSelectHTML(selected) {
  let h = `<option value="">(미분류)</option>`;
  for (const [code, subject, chapters] of TREE) {
    h += `<optgroup label="${esc(subject)}">`;
    chapters.forEach(([chapter, sections], ci) => sections.forEach((s, ki) => {
      const id = `${code}-${ci + 1}-${ki + 1}`;
      h += `<option value="${id}" ${id === selected ? "selected" : ""}>${esc(chapter)} › ${esc(s)}</option>`;
    }));
    h += `</optgroup>`;
  }
  return h;
}

function generatedHTML(q, i, withDelete) {
  const v = q.verification;
  const vline = !v ? `<span class="muted">검산 안 함</span>` : v.error ? `<span class="warn">검산 실패: ${esc(v.error)}</span>`
    : v.passed ? `<span class="ok">✓ 검산 통과 (독립 풀이 정답 일치)</span>`
    : `<span class="warn">✗ 검산 불일치 — 독립 풀이 답: ${esc(v.answer)}${v.issues ? ` / 지적: ${esc(v.issues)}` : ""}</span>`;
  return `<div class="problem math" data-i="${i}">
    <div class="row" style="justify-content:space-between"><div><span class="tag">${esc(q.kind)}</span><span class="tag">${esc(UNITS[q.unit_id]?.label || "")}</span>
      <span class="muted">난이도 ${q.difficulty}</span></div>${withDelete ? `<button class="btn danger gdel">삭제</button>` : ""}</div>
    <h4 style="margin:8px 0">${i + 1}. ${esc(q.title)}</h4>
    <div>${escBr(q.statement)}</div>
    ${q.figure_description ? `<p class="muted">[그림] ${escBr(q.figure_description)}</p>` : ""}
    ${q.choices?.length ? `<p>${q.choices.map((c, j) => `${MARKS[j] || j + 1} ${escBr(c)}`).join(" &nbsp;&nbsp; ")}</p>` : ""}
    <details><summary>정답 및 풀이</summary>
      <p><b>정답</b> ${escBr(q.answer)}</p><div>${escBr(q.solution)}</div>
      <p><b>원본과의 관계</b> ${escBr(q.relation_to_original)}</p>
      <p><b>공유 개념</b> ${esc((q.shared_concepts || []).join(", "))}</p>
      <p>${vline}</p></details></div>`;
}

function openDetail(id, onChange) {
  const p = state.problems.get(id); if (!p) return;
  const d = $("#detail"), c = p.classification;
  d.innerHTML = `
    <div class="dhead"><b>${esc(p.examTitle)} ${p.number}번</b><button class="btn close">닫기</button></div>
    <div class="dbody">
      <div>
        <img class="orig" src="${p.image}" alt="문제 이미지">
        <div class="row" style="margin-top:8px">
          <label>단원 <select class="unit" style="max-width:300px">${unitSelectHTML(p.unitId)}</select></label>
        </div>
        <div class="row" style="margin-top:8px">
          <button class="btn reclass">${c ? "AI로 다시 분류" : "AI로 분류"}</button>
          <button class="btn save-img">이미지 저장</button>
          <button class="btn danger delp">문제 삭제</button>
          <span class="muted msg"></span>
        </div>
        ${c ? `<div class="math" style="margin-top:12px">
          <div><span class="tag">${esc(c.question_type)}</span><span class="tag">난이도 ${c.difficulty}</span>
            ${p.unitManual ? `<span class="tag">단원 직접 지정</span>` : ""}</div>
          ${c.secondary_unit_ids?.length ? `<p class="muted">함께 쓰이는 단원: ${c.secondary_unit_ids.map(u => esc(UNITS[u]?.label)).join(", ")}</p>` : ""}
          <p><b>핵심 개념</b> ${esc(c.key_concepts.join(", "))}</p>
          <p><b>핵심 접근법</b> ${escBr(c.solution_approach)}</p>
          <details><summary>옮겨 적은 문제</summary><div>${escBr(c.transcription)}</div>
            ${c.figure_description ? `<p class="muted">[그림] ${escBr(c.figure_description)}</p>` : ""}</details>
          <details><summary>정답 및 풀이</summary><p><b>정답</b> ${escBr(c.answer || "(판단 불가)")}</p><div>${escBr(c.solution)}</div></details>
        </div>` : `<p class="muted">아직 분류되지 않았습니다.</p>`}
      </div>
      <div>
        <h3 style="margin-top:0">유사·연계 문제 만들기</h3>
        <div class="row">
          <label>유사문제 <input type="number" class="n-sim" min="0" max="10" value="2"></label>
          <label>변형문제 <input type="number" class="n-var" min="0" max="10" value="1"></label>
          <label>개념연계 <input type="number" class="n-con" min="0" max="10" value="2"></label>
        </div>
        <textarea class="extra" rows="2" placeholder="추가 요청 (예: 난이도를 한 단계 낮춰서, 단답형으로만)" style="margin-top:8px"></textarea>
        <div class="row" style="margin-top:6px">
          <label><input type="checkbox" class="verify" checked> 독립 풀이로 검산</label>
          <button class="btn primary gen">문제 만들기</button>
          <button class="btn sheet" ${p.generated?.length ? "" : "disabled"}>학습지 HTML 저장</button>
        </div>
        <div class="muted genmsg" style="margin-top:6px"></div>
        <div class="gens"></div>
      </div>
    </div>`;
  const q = s => d.querySelector(s);
  const changed = () => onChange?.();
  const renderGens = () => {
    const gs = p.generated || [];
    q(".gens").innerHTML = gs.length ? gs.map((g, i) => generatedHTML(g, i, true)).join("") : `<p class="muted">아직 만든 문제가 없습니다.</p>`;
    q(".gens").querySelectorAll(".gdel").forEach(b => b.onclick = async () => {
      const i = +b.closest(".problem").dataset.i; p.generated.splice(i, 1); await putProblem(p); renderGens(); changed();
    });
    q(".sheet").disabled = !gs.length;
    renderMath(q(".gens"));
  };
  renderGens(); renderMath(d);
  q(".close").onclick = () => d.close();
  q(".unit").onchange = async () => {
    p.unitId = q(".unit").value || null; p.unitManual = true; await putProblem(p);
    q(".msg").textContent = "단원을 바꿨습니다."; changed();
  };
  q(".reclass").onclick = async () => {
    q(".reclass").disabled = true; q(".msg").textContent = "분류 중…";
    try { await classifyProblem(p); changed(); openDetail(id, onChange); }
    catch (e) { q(".msg").textContent = "오류: " + e.message; q(".reclass").disabled = false; }
  };
  q(".save-img").onclick = () => download(`${p.id}.png`, dataURLtoBlob(p.image));
  q(".delp").onclick = async () => { if (confirm("이 문제를 삭제할까요?")) { await deleteProblem(p.id); d.close(); changed(); } };
  q(".gen").onclick = async () => {
    const counts = {"유사문제": +q(".n-sim").value || 0, "변형문제": +q(".n-var").value || 0, "개념연계문제": +q(".n-con").value || 0};
    q(".gen").disabled = true;
    try {
      if (!p.classification) { q(".genmsg").textContent = "먼저 분류하는 중…"; await classifyProblem(p); }
      const made = await generateFor(p, counts, q(".extra").value.trim(), q(".verify").checked, m => q(".genmsg").textContent = m);
      const bad = made.filter(m => m.verification && !m.verification.passed).length;
      q(".genmsg").textContent = `${made.length}문제를 만들었습니다.` + (bad ? ` 검산 불일치 ${bad}건은 꼭 확인하세요.` : "");
      renderGens(); changed();
    } catch (e) { q(".genmsg").textContent = "오류: " + e.message; }
    q(".gen").disabled = false;
  };
  q(".sheet").onclick = () => download(`${p.id}_연계문제.html`, new Blob([worksheetHTML(p)], {type: "text/html"}));
  if (!d.open) d.showModal();
}

/* =====================================================================
   내보내기 / 가져오기
   ===================================================================== */
function worksheetHTML(p) {
  const c = p.classification || {};
  return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(p.examTitle)} ${p.number}번 연계 문제</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"><\/script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})"><\/script>
<style>body{font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;max-width:860px;margin:0 auto;padding:16px;line-height:1.7;color:#1d1d1f;background:#fff}
.muted{color:#6b7280;font-size:.9em}img{max-width:min(100%,640px);border:1px solid #e5e7eb;border-radius:6px}
.problem{border:1px solid #e5e7eb;border-radius:8px;padding:16px;margin:16px 0;break-inside:avoid}
.tag{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:4px;padding:0 6px;margin-right:4px;font-size:.85em}
.ok{color:#047857}.warn{color:#b91c1c}summary{cursor:pointer;color:#374151}.row{display:flex;justify-content:space-between}
@media print{details{display:none}}</style></head><body>
<h1>${esc(p.examTitle)} ${p.number}번 — 유사·연계 문제</h1>
<img src="${p.image}" alt="원본 문제">
<p><span class="tag">${esc(UNITS[p.unitId]?.label || "미분류")}</span></p>
<p><b>핵심 개념</b> ${esc((c.key_concepts || []).join(", "))}<br><b>핵심 접근법</b> ${escBr(c.solution_approach || "")}</p>
${(p.generated || []).map((g, i) => generatedHTML(g, i, false)).join("\n")}
</body></html>`;
}

function backupObject() {
  return {format: "mathgen-backup", version: 1, exportedAt: new Date().toISOString(),
    exams: [...state.exams.values()], problems: [...state.problems.values()]};
}

// path → Blob|string 목록 (ZIP 과 폴더 저장이 같은 구조를 쓴다)
function exportEntries() {
  const entries = [];
  const index = [];
  for (const p of state.problems.values()) {
    const png = dataURLtoBlob(p.image);
    entries.push([`exams/${p.examId}/q${pad2(p.order)}.png`, png]);
    const u = UNITS[p.unitId];
    entries.push([`units/${u ? unitPath(u) : "99_미분류"}/${p.id}.png`, png]);
    if (p.generated?.length) entries.push([`generated/${p.id}.html`, worksheetHTML(p)]);
    const {image, ...meta} = p;
    index.push({...meta, unitLabel: u?.label || null});
  }
  entries.push(["index.json", JSON.stringify(index, null, 2)]);
  entries.push(["backup.json", JSON.stringify(backupObject())]);
  return entries;
}

$("#btn-zip").onclick = async () => {
  if (!state.problems.size) return alert("내보낼 문제가 없습니다.");
  const zip = new JSZip();
  for (const [path, data] of exportEntries()) zip.file(path, data);
  const blob = await zip.generateAsync({type: "blob"});
  download(`문제저장소_${new Date().toISOString().slice(0, 10)}.zip`, blob);
};

$("#btn-folder").onclick = async () => {
  if (!window.showDirectoryPicker) return alert("이 브라우저는 폴더 저장을 지원하지 않습니다. 크롬이나 엣지를 쓰거나 'ZIP으로 내보내기'를 이용하세요.");
  if (!state.problems.size) return alert("저장할 문제가 없습니다.");
  let root; try { root = await window.showDirectoryPicker({mode: "readwrite"}); } catch (e) { return; }
  const b = $("#btn-folder"); b.disabled = true;
  try {
    const entries = exportEntries();
    for (let i = 0; i < entries.length; i++) {
      const [path, data] = entries[i];
      const parts = path.split("/"); let dir = root;
      for (const part of parts.slice(0, -1)) dir = await dir.getDirectoryHandle(part, {create: true});
      const fh = await dir.getFileHandle(parts.at(-1), {create: true});
      const w = await fh.createWritable(); await w.write(data); await w.close();
      b.textContent = `저장 중 ${i + 1}/${entries.length}`;
    }
    alert("저장했습니다. units 폴더에 단원별로 정리되어 있습니다.");
  } catch (e) { alert("저장 실패: " + e.message); }
  b.disabled = false; b.textContent = "폴더에 단원별 저장";
};

$("#btn-import").onclick = () => $("#import-file").click();
$("#import-file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const zip = await JSZip.loadAsync(f);
    const entry = zip.file("backup.json");
    if (!entry) throw new Error("backup.json 이 없는 ZIP 입니다.");
    const data = JSON.parse(await entry.async("string"));
    if (data.format !== "mathgen-backup") throw new Error("이 프로그램의 백업 파일이 아닙니다.");
    for (const ex of data.exams) await putExam(ex);
    for (const p of data.problems) await putProblem(p);
    alert(`불러왔습니다: 시험 ${data.exams.length}개, 문제 ${data.problems.length}개`);
    renderLibrary();
  } catch (err) { alert("불러오기 실패: " + err.message); }
};

/* =====================================================================
   화면: 설정
   ===================================================================== */
function renderSettings() {
  $("#s-key").value = settings.apiKey; $("#s-remember").checked = settings.remember;
  $("#s-model").value = settings.model; $("#s-conc").value = settings.concurrency;
  const gen = [...state.problems.values()].reduce((s, p) => s + (p.generated?.length || 0), 0);
  $("#s-stats").textContent = `시험 ${state.exams.size}개 · 문제 ${state.problems.size}개 · 생성 문제 ${gen}개`;
}
$("#s-save").onclick = () => {
  settings.apiKey = $("#s-key").value.trim(); settings.remember = $("#s-remember").checked;
  settings.model = $("#s-model").value.trim() || "claude-opus-5-5";
  settings.concurrency = Math.min(8, Math.max(1, +$("#s-conc").value || 3));
  saveSettings(); $("#s-msg").textContent = "저장했습니다."; setTimeout(() => $("#s-msg").textContent = "", 2000);
};
$("#s-wipe").onclick = async () => {
  if (!confirm("저장된 모든 시험·문제·생성 결과를 삭제할까요? 되돌릴 수 없습니다.")) return;
  await DB.clear("exams"); await DB.clear("problems"); state.exams.clear(); state.problems.clear();
  $("#jobs").innerHTML = ""; renderSettings();
};

/* =====================================================================
   시작
   ===================================================================== */
(async function init() {
  loadSettings(); saveSettings();
  if (!window.pdfjsLib || !window.JSZip) {
    $("#jobs").innerHTML = `<div class="card warn">필요한 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.</div>`;
  }
  try {
    await DB.open();
    for (const e of await DB.all("exams")) state.exams.set(e.id, e);
    for (const p of await DB.all("problems")) state.problems.set(p.id, p);
  } catch (e) {
    $("#jobs").innerHTML = `<div class="card warn">브라우저 저장소(IndexedDB)를 열 수 없습니다: ${esc(e.message)}. 시크릿 창이 아닌 일반 창에서 여세요.</div>`;
  }
  if (!settings.apiKey) $("#keywarn").classList.remove("hidden");
})();
</script>
