<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모의고사 문제 도우미</title>
<!-- 이 파일은 tools/build.py 가 src/ 로부터 만든 결과물입니다. 고칠 때는 src/ 를 고친 뒤 다시 빌드하세요. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
/* 레이아웃: 시험지처럼 흰 종이 위에 단을 나눈 작업대. 위쪽 고정 탭, 저장소는 단원 트리 + 문항 카드,
   문항 상세는 왼쪽 문제 이미지 + 오른쪽 정답·풀이 패널. 강조색은 OMR 답안지의 빨강. */
:root{
  --paper:#f4f4ef; --surface:#ffffff; --sunken:#efefe9; --ink:#1c1d1f; --muted:#5f636a; --rule:#dcded8; --hover:#ebebe5;
  --omr:#c8352b; --omr-ink:#ffffff; --omr-weak:#fbebe8; --omr-text:#a32a21;
  --blue:#2f5d8a; --blue-weak:#e6eef6; --ok:#17794a; --ok-weak:#e2f3e9; --caution:#9a5405; --caution-weak:#fbf0de; --bad:#b4231a;
  --scrim:rgba(20,20,22,.5); --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-title:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131415; --surface:#1c1d1f; --sunken:#17181a; --ink:#ebebe6; --muted:#a2a6ac; --rule:#323439; --hover:#26282b;
    --omr:#e2574b; --omr-ink:#1a0d0b; --omr-weak:#3a1d1a; --omr-text:#f2a198;
    --blue:#8fb8e3; --blue-weak:#1c2a3a; --ok:#4cc38a; --ok-weak:#16301f; --caution:#e0a050; --caution-weak:#33270f; --bad:#f47a6f;
    --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131415; --surface:#1c1d1f; --sunken:#17181a; --ink:#ebebe6; --muted:#a2a6ac; --rule:#323439; --hover:#26282b;
  --omr:#e2574b; --omr-ink:#1a0d0b; --omr-weak:#3a1d1a; --omr-text:#f2a198;
  --blue:#8fb8e3; --blue-weak:#1c2a3a; --ok:#4cc38a; --ok-weak:#16301f; --caution:#e0a050; --caution-weak:#33270f; --bad:#f47a6f;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--font-title);font-weight:700;text-wrap:balance;margin:0}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.math{overflow-x:auto;min-width:0}

/* ---------- 머리 ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar{max-width:1280px;margin:0 auto;padding-block:10px;display:flex;gap:8px 20px;align-items:center;flex-wrap:wrap}
.brand{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .pip{width:14px;height:20px;border:2px solid var(--omr);border-radius:7px;background:linear-gradient(var(--omr),var(--omr)) center/6px 10px no-repeat}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;color:var(--muted);padding:7px 12px;border-radius:7px;cursor:pointer}
nav.tabs button:hover{background:var(--hover)}
nav.tabs button[aria-selected="true"]{background:var(--omr-weak);color:var(--omr-text);font-weight:600}
.ai-pill{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;background:none;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--caution)} .dot.on{background:var(--ok)}
main{max-width:1280px;margin:0 auto;padding-block:18px 56px}

/* ---------- 공통 부품 ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:16px;margin-bottom:16px;min-width:0}
.btn{background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:6px 12px;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.primary{background:var(--omr);border-color:var(--omr);color:var(--omr-ink);font-weight:600}
.btn.primary:hover:not(:disabled){background:var(--omr);filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=password],input[type=number],textarea{background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:5px 9px;max-width:100%}
input[type=number]{width:62px;font-family:var(--font-num)}
textarea{width:100%;resize:vertical}
label.field{display:grid;gap:4px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:0 9px;font-size:12px;line-height:22px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.red{background:var(--omr-weak);color:var(--omr-text)}
.chip.blue{background:var(--blue-weak);color:var(--blue)}
.chip.ok{background:var(--ok-weak);color:var(--ok)}
.chip.warn{background:var(--caution-weak);color:var(--caution)}
.chip.bad{background:var(--omr-weak);color:var(--bad)}
.qnum{font-family:var(--font-num);font-weight:500;display:inline-flex;align-items:center;justify-content:center;min-width:2.1em;height:1.75em;border:1.5px solid var(--ink);border-radius:5px;padding:0 5px;font-size:13px}
.qnum.big{font-size:20px;min-width:2.3em;height:1.8em;border-width:2px}
.dots{font-family:var(--font-num);font-size:11px;letter-spacing:.1em;color:var(--muted)}
.ok{color:var(--ok)} .warn{color:var(--caution)} .bad{color:var(--bad)}
.empty-state{padding:36px 12px;text-align:center;color:var(--muted)}
.empty-state h3{color:var(--ink);margin-bottom:8px}
.callout{border-left:3px solid var(--blue);background:var(--blue-weak);border-radius:0 8px 8px 0;padding:8px 12px}
.notice{border-left:3px solid var(--caution);background:var(--caution-weak);border-radius:0 8px 8px 0;padding:8px 12px;font-size:14px}

/* ---------- ① PDF 넣기 ---------- */
.drop{border:2px dashed var(--rule);border-radius:var(--radius);padding:30px 16px;text-align:center;cursor:pointer;display:grid;gap:4px;background:var(--surface)}
.drop:hover,.drop.over{border-color:var(--omr);background:var(--omr-weak)}
.drop strong{font-size:17px}
.drop.disabled{opacity:.5;pointer-events:none}
.progress{height:6px;background:var(--sunken);border-radius:3px;overflow:hidden;margin:10px 0}
.progress>div{height:100%;background:var(--omr);width:0;transition:width .2s}
.log{font-size:13px;color:var(--muted);max-height:140px;overflow:auto;white-space:pre-wrap;font-variant-numeric:tabular-nums}
.checks{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.checks img{height:200px;max-width:none;border:1px solid var(--rule);border-radius:6px;cursor:zoom-in;background:#fff}
.steps-guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;text-align:left;margin-top:12px}
.steps-guide div{background:var(--sunken);border-radius:8px;padding:12px}
.steps-guide b{display:block;font-family:var(--font-title);margin-bottom:2px}

/* ---------- 카드 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:10px;cursor:pointer;display:grid;gap:8px;align-content:start;position:relative;min-width:0;text-align:left}
.card:hover{border-color:var(--omr);box-shadow:var(--shadow)}
.card-top{display:flex;gap:6px;align-items:center;min-width:0}
.card-top .exam{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.thumb{background:#fff;border:1px solid var(--rule);border-radius:6px;display:block;width:100%;height:150px;object-fit:contain;object-position:top left}
.card-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.card-foot .unit{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .x{position:absolute;top:8px;right:8px;border:1px solid var(--rule);background:var(--surface);color:var(--bad);border-radius:5px;cursor:pointer;padding:0 7px;line-height:1.6}
.ans-mini{font-family:var(--font-num);font-size:12px;border:1px solid var(--omr);color:var(--omr-text);border-radius:999px;padding:0 8px;line-height:20px}

/* ---------- ② 저장소 ---------- */
.lib{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:800px){.lib{grid-template-columns:minmax(0,1fr)}}
aside.tree{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 96px);overflow:auto}
@media (max-width:800px){aside.tree{position:static;max-height:260px}}
.node{display:flex;justify-content:space-between;gap:8px;padding:3px 8px;border-radius:6px;cursor:pointer;font-size:14px;width:100%;background:none;border:0;text-align:left;color:inherit;font-family:inherit}
.node:hover{background:var(--hover)}
.node.sel{background:var(--omr-weak);color:var(--omr-text)}
.node .n{font-family:var(--font-num);font-size:12px}
.node.l1{font-weight:600;margin-top:6px} .node.l2{padding-left:16px} .node.l3{padding-left:30px;color:var(--muted)}
.node.empty{opacity:.45}

/* ---------- 정답 표시 (OMR) ---------- */
.omr{display:inline-flex;gap:6px}
.bubble{width:30px;height:40px;border-radius:15px;border:1.5px solid var(--omr);background:var(--surface);color:var(--omr-text);font-family:var(--font-num);font-size:14px;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:default}
.bubble.fill{background:var(--omr);color:var(--omr-ink)}
.bubble.mine{border-color:var(--ink);color:var(--ink)}
.bubble.mine.fill{background:var(--ink);color:var(--surface)}
button.bubble.mine{cursor:pointer}
button.bubble.mine:hover:not(.fill){background:var(--hover)}
.digits{display:inline-flex;gap:4px}
.digit{width:30px;height:40px;border:1.5px solid var(--omr);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:17px;color:var(--omr-text);background:var(--surface)}
.digit.empty{opacity:.35}
.ans-text{font-family:var(--font-num);font-size:16px;border:1.5px solid var(--omr);border-radius:6px;padding:4px 10px;color:var(--omr-text)}
.answer-card{border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);padding:14px 16px;display:grid;gap:12px}
.ans-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:center}
.ans-row .lab{font-size:13px;color:var(--muted)}
.ans-row .val{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* ---------- 풀이 단계 ---------- */
.solution{display:grid;gap:10px}
.sol-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg-mini{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.seg-mini button{border:0;background:none;padding:3px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg-mini button[aria-pressed="true"]{background:var(--sunken);color:var(--ink);font-weight:600}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:step;display:grid;gap:0}
ol.steps li{counter-increment:step;position:relative;padding:2px 0 14px 40px;min-width:0}
ol.steps li::before{content:counter(step);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--blue-weak);color:var(--blue);font-family:var(--font-num);font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:600}
ol.steps li::after{content:"";position:absolute;left:12.5px;top:28px;bottom:2px;width:1px;background:var(--rule)}
ol.steps li:last-child::after{display:none}
ol.steps li:last-child{padding-bottom:2px}

/* ---------- 문항 상세 ---------- */
dialog{border:1px solid var(--rule);border-radius:14px;padding:0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:var(--scrim)}
dialog#detail{width:min(1200px,calc(100vw - 24px));height:min(900px,calc(100vh - 32px));max-height:none}
dialog#detail[open]{display:grid;grid-template-rows:auto minmax(0,1fr)}
.d-head{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.d-title{display:flex;gap:10px;align-items:center;min-width:0;flex:1}
.d-title .meta{min-width:0}
.d-title .exam{font-family:var(--font-title);font-weight:700;font-size:17px;line-height:1.3}
.d-title .crumb{font-size:13px;color:var(--muted)}
.d-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);min-height:0}
@media (max-width:900px){.d-body{grid-template-columns:minmax(0,1fr);overflow:auto}.d-figure,.d-panel{overflow:visible!important}}
.d-figure{margin:0;padding:16px;overflow:auto;background:var(--sunken);border-right:1px solid var(--rule)}
.d-figure img{width:100%;background:#fff;border:1px solid var(--rule);border-radius:8px;display:block}
.d-figure figcaption{margin-top:8px;font-size:13px;color:var(--muted)}
.d-panel{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.seg{display:flex;gap:2px;padding:10px 16px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);margin-bottom:-1px}
.seg button[aria-selected="true"]{border-bottom-color:var(--omr);color:var(--ink);font-weight:600}
.seg-body{overflow:auto;padding:16px;display:grid;gap:16px;align-content:start}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.gen{border:1px solid var(--rule);border-radius:var(--radius);padding:14px;display:grid;gap:10px;min-width:0}
.gen h4{font-size:16px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px 12px;margin:0;padding:0;list-style:none}
.reveal{border-top:1px dashed var(--rule);padding-top:10px;display:grid;gap:10px}
.gen-form{background:var(--sunken);border-radius:var(--radius);padding:12px;display:grid;gap:8px}
details summary{cursor:pointer;color:var(--muted)}

/* ---------- ③ 문항 표 ---------- */
.tablewrap{overflow:auto;max-height:calc(100vh - 250px);border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface)}
table.sheet{border-collapse:collapse;font-size:13px;min-width:100%}
table.sheet th,table.sheet td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);padding:5px 9px;text-align:left;vertical-align:top;white-space:nowrap}
table.sheet th{position:sticky;top:0;background:var(--sunken);z-index:1;cursor:pointer;user-select:none;font-weight:600}
table.sheet th.nosort{cursor:default}
table.sheet td.wrap{white-space:normal;min-width:220px;max-width:360px}
table.sheet td.num{text-align:right;font-variant-numeric:tabular-nums}
table.sheet td.ans{font-family:var(--font-num);color:var(--omr-text);text-align:center}
table.sheet tbody tr:hover td{background:var(--hover)}
table.sheet input[type=text]{width:64px;padding:2px 6px;font-family:var(--font-num)}

/* ---------- 설정 ---------- */
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}

/* ---------- 알림 ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:7px;font-size:14px;z-index:30;max-width:calc(100vw - 32px)}
.confirm-box{padding:20px;display:grid;gap:16px;max-width:420px}
#zoom img{max-height:88vh;max-width:calc(100vw - 40px);display:block;background:#fff}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<header class="top gutter">
  <div class="bar">
    <h1 class="brand"><span class="pip" aria-hidden="true"></span>모의고사 문제 도우미</h1>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="ingest" aria-selected="true">① PDF 넣기</button>
      <button role="tab" data-tab="library" aria-selected="false">② 문제 저장소</button>
      <button role="tab" data-tab="table" aria-selected="false">③ 문항 표</button>
      <button role="tab" data-tab="settings" aria-selected="false" id="settings-tab">설정</button>
    </nav>
    <button class="ai-pill" id="ai-pill" title="AI 상태"><span class="dot" id="ai-dot"></span><span id="ai-label">확인 중…</span></button>
  </div>
</header>

<main class="gutter">
  <!-- ① PDF 넣기 -->
  <section id="tab-ingest">
    <div id="drop" class="drop disabled" role="button" tabindex="0" aria-label="PDF 파일 선택">
      <strong>모의고사 PDF를 여기에 끌어다 놓으세요</strong>
      <span class="muted">또는 눌러서 파일 선택 (여러 개 가능)</span>
      <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
    </div>
    <div class="panel row" style="margin-top:12px">
      <label for="split-mode">자르기 방식</label>
      <select id="split-mode">
        <option value="auto">자동 (텍스트 PDF는 번호 분석, 스캔본은 AI)</option>
        <option value="text">텍스트 분석만 (AI 사용 안 함)</option>
        <option value="vision">AI 이미지 인식 (스캔본용)</option>
      </select>
      <label><input id="auto-classify" type="checkbox" checked> 자른 뒤 바로 단원 분류·풀이</label>
      <label><input id="auto-solve" type="checkbox"> 한 번 더 따로 풀어 정답 교차 확인</label>
    </div>
    <p id="ingest-note" class="notice" hidden></p>
    <div id="jobs"></div>
    <div id="ingest-empty" class="panel empty-state">
      <h3>이렇게 진행됩니다</h3>
      <div class="steps-guide">
        <div><b>1. 자르기</b>각 페이지에서 <span class="qnum">1.</span> <span class="qnum">2.</span> 같은 문항 번호를 찾아 문항별 이미지로 자릅니다.</div>

<script>
"use strict";
/* =====================================================================
   다운로드(단일 HTML) 버전의 플랫폼 부분
   - AI: 설정 탭에서 고른 제공자(Claude, OpenAI, Gemini, OpenAI 호환)를 API 키로 직접 호출
   - 저장: 이 브라우저의 IndexedDB (이미지는 data URL)
   - 파일 저장: 브라우저 다운로드, 폴더 저장(크롬·엣지)
   ===================================================================== */
const PLATFORM = (() => {
  const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  const PROVIDERS = {
    anthropic: {label: "Claude (Anthropic)", short: "Claude", keyHint: "sk-ant-...", defaultModel: "claude-opus-5-5",
      help: "키 발급: platform.claude.com → API Keys. 모델은 claude-opus-5-5 를 권장합니다."},
    openai: {label: "OpenAI (GPT)", short: "OpenAI", keyHint: "sk-...", defaultModel: "",
      help: "키 발급: platform.openai.com → API keys. '모델 목록 불러오기'로 이미지 입력을 지원하는 모델을 고르세요."},
    gemini: {label: "Google Gemini", short: "Gemini", keyHint: "AIza...", defaultModel: "",
      help: "키 발급: aistudio.google.com → Get API key. '모델 목록 불러오기'로 모델을 고르세요."},
    compat: {label: "OpenAI 호환 서버 (OpenRouter, 로컬 등)", short: "호환 서버", keyHint: "키 (필요 없으면 비워 둠)", defaultModel: "",
      help: "OpenAI Chat Completions 형식을 따르는 서버의 Base URL 과 모델 이름을 넣으세요. 문항 이미지를 읽을 수 있는(비전) 모델이어야 합니다."},
  };
  const settings = {provider: "anthropic", keys: {}, models: {anthropic: "claude-opus-5-5"}, baseUrl: "", remember: false, concurrency: 3};
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem("mathgen.settings") || "{}");
      if (s.apiKey && !s.keys) s.keys = {anthropic: s.apiKey}; // 이전 버전 설정
      if (s.model && !s.models) s.models = {anthropic: s.model};
      delete s.apiKey; delete s.model;
      Object.assign(settings, s);
      settings.keys = {...(s.keys || {})}; settings.models = {anthropic: "claude-opus-5-5", ...(s.models || {})};
    } catch (e) { /* 저장소 사용 불가 */ }
  }
  function saveSettings() {
    try { localStorage.setItem("mathgen.settings", JSON.stringify({...settings, keys: settings.remember ? settings.keys : {}})); } catch (e) { /* 무시 */ }
    updateStatus();
  }
  const curModel = () => str(settings.models[settings.provider] || PROVIDERS[settings.provider].defaultModel).trim();
  function configured() {
    const p = settings.provider;
    if (!curModel()) return false;
    return p === "compat" ? !!settings.baseUrl.trim() : !!settings.keys[p];
  }

  /* ---------- HTTP ---------- */
  class RetryableError extends Error {}
  function errorMessageFrom(status, text) {
    let msg = text;
    try { const j = JSON.parse(text); msg = j.error?.message || j.error?.status || j.message || (typeof j.error === "string" ? j.error : text); } catch (e) { /* 원문 */ }
    if (status === 401 || status === 403) msg = `API 키가 올바르지 않거나 권한이 없습니다. 설정을 확인하세요. (${String(msg).slice(0, 160)})`;
    return `AI 오류 ${status}: ${String(msg).slice(0, 400)}`;
  }
  async function httpFetch(url, init) {
    let res;
    try { res = await fetch(url, init); } catch (e) { throw new RetryableError("네트워크 오류: " + e.message); }
    if (res.status === 429 || res.status >= 500) {
      const err = new RetryableError(errorMessageFrom(res.status, await res.text()));
      err.wait = (Number(res.headers.get("retry-after")) || 0) * 1000; throw err;
    }
    if (!res.ok) { const err = new Error(errorMessageFrom(res.status, await res.text())); err.status = res.status; throw err; }
    return res;
  }
  async function withRetry(fn) {
    for (let attempt = 0; ; attempt++) {
      try { return await fn(); }
      catch (e) {
        if (e instanceof RetryableError && attempt < 4) { await sleep(Math.max(e.wait || 0, 2000 * 2 ** attempt)); continue; }
        throw e;
      }
    }
  }

  /* ---------- Claude (Anthropic Messages API, 스트리밍) ---------- */
  const CLAUDE_MODERN = /^claude-(opus|sonnet|fable|mythos)-(5|4-[6-9])|^claude-haiku-5/;
  const CLAUDE_FALLBACK = /^claude-(opus-5-5|opus-5$|fable-5-[12]|sonnet-5-5|mythos-5-[12])/;
  async function readSSE(res) {
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "", text = "", stopReason = null, stopDetails = null;
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true}).replace(/\r\n/g, "\n");
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        for (const line of chunk.split("\n")) {
          if (!line.startsWith("data:")) continue;
          let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
          if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta") text += ev.delta.text;
          else if (ev.type === "message_delta") { stopReason = ev.delta?.stop_reason ?? stopReason; stopDetails = ev.delta?.stop_details ?? stopDetails; }
          else if (ev.type === "error") {
            const t = ev.error?.type || "", msg = `AI 오류(${t}): ${ev.error?.message || ""}`;
            throw (t === "overloaded_error" || t === "api_error") ? new RetryableError(msg) : new Error(msg);
          }
        }
      }
    }
    return {text, stopReason, stopDetails};
  }
  async function callClaude({key, model, system, content, schema, effort, maxTokens}) {
    const modern = CLAUDE_MODERN.test(model);
    const body = {model, max_tokens: modern ? maxTokens : Math.min(maxTokens, 16000), stream: true,
      system: [{type: "text", text: modern ? system : system + schemaInstruction(schema), cache_control: {type: "ephemeral"}}],
      messages: [{role: "user", content}]};
    if (modern) { body.thinking = {type: "adaptive"}; body.output_config = {effort, format: {type: "json_schema", schema}}; }
    const headers = {"content-type": "application/json", "x-api-key": key, "anthropic-version": "2026-10-21", "anthropic-dangerous-direct-browser-access": "true"};
    if (CLAUDE_FALLBACK.test(model)) { body.fallbacks = "default"; headers["anthropic-beta"] = "server-side-fallback-2026-07-01"; } // 안전 분류기 거절 시 권장 모델로 자동 재시도
    const res = await httpFetch("https://api.anthropic.com/v1/messages", {method: "POST", headers, body: JSON.stringify(body)});
    const {text, stopReason, stopDetails} = await readSSE(res);
    if (stopReason === "refusal") throw new Error(`AI 가 요청을 거절했습니다 (${stopDetails?.category || "사유 미상"})`);
    if (stopReason === "max_tokens") throw new Error("응답이 너무 길어 잘렸습니다. 한 번에 만드는 문제 수를 줄여 보세요.");
    return text;
  }
  /* ---------- OpenAI 및 OpenAI 호환 (Chat Completions) ---------- */
  async function callOpenAI({base, key, model, system, content, schema, strict}) {
    const user = content.map(b => b.type === "image"
      ? {type: "image_url", image_url: {url: `data:${b.source.media_type};base64,${b.source.data}`}}
      : {type: "text", text: b.text});
    const body = {model, messages: [{role: "system", content: system + schemaInstruction(schema)}, {role: "user", content: user}]};
    body.response_format = strict ? {type: "json_schema", json_schema: {name: "result", strict: true, schema}} : {type: "json_object"};
    const headers = {"content-type": "application/json"};
    if (key) headers.authorization = `Bearer ${key}`;
    const url = base.replace(/\/+$/, "") + "/chat/completions";
    let res;
    try { res = await httpFetch(url, {method: "POST", headers, body: JSON.stringify(body)}); }
    catch (e) {
      if (!strict && e.status === 400) { delete body.response_format; res = await httpFetch(url, {method: "POST", headers, body: JSON.stringify(body)}); } // response_format 을 모르는 서버
      else throw e;
    }
    const data = await res.json(), choice = data.choices?.[0];
    if (choice?.message?.refusal) throw new Error("AI 가 요청을 거절했습니다: " + choice.message.refusal);
    if (choice?.finish_reason === "length") throw new Error("응답이 너무 길어 잘렸습니다. 한 번에 만드는 문제 수를 줄여 보세요.");
    const msg = choice?.message?.content;
    return Array.isArray(msg) ? msg.map(m => m.text || "").join("") : str(msg);
  }
  /* ---------- Google Gemini (generateContent) ---------- */
  async function callGemini({key, model, system, content, schema}) {
    const parts = content.map(b => b.type === "image" ? {inlineData: {mimeType: b.source.media_type, data: b.source.data}} : {text: b.text});
    const body = {systemInstruction: {parts: [{text: system + schemaInstruction(schema)}]}, contents: [{role: "user", parts}],
      generationConfig: {responseMimeType: "application/json"}};
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
    const res = await httpFetch(url, {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body)});
    const data = await res.json();
    if (data.promptFeedback?.blockReason) throw new Error("AI 가 요청을 거절했습니다: " + data.promptFeedback.blockReason);
    const cand = data.candidates?.[0];
    if (cand?.finishReason === "MAX_TOKENS") throw new Error("응답이 너무 길어 잘렸습니다. 한 번에 만드는 문제 수를 줄여 보세요.");
    if (cand?.finishReason === "SAFETY") throw new Error("AI 가 안전 정책으로 응답을 막았습니다.");
    return (cand?.content?.parts || []).map(p => p.text || "").join("");
  }
  async function ask({system, text, images = [], schema, effort = "high", maxTokens = 64000}) {
    if (!configured()) throw new Error("설정 탭에서 AI 제공자, API 키, 모델을 먼저 입력하세요.");
    const prov = settings.provider, key = str(settings.keys[prov]).trim(), model = curModel();
    const content = [];
    for (const b of images) {
      const d = await blobToDataURL(b);
      content.push({type: "image", source: {type: "base64", media_type: d.slice(5, d.indexOf(";")), data: d.slice(d.indexOf(",") + 1)}});
    }
    content.push({type: "text", text});
    const out = await withRetry(() => {
      if (prov === "anthropic") return callClaude({key, model, system, content, schema, effort, maxTokens});
      if (prov === "openai") return callOpenAI({base: "https://api.openai.com/v1", key, model, system, content, schema, strict: true});
      if (prov === "gemini") return callGemini({key, model, system, content, schema});
      return callOpenAI({base: settings.baseUrl.trim(), key, model, system, content, schema, strict: false});
    });
    return parseLooseJSON(out);
  }
  async function listModels() {
    const prov = settings.provider, key = str(settings.keys[prov]).trim();
    if (prov === "anthropic") {
      const res = await httpFetch("https://api.anthropic.com/v1/models?limit=100", {headers: {"x-api-key": key, "anthropic-version": "2026-10-21", "anthropic-dangerous-direct-browser-access": "true"}});
      return (await res.json()).data.map(m => m.id);
    }
    if (prov === "gemini") {
      const res = await httpFetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=${encodeURIComponent(key)}`);
      return (await res.json()).models.filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace(/^models\//, ""));
    }
    const base = prov === "openai" ? "https://api.openai.com/v1" : settings.baseUrl.trim().replace(/\/+$/, "");
    const res = await httpFetch(base + "/models", {headers: key ? {authorization: `Bearer ${key}`} : {}});
    return (await res.json()).data.map(m => m.id).sort();
  }

  /* ---------- 저장소: IndexedDB ---------- */
  let dbh = null, loaded = false;
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const os = (n, m) => dbh.transaction(n, m).objectStore(n);
  const store = {
    kind: "local", readOnly: false,
    ready: () => loaded,
    describe: () => "문항과 만든 문제는 이 브라우저 안(IndexedDB)에 저장됩니다. 브라우저 데이터를 지우면 사라지므로 가끔 '단원별 ZIP 저장'으로 백업하세요. ZIP 은 '백업 불러오기'로 되살릴 수 있습니다.",
    async start(onChange) {
      try {
        dbh = await new Promise((res, rej) => {
          const r = indexedDB.open("mathgen", 1);
          r.onupgradeneeded = () => { r.result.createObjectStore("exams", {keyPath: "id"}); r.result.createObjectStore("problems", {keyPath: "id"}); };
          r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        });
        for (const e of await req(os("exams", "readonly").getAll())) state.exams.set(e.id, e);
        for (const p of await req(os("problems", "readonly").getAll())) state.problems.set(p.id, p);
      } catch (e) { dbh = null; toast("브라우저 저장소를 열 수 없어 이번에만 임시로 저장합니다. 시크릿 창이 아닌 일반 창에서 여세요."); }
      loaded = true; onChange();
    },
    async saveImage(id, blob) { return {image: await blobToDataURL(blob)}; },
    async putExam(e) { state.exams.set(e.id, e); if (dbh) await req(os("exams", "readwrite").put(e)).catch(() => {}); },
    async putProblem(p) { state.problems.set(p.id, p); if (dbh) await req(os("problems", "readwrite").put(p)).catch(() => {}); },
    async deleteProblem(p) { state.problems.delete(p.id); state.selected.delete(p.id); if (dbh) await req(os("problems", "readwrite").delete(p.id)).catch(() => {}); },
    async deleteExam(id) {
      for (const p of [...state.problems.values()].filter(p => p.examId === id)) await this.deleteProblem(p);
      state.exams.delete(id); if (dbh) await req(os("exams", "readwrite").delete(id)).catch(() => {});
    },
  };

  /* ---------- 설정 화면 ---------- */
  function renderSettingsForm(root) {
    if (root.querySelector("#s-provider")) return; // 입력 중인 값을 지우지 않도록 한 번만 만든다
    root.innerHTML = `
      <div class="panel">
        <h2 style="font-size:18px;margin-bottom:6px">AI 연결</h2>
        <p class="muted">단원 분류, 스캔본 자르기, 문항 풀이, 문제 생성에 쓰는 AI 입니다. 키는 이 컴퓨터의 브라우저에서 선택한 AI 회사로만 전송됩니다.</p>
        <div class="settings-grid">
          <label class="field">AI 제공자<select id="s-provider">${Object.entries(PROVIDERS).map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join("")}</select></label>
          <label class="field">API 키<input id="s-key" type="password" autocomplete="off"></label>
          <label class="field">모델<input id="s-model" type="text" list="s-models" placeholder="모델 이름"><datalist id="s-models"></datalist></label>
          <label class="field" id="s-base-wrap">Base URL (OpenAI 호환)<input id="s-base" type="text" placeholder="https://openrouter.ai/api/v1"></label>
          <label class="field">동시 요청 수<input id="s-conc" type="number" min="1" max="8"></label>
        </div>
        <p class="muted" id="s-help" style="margin:10px 0 0"></p>
        <div class="row" style="margin-top:12px">
          <label><input id="s-remember" type="checkbox"> 이 브라우저에 키 기억</label><span class="spacer"></span>
          <button class="btn" id="s-list">모델 목록 불러오기</button><button class="btn" id="s-test">연결 테스트</button><button class="btn primary" id="s-save">저장</button>
        </div>

async function classifyBatch(ps) {
  const images = await Promise.all(ps.map(problemBlob));
  const list = ps.map((p, i) => `이미지 ${i + 1}: ${p.examTitle} ${p.number}번${p.shared ? ` (공통 자료 [${p.shared}] 사용)` : ""}`).join("\n");
  const data = await ask({system: CLASSIFY_SYSTEM, schema: CLASSIFY_SCHEMA, effort: "high", images,
    text: `이번에 보내는 이미지는 ${ps.length}장이며 순서대로 다음 문항이다.\n${list}\n\n이미지 순서대로 문항마다 객체 하나씩 items 배열에 담아 답하라. index 는 이미지 번호다.`});
  const arr = Array.isArray(data?.items) ? data.items : Array.isArray(data) ? data : null;
  if (!arr) throw new Error("AI 응답 형식이 맞지 않았습니다. 다시 시도하세요.");
  return ps.map((p, i) => {
    const r = arr.find(x => Number(x?.index) === i + 1) || arr[i];
    try { return [p, cleanClassification(r || {})]; } catch (e) { return [p, e]; }
  });
}
async function classifyMany(ids, onProgress) {
  const todo = ids.map(id => state.problems.get(id)).filter(Boolean);
  const size = Math.max(1, PLATFORM.ai.batchSize());
  const batches = []; for (let i = 0; i < todo.length; i += size) batches.push(todo.slice(i, i + size));
  let done = 0; const errors = [];
  await pool(batches, PLATFORM.ai.concurrency(), async batch => {
    if (!aiOK()) { errors.push(PLATFORM.ai.blockedReason()); done += batch.length; onProgress?.(done, todo.length); return; }
    try {
      for (const [p, r] of await classifyBatch(batch)) {
        if (r instanceof Error) { errors.push(`${p.number}번: ${r.message}`); continue; }
        const cur = {...(state.problems.get(p.id) || p), classification: r, unitId: r.primary_unit_id, unitManual: false};
        await PLATFORM.store.putProblem(cur);
        onProgress?.(done, todo.length, cur);
      }
    } catch (e) { errors.push(`${batch.map(p => p.number + "번").join(", ")}: ${e.message}`); }
    done += batch.length; onProgress?.(done, todo.length);
  });
  return [...new Set(errors)];
}
const classifyOne = async id => { const errs = await classifyMany([id]); if (errs.length) throw new Error(errs[0]); return state.problems.get(id); };

const SOLVE_SYSTEM = `너는 한국 수능 수학 전문가다. 이미지의 문항을 처음부터 끝까지 정확히 풀어라. ${SHARED_NOTE}

단원표 (코드: 과목 > 대단원 > 중단원)

  type: "object", additionalProperties: false, required: ["index", "answer", "well_posed", "issues"],

const MARKS = "①②③④⑤";
function normalizeAnswer(a) {
  a = str(a).trim();
  [...MARKS].forEach((m, i) => { a = a.split(m).join(String(i + 1)); });
  a = a.replace(/\\text\{[^}]*\}/g, "").replace(/\\[,;!]/g, "").replace(/[\s$]/g, "").replace(/번$/, "");
  return a.replace(/\\dfrac|\\tfrac/g, "\\frac").replace(/\.$/, "");
}
function splitSteps(t) {
  let parts = str(t).split(/\n+/).map(s => s.replace(/^\s*(?:\(?\d+[.)]|[-•·]|단계\s*\d+\s*[:.)]?)\s*/, "").trim()).filter(Boolean);
  // 한 문단으로 된 예전 풀이는 문장("…다.") 단위로 나눈다
  if (parts.length === 1 && parts[0].length > 60) parts = parts[0].split(/(?<=[다요]\.)\s+/).map(s => s.trim()).filter(Boolean);
  return parts;
}
function problemAsText(q) {
  let t = q.statement;
  if (q.figure_description) t += `\n\n[그림 설명] ${q.figure_description}`;
  if (q.choices?.length) t += "\n\n" + q.choices.map((c, i) => `${MARKS[i] || i + 1} ${c}`).join("  ");
  return t;
}
const aiAnswer = p => str(p.solve?.answer || p.classification?.answer);
const qType = p => p.classification?.question_type || (/^[1-5]$/.test(normalizeAnswer(aiAnswer(p))) ? "5지선다" : "단답형");
function crossCheck(p) {
  const a = p.classification?.answer, b = p.solve?.answer;
  if (!p.solve) return "";
  if (!a || !b) return "판단 불가";
  return normalizeAnswer(a) === normalizeAnswer(b) ? "일치" : "불일치";
}
function grade(p) {
  if (!str(p.officialAnswer).trim() || !aiAnswer(p)) return "";
  return normalizeAnswer(p.officialAnswer) === normalizeAnswer(aiAnswer(p)) ? "정답" : "오답";
}
function originalText(p) {
  const c = p.classification || {};
  const steps = p.solve?.steps?.length ? p.solve.steps : c.solution_steps || splitSteps(c.solution);
  return [`[원본 문제] ${p.examTitle} ${p.number}번${p.shared ? ` (공통 자료 [${p.shared}] 사용)` : ""}`, `단원: ${UNITS[p.unitId]?.label || ""}`,
    `문제 텍스트:\n${c.transcription || ""}`, `그림 설명: ${c.figure_description || "없음"}`,
    `핵심 개념: ${(c.key_concepts || []).join(", ")}`, `핵심 접근법: ${c.solution_approach || ""}`,
    `정답: ${aiAnswer(p)}`, `풀이:\n${(steps || []).map((s, i) => `${i + 1}. ${s}`).join("\n")}`].join("\n");
}
function cleanGenerated(q) {
  const statement = str(q?.statement);
  if (!statement) return null;
  const choices = strArr(q.choices);
  return {
    kind: Object.keys(KINDS).includes(q.kind) ? q.kind : "유사문제", title: str(q.title) || "새 문제", statement,
    choices: choices.length === 5 ? choices : [], figure_description: str(q.figure_description), answer: str(q.answer).trim(),
    solution_steps: strArr(q.solution_steps).length ? strArr(q.solution_steps) : splitSteps(q.solution),
    shared_concepts: strArr(q.shared_concepts), relation_to_original: str(q.relation_to_original),

  };

async function generateFor(id, counts, extra, verify, log = () => {}) {
  let p = state.problems.get(id);
  const wanted = Object.entries(counts).filter(([, n]) => n > 0).map(([k, n]) => `${k} ${n}개`).join(", ");
  if (!wanted) throw new Error("만들 문제 개수를 1개 이상 입력하세요.");
  if (!p.classification) { log("먼저 단원을 분류하는 중…"); p = await classifyOne(id); }
  log("문제를 만드는 중… (1~3분 걸릴 수 있습니다)");
  const data = await ask({system: GEN_SYSTEM, schema: GEN_SCHEMA, effort: "high", images: [await problemBlob(p)], fresh: true,
    text: `${originalText(p)}\n(원본 문제 이미지를 함께 보낸다.)\n\n위 원본 문제를 바탕으로 다음을 만들어라: ${wanted}. 각 문제의 kind 를 정확히 표시하라.${extra ? `\n추가 요청: ${extra}` : ""}`});
  const made = (Array.isArray(data?.problems) ? data.problems : Array.isArray(data) ? data : []).map(cleanGenerated).filter(Boolean);
  if (!made.length) throw new Error("AI 가 문제를 돌려주지 않았습니다. 다시 시도하세요.");
  if (verify) {
    log(`검산 중… (${made.length}문제를 처음 보는 사람처럼 다시 풉니다)`);
    try {
      const vs = await ask({system: VERIFY_SYSTEM, schema: VERIFY_SCHEMA, effort: "high", fresh: true,
        text: made.map((q, i) => `[문제 ${i + 1}] (${q.choices.length ? "5지선다" : "단답형"})\n${problemAsText(q)}`).join("\n\n") + "\n\n문제마다 객체 하나씩 items 배열에 담아 답하라. index 는 문제 번호다."});
      const arr = Array.isArray(vs?.items) ? vs.items : Array.isArray(vs) ? vs : [];
      made.forEach((q, i) => {
        const v = arr.find(x => Number(x?.index) === i + 1) || arr[i];
        if (!v) { q.verification = {passed: false, error: "검산 결과가 비어 있습니다"}; return; }
        const ans = str(v.answer).trim(), ok = normalizeAnswer(ans) === normalizeAnswer(q.answer), wp = v.well_posed !== false;
        q.verification = {answer: ans, well_posed: wp, issues: str(v.issues), answer_match: ok, passed: ok && wp};
      });
    } catch (e) { made.forEach(q => { q.verification = {passed: false, error: e.message}; }); }
  }
  const cur = state.problems.get(id);
  await PLATFORM.store.putProblem({...cur, generated: [...(cur.generated || []), ...made]});
  return made;
}

function choiceNo(a) { const n = normalizeAnswer(a); return /^[1-5]$/.test(n) ? +n : 0; }
// type 이 5지선다면 ①~⑤ 칸, 아니면 숫자 칸. mine=true 면 사용자가 고르는 칸(검은 테두리)
function answerHTML(answer, type, {mine = false, editable = false} = {}) {
  if (type === "5지선다") {
    const k = choiceNo(answer);
    const bubbles = [1, 2, 3, 4, 5].map(i => {
      const cls = `bubble ${mine ? "mine" : ""} ${k === i ? "fill" : ""}`;
      return editable ? `<button type="button" class="${cls}" data-pick="${i}" aria-label="${i}번" aria-pressed="${k === i}">${i}</button>`
        : `<span class="${cls}" aria-hidden="true">${i}</span>`;
    }).join("");
    return editable ? `<span class="omr" role="group" aria-label="실제 정답 고르기">${bubbles}</span>`
      : `<span class="omr" role="img" aria-label="${k ? k + "번" : "정답 없음"}">${bubbles}</span>`;
  }
  const a = normalizeAnswer(answer);
  if (/^\d{1,3}$/.test(a)) {
    const d = a.padStart(3, " ");
    return `<span class="digits" aria-label="${a}">${[...d].map(c => `<span class="digit ${c === " " ? "empty" : ""}">${c === " " ? "0" : c}</span>`).join("")}</span>`;
  }
  return a ? `<span class="ans-text math">${esc(answer)}</span>` : `<span class="muted">—</span>`;
}

      <div class="checks"></div>
      <div class="row" style="margin:12px 0 10px"><h3 style="font-size:16px">자른 문항</h3><span class="muted">잘못 잘린 조각은 ✕ 로 지우세요.</span><span class="spacer"></span>
        <button class="btn primary go">단원 분류·풀이 시작</button><button class="btn lib">저장소에서 보기</button><button class="btn danger del">이 시험 삭제</button></div>
      <div class="grid crops"></div>
    </div>`;
  $("#jobs").prepend(job);
  const q = s => job.querySelector(s);
  const log = msg => { q(".log").textContent += msg + "\n"; q(".log").scrollTop = 1e9; };
  const status = (msg, pct) => { q(".status").textContent = msg; if (pct != null) q(".progress>div").style.width = pct + "%"; };
  let running = false;
  const mine = () => [...state.problems.values()].filter(p => p.examId === examId).sort((a, b) => a.order - b.order);
  const renderCrops = () => {
    if (!job.isConnected) { jobRenderers.delete(renderCrops); return; }
    const ps = mine();
    q(".crops").innerHTML = ps.map(p => cardHTML(p, {deletable: canEdit()})).join("");
    bindCards(q(".crops"), ps.map(p => p.id));
    q(".go").hidden = !aiOK() || !canEdit();
    q(".go").disabled = running || !ps.some(p => !p.classification || ($("#auto-solve").checked && !p.solve));
  };
  async function runAI() {
    const todo = mine().filter(p => !p.classification).map(p => p.id);
    const toSolve = $("#auto-solve").checked ? mine().filter(p => !p.solve).map(p => p.id) : [];
    if (!todo.length && !toSolve.length) { status("모두 처리했습니다", 100); return; }
    running = true; renderCrops();
    const errors = [];
    if (todo.length) {
      status(`단원 분류·풀이 중… 0/${todo.length}`, 30);
      errors.push(...await classifyMany(todo, (n, total, p) => {
        status(`단원 분류·풀이 중… ${n}/${total}`, 30 + 50 * n / total);
        if (p?.unitId) log(`${p.number}번 → ${UNITS[p.unitId].label} · 난이도 ${p.classification.difficulty} · AI 정답 ${p.classification.answer || "?"}`);
        renderCrops();
      }));
    }
    if (toSolve.length) {
      let n = 0;
      await pool(toSolve, PLATFORM.ai.concurrency(), async id => {
        const p0 = state.problems.get(id);
        try { const p = await solveProblem(id); log(`${p.number}번 교차 풀이 → 정답 ${p.solve.answer || "?"} (${crossCheck(p) || "-"})`); }
        catch (e) { errors.push(`${p0.number}번 풀이: ${e.message}`); }
        status(`교차 풀이 중… ${++n}/${toSolve.length}`, 80 + 20 * n / toSolve.length); renderCrops();
      });
    }
    errors.forEach(e => log("실패: " + e));
    running = false;
    status(errors.length ? `완료 (실패 ${errors.length}건, 버튼을 다시 누르면 실패한 것만 다시 합니다)` : "단원 분류·풀이 완료", 100);
    renderCrops();
  }
  try {
    const mode = $("#split-mode").value;
    if (mode === "vision" && !aiOK()) throw new Error("AI 이미지 인식을 쓸 수 없습니다. 자르기 방식을 '자동'으로 바꾸세요.");
    status("PDF 분석 중…", 5);
    const {crops, checks, pages, groups} = await splitPdf(await file.arrayBuffer(), mode, log);
    if (!crops.length) throw new Error("문항 번호를 찾지 못했습니다. 스캔본이라면 자르기 방식을 'AI 이미지 인식'으로 바꿔 다시 넣으세요.");
    const title = q(".title").value.trim() || stem;
    status("문항 이미지 저장 중…", 20);
    await PLATFORM.store.putExam({id: examId, title, fileName: file.name, pages, addedAt: new Date().toISOString()});
    for (const c of crops) {
      const id = `${examId}-q${pad2(c.order)}`;
      blobCache.set(id, c.blob);
      const img = await PLATFORM.store.saveImage(id, c.blob);
      await PLATFORM.store.putProblem({id, examId, examTitle: title, order: c.order, number: c.number, section: c.section, page: c.page + 1,
        ...img, shared: c.shared || null, classification: null, unitId: null, solve: null, officialAnswer: "", generated: []});
    }
    const gaps = [];
    for (let i = 1; i < crops.length; i++) { const a = crops[i - 1], b = crops[i]; if (b.section === a.section && b.number !== a.number + 1) gaps.push(`${a.number}→${b.number}`); }
    log(`문항 ${crops.length}개: ${crops.map(c => c.number).join(", ")}`);
    if (groups.length) log(`공통 자료 ${groups.length}개: ${groups.map(g => `[${g}]`).join(", ")} → 해당 문항 이미지 위에 붙였습니다.`);
    if (gaps.length) log(`번호가 건너뛴 곳: ${gaps.join(", ")}. 아래 페이지 이미지를 확인하세요.`);
    status(`자르기 완료: 문항 ${crops.length}개`, 30);
    q(".review").hidden = false;
    q(".checks").innerHTML = checks.map((c, i) => `<img src="${c}" alt="${i + 1}쪽 자른 영역">`).join("");
    q(".checks").querySelectorAll("img").forEach(img => img.onclick = () => { $("#zoom-img").src = img.src; $("#zoom").showModal(); });
    jobRenderers.add(renderCrops); renderCrops();
    if ($("#auto-classify").checked && aiOK()) await runAI();
    else status(`자르기 완료: 문항 ${crops.length}개${aiOK() ? "" : " (AI 가 없어 미분류)"}`, 100);
  } catch (e) {
    console.error(e); status("오류", 100); log("오류: " + (e?.message || e));
  }
  q(".title").onchange = async () => {
    const t = q(".title").value.trim(), exam = state.exams.get(examId); if (!t || !exam) return;
    await PLATFORM.store.putExam({...exam, title: t});
    for (const p of mine()) await PLATFORM.store.putProblem({...p, examTitle: t});
    toast("시험 이름을 바꿨습니다");
  };
  q(".go").onclick = () => runAI();
  q(".lib").onclick = () => { showTab("library"); $("#f-exam").value = examId; state.filter.unit = null; renderGrid(); };
  q(".del").onclick = async () => {
    if (!(await askConfirm("이 시험과 자른 문항을 모두 삭제할까요?", "삭제"))) return;
    jobRenderers.delete(renderCrops); await PLATFORM.store.deleteExam(examId); job.remove(); toast("삭제했습니다");
  };
}

function bindCards(root, ids) {

["#q", "#f-exam", "#f-diff"].forEach(s => $(s).oninput = () => renderGrid());
function searchHay(p) {
  const c = p.classification || {};
  return [p.examTitle, c.transcription, (c.key_concepts || []).join(" "), c.solution_approach, UNITS[p.unitId]?.label, p.shared].join(" ").toLowerCase();
}
const unitOrder = p => (p.unitId ? UNIT_IDS.indexOf(p.unitId) : 1e9);
function filteredProblems(ignoreUnit = false) {
  const text = $("#q").value.trim().toLowerCase(), exam = $("#f-exam").value, diff = $("#f-diff").value;
  return [...state.problems.values()].filter(p => {
    if (exam && p.examId !== exam) return false;
    if (diff && String(p.classification?.difficulty) !== diff) return false;
    if (!ignoreUnit && state.filter.unit) {
      const f = state.filter.unit;
      if (f === "_none") { if (p.unitId) return false; }
      else if (!p.unitId || !(p.unitId === f || p.unitId.startsWith(f + "-"))) return false;
    }
    return !text || searchHay(p).includes(text);
  }).sort((a, b) => unitOrder(a) - unitOrder(b) || str(a.examTitle).localeCompare(str(b.examTitle)) || a.order - b.order);
}
function examOptions(sel) {
  const cur = sel.value;
  sel.innerHTML = `<option value="">모든 시험</option>` + [...state.exams.values()].sort((a, b) => str(b.addedAt).localeCompare(str(a.addedAt)))
    .map(e => `<option value="${esc(e.id)}">${esc(e.title)}</option>`).join("");
  sel.value = state.exams.has(cur) ? cur : "";
}
function renderLibrary() { examOptions($("#f-exam")); renderGrid(); }
function renderTree() {
  const ps = filteredProblems(true), count = {};
  for (const p of ps) {
    const key = p.unitId || "_none"; count[key] = (count[key] || 0) + 1;
    if (p.unitId) { const [code, ci] = p.unitId.split("-"); count[code] = (count[code] || 0) + 1; count[`${code}-${ci}`] = (count[`${code}-${ci}`] || 0) + 1; }
  }
  const node = (key, label, cls) => `<button class="node ${cls} ${state.filter.unit === key ? "sel" : ""} ${count[key] ? "" : "empty"}" data-k="${key}"><span>${esc(label)}</span><span class="n">${count[key] || ""}</span></button>`;
  let h = `<button class="node l1 ${state.filter.unit ? "" : "sel"}" data-k=""><span>전체</span><span class="n">${ps.length}</span></button>`;
  for (const [code, subject, chapters] of TREE) {
    h += node(code, subject, "l1");
    if (!count[code] && state.filter.unit?.split("-")[0] !== code) continue;
    chapters.forEach(([chapter, sections], ci) => {
      h += node(`${code}-${ci + 1}`, chapter, "l2");
      sections.forEach((s, ki) => { h += node(`${code}-${ci + 1}-${ki + 1}`, s, "l3"); });
    });
  }
  h += node("_none", "미분류", "l1");
  $("#tree").innerHTML = h;
  $("#tree").querySelectorAll(".node").forEach(n => n.onclick = () => { state.filter.unit = n.dataset.k || null; renderGrid(); });
}
function renderGrid() {
  renderTree();
  const ps = filteredProblems(), f = state.filter.unit;
  const where = !f ? "전체" : f === "_none" ? "미분류" : (UNITS[f]?.label || (() => {
    const [code, ci] = f.split("-"); const t = TREE.find(x => x[0] === code);
    return ci ? `${t[1]} > ${t[2][ci - 1][0]}` : t[1];
  })());
  $("#lib-status").textContent = state.ready ? `${where} · ${ps.length}문항` : "저장소를 불러오는 중…";
  $("#grid").innerHTML = ps.length ? ps.map(p => cardHTML(p)).join("")
    : `<div class="empty-state">${state.problems.size ? "조건에 맞는 문항이 없습니다." : "아직 문항이 없습니다. ① PDF 넣기에서 모의고사를 추가하세요."}</div>`;
  bindCards($("#grid"), ps.map(p => p.id));
}
async function runBatch(ids, fn, label) {
  const st = $("#t-status");
  if (!ids.length) { st.textContent = "먼저 표에서 문항을 선택하세요."; return []; }
  let n = 0; const errors = [];
  st.textContent = `${label} 0/${ids.length}`;
  await pool(ids, PLATFORM.ai.concurrency(), async id => {
    try { await fn(id); } catch (e) { errors.push(`${state.problems.get(id)?.number}번: ${e.message}`); }
    st.textContent = `${label} ${++n}/${ids.length}`; if (currentTab() === "table") renderTable();
  });
  st.textContent = errors.length ? `${label} 완료 (실패 ${errors.length}건: ${errors.slice(0, 2).join(" / ")})` : `${label} 완료`;
  return errors;
}
$("#btn-classify-all").onclick = async () => {

const ansCell = p => { const a = aiAnswer(p); return qType(p) === "5지선다" && choiceNo(a) ? MARKS[choiceNo(a) - 1] : normalizeAnswer(a); };
const COLS = [
  {k: "exam", t: "시험", v: p => p.examTitle},
  {k: "num", t: "번호", v: p => p.number, num: true},
  {k: "shared", t: "공통 자료", v: p => p.shared || ""},
  {k: "subject", t: "과목", v: p => UNITS[p.unitId]?.subject || ""},
  {k: "chapter", t: "대단원", v: p => UNITS[p.unitId]?.chapter || ""},
  {k: "section", t: "중단원", v: p => UNITS[p.unitId]?.section || ""},
  {k: "type", t: "유형", v: p => p.classification?.question_type || ""},
  {k: "diff", t: "난이도", v: p => p.classification?.difficulty || "", num: true},
  {k: "ai", t: "AI 정답", v: ansCell, ans: true},
  {k: "cross", t: "교차 확인", v: crossCheck},
  {k: "official", t: "실제 정답", v: p => str(p.officialAnswer)},
  {k: "grade", t: "채점", v: grade},
  {k: "concepts", t: "핵심 개념", v: p => (p.classification?.key_concepts || []).join(", "), wrap: true},
  {k: "approach", t: "핵심 접근법", v: p => p.classification?.solution_approach || "", wrap: true},
  {k: "gen", t: "만든 문제", v: p => p.generated?.length || 0, num: true},
];
["#t-q", "#t-exam", "#t-subj", "#t-state"].forEach(s => $(s).oninput = () => renderTable());
function tableRows() {
  const text = $("#t-q").value.trim().toLowerCase(), exam = $("#t-exam").value, subj = $("#t-subj").value, st = $("#t-state").value;
  const rows = [...state.problems.values()].filter(p => {
    if (exam && p.examId !== exam) return false;
    if (subj && UNITS[p.unitId]?.subject !== subj) return false;
    if (st === "unclassified" && p.classification) return false;
    if (st === "unsolved" && p.solve) return false;
    if (st === "mismatch" && crossCheck(p) !== "불일치") return false;
    if (st === "wrong" && grade(p) !== "오답") return false;
    return !text || searchHay(p).includes(text);
  });
  const {key, dir} = state.sort, col = COLS.find(c => c.k === key);
  rows.sort((a, b) => {
    if (col) {
      const x = col.v(a), y = col.v(b);
      const r = col.num ? (Number(x) || 0) - (Number(y) || 0) : String(x).localeCompare(String(y), "ko");
      if (r) return r * dir;
    }
    return str(a.examTitle).localeCompare(str(b.examTitle)) || a.order - b.order;
  });
  return rows;
}
function renderTable(refreshOptions = false) {

  const body = rows.map(p => `<tr data-id="${esc(p.id)}"><td><input type="checkbox" class="sel" ${state.selected.has(p.id) ? "checked" : ""} aria-label="${p.number}번 선택"></td>${COLS.map(c => {
    if (c.k === "official") return `<td><input type="text" class="off" value="${esc(p.officialAnswer || "")}" aria-label="${p.number}번 실제 정답" ${canEdit() ? "" : "disabled"}></td>`;

    if (c.k === "cross" && v) return `<td><span class="chip ${v === "일치" ? "ok" : v === "불일치" ? "warn" : ""}">${esc(v)}</span></td>`;
    if (c.k === "grade" && v) return `<td><span class="chip ${v === "정답" ? "ok" : "bad"}">${esc(v)}</span></td>`;

  $("#sheet").innerHTML = `<thead>${head}</thead><tbody>${body || `<tr><td colspan="${COLS.length + 2}" class="muted">문항이 없습니다.</td></tr>`}</tbody>`;

  $("#sheet").querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {

    tr.querySelector(".open").onclick = () => openDetail(id, ids);
    tr.querySelector(".off").onchange = async e => { const p = state.problems.get(id); if (p) { await PLATFORM.store.putProblem({...p, officialAnswer: e.target.value.trim()}); renderTable(); } };

function exportRows(rows) {
  return rows.map(p => {
    const r = {};
    for (const c of COLS) r[c.t] = c.v(p);
    const steps = p.solve?.steps?.length ? p.solve.steps : p.classification?.solution_steps || splitSteps(p.classification?.solution);
    r["단원 코드"] = p.unitId || "";
    r["풀이 과정"] = (steps || []).map((s, i) => `${i + 1}. ${s}`).join("\n");
    r["풀이 확신"] = confLabel(p.solve?.confidence);
    r["옮겨 적은 문제"] = p.classification?.transcription || "";
    r["문항 ID"] = p.id;
    return r;
  });
}
function generatedRows(rows) {
  const out = [];
  for (const p of rows) (p.generated || []).forEach((g, i) => out.push({
    "원본 시험": p.examTitle, "원본 번호": p.number, "순번": i + 1, "유형": g.kind, "제목": g.title, "단원": UNITS[g.unit_id]?.label || "",
    "난이도": g.difficulty, "문제": g.statement, "선택지": (g.choices || []).map((c, j) => `${MARKS[j]} ${c}`).join("  "), "그림 설명": g.figure_description,
    "정답": g.answer, "풀이 과정": (g.solution_steps || splitSteps(g.solution)).map((s, j) => `${j + 1}. ${s}`).join("\n"), "원본과의 관계": g.relation_to_original,
    "검산": !g.verification ? "" : g.verification.error ? "검산 실패" : g.verification.passed ? "통과" : `불일치 (다시 푼 답: ${g.verification.answer})`,
  }));
  return out;
}
$("#t-xlsx").onclick = async () => {
  if (!window.XLSX) return toast("엑셀 라이브러리를 불러오지 못했습니다. CSV 저장을 이용하세요.");
  const rows = tableRows(); if (!rows.length) return toast("저장할 문항이 없습니다");
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(exportRows(rows));
  ws["!cols"] = [18, 6, 9, 12, 16, 18, 8, 7, 8, 9, 9, 6, 30, 40, 9, 12, 60, 9, 50, 24].map(w => ({wch: w}));
  ws["!autofilter"] = {ref: ws["!ref"]};
  XLSX.utils.book_append_sheet(wb, ws, "문항");
  const gen = generatedRows(rows);
  if (gen.length) {
    const ws2 = XLSX.utils.json_to_sheet(gen);
    ws2["!cols"] = [18, 8, 6, 12, 20, 30, 7, 60, 40, 30, 8, 60, 40, 20].map(w => ({wch: w}));

  const buf = XLSX.write(wb, {bookType: "xlsx", type: "array"});

};
$("#t-csv").onclick = async () => {
  const rows = exportRows(tableRows()); if (!rows.length) return toast("저장할 문항이 없습니다");
  const keys = Object.keys(rows[0]), cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = "﻿" + [keys.map(cell).join(","), ...rows.map(r => keys.map(k => cell(r[k])).join(","))].join("\r\n");
  await saveFile(`문항표_${new Date().toISOString().slice(0, 10)}.csv`, new Blob([csv], {type: "text/csv"}));

function unitSelectHTML(selected) {
  let h = `<option value="">(미분류)</option>`;
  for (const [code, subject, chapters] of TREE) {
    h += `<optgroup label="${esc(subject)}">`;
    chapters.forEach(([chapter, sections], ci) => sections.forEach((s, ki) => {
      const id = `${code}-${ci + 1}-${ki + 1}`;
      h += `<option value="${id}" ${id === selected ? "selected" : ""}>${esc(chapter)} › ${esc(s)}</option>`;
    }));
    h += `</optgroup>`;
  }
  return h;
}

function bindDetail(p) {
  const d = $("#detail"), q = s => d.querySelector(s), id = p.id, cur = () => state.problems.get(id);
  const msg = t => { const m = q(".msg") || q(".gen-msg"); if (m) m.textContent = t; };
  const busy = async (btn, label, fn) => {
    btn.disabled = true; msg(label);
    try { await fn(); renderDetail(); } catch (e) { msg(e.message); btn.disabled = false; }
  };
  d.querySelectorAll(".do-classify").forEach(b => b.onclick = () => busy(b, "분류하고 푸는 중…", () => classifyOne(id)));
  d.querySelectorAll(".do-solve").forEach(b => b.onclick = () => busy(b, "푸는 중…", () => solveProblem(id)));
  d.querySelectorAll(".seg-mini button").forEach(b => b.onclick = () => { detailState.solSource = b.dataset.src; renderDetail(); });
  d.querySelectorAll("[data-pick]").forEach(b => b.onclick = async () => {
    const v = b.dataset.pick, now = str(cur().officialAnswer);
    await PLATFORM.store.putProblem({...cur(), officialAnswer: normalizeAnswer(now) === v ? "" : v}); renderDetail();
  });
  if (q(".official")) q(".official").onchange = async e => { await PLATFORM.store.putProblem({...cur(), officialAnswer: e.target.value.trim()}); renderDetail(); };
  if (q(".unit")) q(".unit").onchange = async e => { await PLATFORM.store.putProblem({...cur(), unitId: e.target.value || null, unitManual: true}); renderDetail(); };
  if (q(".save-img")) q(".save-img").onclick = async () => saveFile(`${safeFile(p.examTitle)}_${pad2(p.number)}번.png`, await problemBlob(cur()));
  if (q(".del-p")) q(".del-p").onclick = async () => {
    if (!(await askConfirm(`${p.number}번 문항을 삭제할까요?`, "삭제"))) return;
    const list = detailState.list, pos = list.indexOf(id);
    await PLATFORM.store.deleteProblem(cur()); detailState.list = list.filter(x => x !== id);
    const next = detailState.list[Math.min(pos, detailState.list.length - 1)];
    if (next) openDetail(next); else d.close();
    toast("삭제했습니다");
  };
  if (q(".do-gen")) q(".do-gen").onclick = async () => {
    const counts = {"유사문제": +q(".n-sim").value || 0, "변형문제": +q(".n-var").value || 0, "개념연계문제": +q(".n-con").value || 0};
    const b = q(".do-gen"); b.disabled = true;
    try {
      const made = await generateFor(id, counts, q(".extra").value.trim(), q(".verify").checked, t => { q(".gen-msg").textContent = t; });
      renderDetail();
      const bad = made.filter(m => m.verification && !m.verification.passed).length;
      toast(`${made.length}문제를 만들었습니다` + (bad ? ` (검산 불일치 ${bad}개는 꼭 확인하세요)` : ""));
    } catch (e) { q(".gen-msg").textContent = e.message; b.disabled = false; }
  };
  d.querySelectorAll(".g-del").forEach(b => b.onclick = async () => {
    const i = +b.closest(".gen").dataset.i, x = cur();
    await PLATFORM.store.putProblem({...x, generated: (x.generated || []).filter((_, k) => k !== i)}); renderDetail();
  });
  if (q(".save-sheet")) q(".save-sheet").onclick = async () => saveFile(`${safeFile(p.examTitle)}_${pad2(p.number)}번_연계문제.html`, new Blob([await worksheetHTML(cur())], {type: "text/html"}));
}

$("#btn-zip").onclick = async () => {
  if (!state.problems.size) return toast("저장할 문항이 없습니다");
  const b = $("#btn-zip"); b.disabled = true; b.textContent = "ZIP 만드는 중…";
  try { await saveFile(`문제저장소_${new Date().toISOString().slice(0, 10)}.zip`, await buildZip()); }
  catch (e) { toast("ZIP 을 만들지 못했습니다: " + e.message); }
  b.disabled = false; b.textContent = "단원별 ZIP 저장";
};
async function exportEntries() {
  const entries = [], problems = [];
  for (const p of state.problems.values()) {
    const blob = await problemBlob(p), u = UNITS[p.unitId];
    const name = `${safeFile(p.examTitle)}_${pad2(p.number)}번${p.section ? `_구간${p.section + 1}` : ""}.png`;
    entries.push([`시험별/${safeFile(p.examTitle)}/${name}`, blob]);
    entries.push([`단원별/${u ? unitPath(u) : "99_미분류"}/${name}`, blob]);
    if (p.generated?.length) entries.push([`연계문제/${name.replace(/\.png$/, "")}.html`, await worksheetHTML(p)]);
    const {imageId, ...meta} = p;
    problems.push({...meta, image: await blobToDataURL(blob), unitLabel: u?.label || null});
  }
  entries.push(["index.json", JSON.stringify(problems.map(({image, ...m}) => m), null, 2)]);
  entries.push(["backup.json", JSON.stringify({format: "mathgen-backup", version: 3, exportedAt: new Date().toISOString(), exams: [...state.exams.values()], problems})]);
  return entries;
}
async function buildZip() {
  const zip = new JSZip();
  for (const [path, data] of await exportEntries()) zip.file(path, data);
  return zip.generateAsync({type: "blob"});
}
$("#btn-folder").onclick = () => PLATFORM.folderSave?.(exportEntries);
$("#btn-import").onclick = () => $("#import-file").click();
$("#import-file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const zip = await JSZip.loadAsync(f), entry = zip.file("backup.json");
    if (!entry) throw new Error("backup.json 이 없는 ZIP 입니다.");
    const data = JSON.parse(await entry.async("string"));
    if (data.format !== "mathgen-backup") throw new Error("이 프로그램의 백업 파일이 아닙니다.");
    toast("불러오는 중…");
    for (const ex of data.exams) await PLATFORM.store.putExam(ex);
    for (const p of data.problems) {
      const blob = dataURLtoBlob(p.image); blobCache.set(p.id, blob);
      const img = await PLATFORM.store.saveImage(p.id, blob);
      await PLATFORM.store.putProblem({...p, ...img});
    }
    toast(`불러왔습니다: 시험 ${data.exams.length}개, 문항 ${data.problems.length}개`);
    renderLibrary();
  } catch (err) { toast("불러오기 실패: " + err.message); }
};

/* =====================================================================
   화면: 설정 / 정보
   ===================================================================== */
function renderSettings() {
  PLATFORM.settings.render($("#settings-root"));
  $("#store-desc").textContent = PLATFORM.store.describe();
  const ps = [...state.problems.values()];
  const gen = ps.reduce((s, p) => s + (p.generated?.length || 0), 0);
  $("#store-stats").textContent = `시험 ${state.exams.size}개 · 문항 ${ps.length}개 (분류 ${ps.filter(p => p.unitId).length}개, 교차 풀이 ${ps.filter(p => p.solve).length}개) · 만든 문제 ${gen}개`;
  $("#btn-wipe").hidden = !canEdit();
}
$("#btn-wipe").onclick = async () => {
  if (!(await askConfirm("저장된 모든 시험·문항·만든 문제를 삭제할까요? 되돌릴 수 없습니다.", "모두 삭제"))) return;
  const b = $("#btn-wipe"); b.disabled = true;
  for (const id of [...state.exams.keys()]) await PLATFORM.store.deleteExam(id);
  for (const p of [...state.problems.values()]) await PLATFORM.store.deleteProblem(p);
  b.disabled = false; $("#jobs").innerHTML = ""; jobRenderers.clear(); $("#ingest-empty").hidden = false; state.selected.clear();
  toast("모두 삭제했습니다"); onStoreChange();
};

/* =====================================================================
   시작
   ===================================================================== */
(async function init() {
  $("#settings-tab").textContent = PLATFORM.settings.label;
  updateStatus();
  if (!window.pdfjsLib || !window.JSZip) toast("필요한 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.");
  else pdfjsLib.GlobalWorkerOptions.workerSrc = PLATFORM.pdfWorker;
  await PLATFORM.init();
  updateStatus();
  PLATFORM.store.start(() => { state.ready = PLATFORM.store.ready(); onStoreChange(); });
})();

</script>
